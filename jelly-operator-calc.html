table{width:100%;border-collapse:collapse;font-size:.8rem}th{text-align:left;color:var(--text2);border-bottom:1px solid #445;padding:6px;position:sticky;top:0;background:var(--bg2)}td{padding:6px;border-bottom:1px solid #ffffff0c}.num{text-align:right;font-variant-numeric:tabular-nums}.table-scroll{overflow:auto;max-height:650px}

<body>
<h1><a class="home" href="index.html">Home</a><span>Jelly Operator Optimizer</span></h1>
<div id="save-area"></div>
<main class="main" id="main-content"><p class="note" style="text-align:center;padding:40px">Load a save.</p></main>
<div id="jelly-js-tooltip" class="js-tooltip" role="tooltip" aria-hidden="true"></div>
<script type="module">
import { saveData } from './js/state.js';
import { initSaveLoader } from './js/ui/save-loader.js';
import { fmtVal } from './js/renderers/format.js';
import { renderBreakdownTree, resetTreeCounter } from './js/ui/dash-breakdowns.js';
import { CELL_NAMES, JELLY_COLS, JELLY_OBSTRUCTION_SLOTS, JELLY_SIZE, jellyRewards, jellyRewardTarget, jellySlotPlots, jellyUpgradeData, jellyUpgradeOrder } from './js/stats/data/w7/jelly-operator.js';
import * as J from './js/stats/systems/w7/jelly-operator.js';

const FEVER_MODES=[
  {name:'COLD',bonus:'+1% all damage each elapsed second'},
  {name:'RASH',bonus:'2.00x all damage'},
  {name:'SEPSIS',bonus:'2.00x Bloodcell gains'},
  {name:'NAUSEA',bonus:'2.00x EXP gains for all cells'},
  {name:'RABIES',bonus:'1.50x all damage and 1.25x all speed'},
  {name:'PLAGUE',bonus:'1.40x all speed'},
];
const JELLY_CELL_PITCH=37;
const JELLY_GRID_PADDING=4;
const JELLY_RENDER_SCALE=1;
const JELLY_OBSTRUCTION_SIZE=50*3*JELLY_RENDER_SCALE; // The game renders the 50px source at 300%.
const CELL_SPRITE_SIZES=[[36,36],[73,36],[36,109],[110,110],[73,73],[36,36],[147,147],[184,183]];

let optimized = null;
let optimizedStale = false;
let upgradeAnalysis = null;
let upgradeAnalysisStale = false;
let sectionAnalysis = null;
let sectionAnalysisStale = false;
let currentPolicy = null;
let simulator = null;
let purchaseControls={strategy:'progression',objective:'clear',expCellType:-1,purchases:3,planningDays:30,quality:'thorough',lookahead:2,reoptimize:false,budget:true};
let sectionControls={strategy:'progression',objective:'clear',expCellType:-1,tokens:null,quality:'thorough',beamWidth:8};
let optimizerControls={mode:'bounded',objective:'clear',expCellType:-1,obstruction:null,beamWidth:12,iterations:20,savedRefinementRounds:3,refinementRounds:4,searchStarts:8,searchWorkers:4,adaptiveSearch:true,adaptiveMinStarts:4,adaptiveConvergenceWindow:4,virusSearchMode:'balanced',finalistCount:8,simulationTrials:256,adaptiveMaxTrials:2048,exactNodeBudget:1000000,exactTimeBudgetMs:10000,exactRequireFullCoverage:true,exactDeterministicNodeBudget:true,certifyWindow:4,certifyStride:1,certifyCoordinationDepth:2,certifyNonlocalPairs:8,certifyAdaptiveRegions:8,certifyDependencyRegions:8,certifyScoreModel:'deterministic-proxy',certifySampledTrials:16,certifyJointPolicy:false,certifyNodeBudget:5000000,certifyTimeBudgetMs:60000,certifyDeterministicNodeBudget:true,certifyIterative:true,certifyMoveNeighborhood:true,certifyMaxPasses:8,certifyRepackCells:3};
let activeTab = 'overview';
let jellyWorker = null;
let jellyCertificationWorkers = [];
let jellySearchWorkers = [];
let jellyWarmSearchWorkers = [];
let jellySearchControl = null;
let jellyLiveSearch = null;
let jellySearchCrossedRefresh = false;
let workerRequestId = 0;
let workerProgress = null;
let jellyAuditWorkers = [];
let auditRequestId = 0;
let auditProgress = null;
let postSelectionAudit = null;
let auditState = null;
let workerError = '';
let jellyCheckpointInventory = null;
let spoilersVisible = false;
let policyRefreshPending = false;
initSaveLoader({
  target:'#save-area',
  auth:true,
  onLoad:async(_state,_raw,metadata)=>{
    await refreshJellyCheckpointInventory(false);
    const automatic=metadata?.source==='auto-refresh';
    const activeLongRun=automatic&&(jellyWorker||jellyCertificationWorkers.length||jellySearchWorkers.length)&&['layout','certify','certifyLocal','sections','purchases'].includes(workerProgress?.operation);
    if(automatic&&optimized)optimizedStale=true;
    if(automatic&&upgradeAnalysis)upgradeAnalysisStale=true;
    if(automatic&&sectionAnalysis)sectionAnalysisStale=true;
    if(activeLongRun){
      if(workerProgress?.operation==='layout')jellySearchCrossedRefresh=true;
      optimizedStale=true;
      if(workerProgress?.operation==='purchases')upgradeAnalysisStale=true;
      if(workerProgress?.operation==='sections')sectionAnalysisStale=true;
      currentPolicy=null;
      simulator=makeSimulatorState();
      policyRefreshPending=true;
      render();
      return;
    }
    stopJellyWorker();
    stopJellyAudit();
    if(!automatic){
      clearJellyWarmSearchWorkers();
      optimized=null;
      optimizedStale=false;
      upgradeAnalysis=null;
      upgradeAnalysisStale=false;
      sectionAnalysis=null;
      sectionAnalysisStale=false;
      postSelectionAudit=null;
      auditState=null;
    }
    currentPolicy=null;
    simulator=makeSimulatorState();
    policyRefreshPending=false;
    workerError='';
    const layout=J.jellyLayoutFromSave(saveData);
    if(!automatic)await restoreJellyOptimizerCheckpoint(layout);
    render();
    if(optimized?.operation&&optimized?.savedOperation)startParallelJellyAudit();
    else startJellyWorker('policy',{layout,options:{objective:'clear',trials:24,screeningTrials:3,seed:randomSeed()}});
  },
});

function fmt(value){return fmtVal(Number(value)||0)}
function pct(value){return ((Number(value)||0)*100).toFixed(2)+'%'}
function signed(value,digits=2){const number=Number(value)||0;return `${number>=0?'+':''}${number.toFixed(digits)}`}
function signedPct(value){return signed((Number(value)||0)*100)+'%'}
function compactAge(seconds){
  const value=Math.max(0,Number(seconds)||0);
  if(value<60)return `${Math.floor(value)} sec`;
  if(value<3600)return `${Math.floor(value/60)} min`;
  if(value<86400)return `${Math.floor(value/3600)} hr`;
  return `${Math.floor(value/86400)} day`;
}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function tooltipIcon(text,label='More information'){return `<span class="tooltip-icon" tabindex="0" role="img" aria-label="${esc(label)}" data-tooltip="${esc(text)}">i</span>`}
function card(label,value,sub='',tooltip=''){
  return `<div class="card"><div class="label">${esc(label)}${tooltip?tooltipIcon(tooltip,`${label} details`):''}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function feverModeName(index){return FEVER_MODES[index]?.name||`Fever ${index+1}`}
function feverizerTooltip(){
  const unlocked=Math.min(FEVER_MODES.length,J.jellyUpgradeLevel(saveData,16));
  const visible=spoilersVisible?FEVER_MODES.length:unlocked;
  if(visible<=0)return 'No Fever modes unlocked yet.';
  const heading=spoilersVisible?'Fever modes by upgrade level:':'Unlocked Fever modes:';
  return heading+'\n'+FEVER_MODES.slice(0,visible).map((mode,index)=>`Level ${index+1}: ${mode.name} - ${mode.bonus}`).join('\n');
}
function stronkroidTooltip(){
  return 'One activation per operation. Stronkroid lasts 300 frames (5 seconds). In the simulator, use -1 to disable it or 0 to activate immediately.';
}
function positionJsTooltip(tip,x,y){
  const margin=10,offset=12;
  tip.style.left='0px';
  tip.style.top='0px';
  const rect=tip.getBoundingClientRect();
  tip.style.left=Math.max(margin,Math.min(x+offset,window.innerWidth-rect.width-margin))+'px';
  tip.style.top=Math.max(margin,Math.min(y+offset,window.innerHeight-rect.height-margin))+'px';
}
function wireJsTooltips(){
  const tip=document.getElementById('jelly-js-tooltip');
  if(!tip||document.body.dataset.jellyTooltipsWired)return;
  document.body.dataset.jellyTooltipsWired='true';
  let active=null;
  const show=(target,x,y)=>{
    active=target;
    tip.textContent=target.dataset.tooltip||'';
    tip.style.display='block';
    tip.setAttribute('aria-hidden','false');
    positionJsTooltip(tip,x,y);
  };
  const hide=()=>{
    active=null;
    tip.style.display='none';
    tip.setAttribute('aria-hidden','true');
  };
  document.addEventListener('mouseover',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(!target||target.contains(event.relatedTarget))return;
    show(target,event.clientX,event.clientY);
  });
  document.addEventListener('mousemove',event=>{
    if(active)positionJsTooltip(tip,event.clientX,event.clientY);
  });
  document.addEventListener('mouseout',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(target&&target===active&&!target.contains(event.relatedTarget))hide();
  });
  document.addEventListener('focusin',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(!target)return;
    const rect=target.getBoundingClientRect();
    show(target,rect.left+rect.width/2,rect.bottom);
  });
  document.addEventListener('focusout',event=>{
    if(event.target.closest?.('[data-tooltip]')===active)hide();
  });
}
function spoilerToggle(){return `<button type="button" class="spoiler-toggle" data-toggle-spoilers aria-pressed="${spoilersVisible?'true':'false'}">Spoilers: ${spoilersVisible?'Shown':'Hidden'}</button>`}
function toggleSpoilersPreservingScroll(){
  const page={x:window.scrollX,y:window.scrollY};
  const scrolls=Array.from(document.querySelectorAll('#main-content .table-scroll,#main-content .grid-wrap')).map(element=>({top:element.scrollTop,left:element.scrollLeft}));
  spoilersVisible=!spoilersVisible;
  render();
  requestAnimationFrame(()=>{
    Array.from(document.querySelectorAll('#main-content .table-scroll,#main-content .grid-wrap')).forEach((element,index)=>{
      if(!scrolls[index])return;
      element.scrollTop=scrolls[index].top;
      element.scrollLeft=scrolls[index].left;
    });
    window.scrollTo(page.x,page.y);
  });
}
function gameDescription(description,value){
  const amount=Number(value)||0;
  return String(description||'')
    .replace(/}/g,(1+amount/100).toFixed(2))
    .replace(/[{$]/g,fmt(amount))
    .replace(/@/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function rewardEffectText(reward){
  const description=String(reward.description||''),value=Number(reward.value)||0;
  if(/Nothing yet/i.test(description))return 'No effect';
  if(reward.index===0)return `${(1+value/100).toFixed(2)}x Research EXP; +2 Jelly slots`;
  if(reward.index===1)return `${(1+value/100).toFixed(2)}x Rank EXP; +2 Jelly slots`;
  if(reward.index===8)return `+${fmt(value)}% Crystal chance; ${(1+value/100).toFixed(2)}x Minehead currency`;
  if(/^Unlocks/i.test(description))return 'Unlock';
  if(/slot unlock|Golden Tile|weekly Exotic|Regal Mob|Research Point|Talent PTS|Cooking Mastery|Max LV|maximum possible roll/i.test(description))return `+${fmt(value)}`;
  if(/0\.01x higher/i.test(description))return `+${(value/100).toFixed(2)}x`;
  if(/0\.1% Chance/i.test(description))return `+${(value/10).toFixed(1)}%`;
  if(/}x/i.test(description))return `${(1+value/100).toFixed(2)}x`;
  if(/%/i.test(description))return `+${fmt(value)}%`;
  return `+${fmt(value)}`;
}
function randomSeed(){

      localStorage.removeItem(key);
    }
  }catch(error){
    localStorage.removeItem(key);
  }
  try{
    const db=await jellyCheckpointDb();
    const record=await new Promise((resolve,reject)=>{
      const tx=db.transaction(JELLY_CHECKPOINT_STORE,'readonly');
      const request=tx.objectStore(JELLY_CHECKPOINT_STORE).get(key);
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>reject(request.error||new Error('IndexedDB read failed'));

    });

    }catch(error){}

    key:record.key,
    schema:record.schema,
    savedAt:Number(record.savedAt)||0,
    estimatedBytes:Number(record.estimatedBytes)||new Blob([JSON.stringify(record)]).size,

function updateWorkerProgress(){

  if(!panel||!workerProgress)return;

  const localPercent=Math.max(0,Math.min(100,completed/total*100));
  const overall=Number(workerProgress.overallPercent);
  const percent=Math.max(0,Math.min(100,Number.isFinite(overall)?overall:localPercent));
  const strong=panel.querySelector('strong'),value=panel.querySelector('.progress-row span'),fill=panel.querySelector('.bar-fill');
  if(strong)strong.textContent=workerProgress.phase||'Working...';
  if(value)value.textContent=percent.toFixed(1)+'%';
  if(fill)fill.style.width=percent+'%';
}

    }else if(operation==='sections'){
      sectionAnalysis=message.result;
    }else if(operation==='simulate'){
      simulator.result=message.result;
    }
    const refreshPolicyAfterRender=policyRefreshPending&&['layout','certify','certifyLocal','sections','purchases'].includes(operation);
    try{
      render();
      if(operation==='layout'){
        persistJellyOptimizerCheckpoint();
        startParallelJellyAudit();
      }
    }catch(error){
      console.error(error);
      if(operation==='layout'||operation==='certify'||operation==='certifyLocal')optimized=null;
      else if(operation==='policy')currentPolicy=null;
      else if(operation==='purchases')upgradeAnalysis=null;
      else if(operation==='sections')sectionAnalysis=null;
      else if(operation==='simulate'&&simulator)simulator.result=null;
      workerError=`Jelly result rendering failed: ${String(error?.message||error)}`;
      render();
    }
    if(refreshPolicyAfterRender){
      policyRefreshPending=false;
      const layout=J.jellyLayoutFromSave(saveData);
      startJellyWorker('policy',{layout,options:{objective:'clear',trials:24,screeningTrials:3,seed:randomSeed()}});
    }
  };
  worker.onmessageerror=()=>{
    if(requestId!==workerRequestId)return;
    worker.terminate();
    jellyWorker=null;
    workerProgress=null;
    workerError='The Jelly result could not be transferred from the worker. Try fewer finalists or trials.';
    render();
  };
  worker.onerror=event=>{
    if(requestId!==workerRequestId)return;
    worker.terminate();
    jellyWorker=null;
    workerProgress=null;
    workerError=event.message||'Jelly worker failed.';
    render();
  };
  worker.postMessage({type:'run',operation,requestId,saveData,...payload});
}
function obstructionSlots(){return new Set(JELLY_OBSTRUCTION_SLOTS)}

function gridHtml(layout,title,obstructionIndex=J.jellyProgress(saveData).obstruction,options={}){
  const boardSave=options.save||saveData;
  const interactive=Boolean(options.interactive);
  const unlocked=options.unlocked?new Set(options.unlocked):J.jellyUnlockedSlots(boardSave), occupied=J.jellyLayoutOccupancy(layout), cores=new Map(Object.entries(layout).map(([a,t])=>[Number(a),Number(t)]));
  const contributions=new Map((options.contributions||[]).map(row=>[Number(row.anchor),row]));
  const highlighted=new Set(options.highlightSlots||[]);
  const maxContribution=Math.max(0,...Array.from(contributions.values(),row=>Number(row.marginalDps)||0));
  let html=`<div><h3>${esc(title)}</h3><div class="grid-wrap"><div class="jelly-grid${interactive?' sim-board':''}"${interactive?' data-sim-board':''}>`;
  const blocked=obstructionSlots();
  for(let i=0;i<JELLY_SIZE;i++){
    const cell=occupied.get(i), type=cell?.type, classes=['slot'];
    if(blocked.has(i))classes.push('obstruction');
    else if(!unlocked.has(i))classes.push('locked');
    if(cell){
      classes.push('cell','t'+type);
      const contribution=contributions.get(cell.anchor);
      if(contribution)classes.push('contribution');
      const sameCell=slot=>occupied.get(slot)?.anchor===cell.anchor;
      const left=i%JELLY_COLS>0&&sameCell(i-1);
      const right=i%JELLY_COLS<JELLY_COLS-1&&sameCell(i+1);
      const up=i>=JELLY_COLS&&sameCell(i-JELLY_COLS);
      const down=i<JELLY_SIZE-JELLY_COLS&&sameCell(i+JELLY_COLS);
      if(left)classes.push('join-l');
      if(right)classes.push('join-r');
      if(up)classes.push('join-u');
      if(down)classes.push('join-d');
      if(!left&&!up)classes.push('round-tl');
      if(!right&&!up)classes.push('round-tr');
      if(!left&&!down)classes.push('round-bl');
      if(!right&&!down)classes.push('round-br');
    }
    if(cores.has(i))classes.push('core');
    if(highlighted.has(i))classes.push('new-section');
    if([43,44,45,46,60,65,78,83,96,101,114,119,133,134,135,136].includes(i))classes.push('proximity');
    const slotTitle=blocked.has(i)?`Slot ${i} - obstruction`:cell?`Slot ${i} - ${CELL_NAMES[type]} core ${cell.anchor}`:`Slot ${i}`;
    const contribution=cell?contributions.get(cell.anchor):null;
    const heat=contribution&&maxContribution>0?Math.max(0,contribution.marginalDps/maxContribution):0;
    const contributionTitle=contribution?` - marginal ${fmt(contribution.marginalDps)} DPS (${pct(contribution.marginalPct)})`:'';
    html+=`<div class="${classes.join(' ')}" title="${esc(slotTitle+contributionTitle)}"${contribution?` style="--heat:${heat.toFixed(4)}"`:''}${interactive?` data-sim-slot="${i}"`:''}></div>`;
  }
  for(const [rawAnchor,rawType] of Object.entries(layout||{})){
    const anchor=Number(rawAnchor),type=Number(rawType),slots=J.jellyFootprintSlots(anchor,type);
    if(!slots?.length||type<0||type>7)continue;
    const xs=slots.map(slot=>slot%JELLY_COLS),ys=slots.map(slot=>Math.floor(slot/JELLY_COLS));
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const [nativeWidth,nativeHeight]=CELL_SPRITE_SIZES[type],width=nativeWidth*JELLY_RENDER_SCALE,height=nativeHeight*JELLY_RENDER_SCALE;
    const areaWidth=(maxX-minX+1)*JELLY_CELL_PITCH,areaHeight=(maxY-minY+1)*JELLY_CELL_PITCH;
    const left=JELLY_GRID_PADDING+minX*JELLY_CELL_PITCH+(areaWidth-width)/2;
    const top=JELLY_GRID_PADDING+minY*JELLY_CELL_PITCH+(areaHeight-height)/2;
    html+=`<img class="cell-sprite" src="./assets/jelly-operator/JellyUnit${type}.png" alt="${esc(CELL_NAMES[type])} at slot ${anchor}" draggable="${interactive?'true':'false'}"${interactive?` data-sim-anchor="${anchor}" data-sim-type="${type}"`:''} style="left:${left}px;top:${top}px;width:${width}px;height:${height}px">`;
  }
  const obstruction=Math.max(0,Math.min(71,Math.floor(Number(obstructionIndex)||0)));
  const obstructionName=jellyRewards()[obstruction]?.name||`Obstruction ${obstruction+1}`;
  const obstructionLeft=JELLY_GRID_PADDING+7*JELLY_CELL_PITCH+(4*JELLY_CELL_PITCH-JELLY_OBSTRUCTION_SIZE)/2;
  const obstructionTop=JELLY_GRID_PADDING+3*JELLY_CELL_PITCH+(4*JELLY_CELL_PITCH-JELLY_OBSTRUCTION_SIZE)/2;
  html+=`<img class="obstruction-sprite" src="./assets/jelly-operator/JellyOp${obstruction}.png" alt="${esc(obstructionName)}" draggable="false" style="left:${obstructionLeft}px;top:${obstructionTop}px;width:${JELLY_OBSTRUCTION_SIZE}px;height:${JELLY_OBSTRUCTION_SIZE}px">`;
  return html+'</div></div></div>';
}

function makeSimulatorState(){
  const progress=J.jellyProgress(saveData);
  const feverCount=Math.max(0,Math.min(FEVER_MODES.length,J.jellyUpgradeLevel(saveData,16)));
  return {
    layout:J.jellyLayoutFromSave(saveData),
    obstruction:Math.max(0,Math.min(71,progress.obstruction)),
    plots:new Set((saveData.research?.[18]||[]).map(Number).filter(Number.isFinite)),
    fever:feverCount>0?Math.min(feverCount-1,progress.fever):0,
    roidTiming:-1,
    revivePolicy:'immunoid-first',
    selectedType:0,
    result:null,
    message:'Sandbox initialized from the current save.',
    messageBad:false,
  };
}
function ensureSimulator(){
  if(!simulator)simulator=makeSimulatorState();
  return simulator;
}
function simulatorSave(){
  const state=ensureSimulator();
  const S=structuredClone(saveData);
  if(!Array.isArray(S.research))S.research=[];
  while(S.research.length<=18)S.research.push([]);
  S.research[7]=Array.isArray(S.research[7])?S.research[7].slice():[];
  S.research[7][9]=state.obstruction;
  S.research[14]=Array(JELLY_SIZE).fill(-1);
  for(const [anchor,type] of Object.entries(state.layout))S.research[14][Number(anchor)]=Number(type);
  S.research[18]=Array.from(state.plots).sort((a,b)=>a-b);
  return S;
}
function normalizeSimulatorLayout(message){
  const state=ensureSimulator(),S=simulatorSave();
  let next={},removed=0;
  for(const [rawAnchor,rawType] of Object.entries(state.layout).sort((a,b)=>Number(a[0])-Number(b[0]))){
    const placed=J.jellyPlaceCell(next,Number(rawAnchor),Number(rawType),S);
    if(placed)next=placed;
    else removed++;
  }
  state.layout=next;
  state.result=null;
  state.message=removed?`${message} Removed ${removed} cell${removed===1?'':'s'} that no longer fit unlocked slots.`:message;
  state.messageBad=false;
}

function simulatorSlotFromPointer(board,event){
  const rect=board.getBoundingClientRect(),style=getComputedStyle(board);
  const padX=parseFloat(style.paddingLeft)||0,padY=parseFloat(style.paddingTop)||0;
  const innerWidth=rect.width-padX-(parseFloat(style.paddingRight)||0);
  const innerHeight=rect.height-padY-(parseFloat(style.paddingBottom)||0);
  const x=event.clientX-rect.left-padX,y=event.clientY-rect.top-padY;
  if(x<0||y<0||x>=innerWidth||y>=innerHeight)return null;
  const column=Math.floor(x/(innerWidth/JELLY_COLS));
  const row=Math.floor(y/(innerHeight/(JELLY_SIZE/JELLY_COLS)));
  return column+row*JELLY_COLS;
}
function simulatorChanged(message,bad=false){
  if(workerProgress?.operation==='simulate')stopJellyWorker();
  const state=ensureSimulator();
  state.result=null;
  state.message=message;
  state.messageBad=bad;
}
function placeSimulatorCell(type,slot,sourceAnchor=null){
  const state=ensureSimulator(),S=simulatorSave();
  if(type===-1){
    const owner=J.jellyLayoutOccupancy(state.layout).get(slot);
    if(!owner){
      simulatorChanged('There is no cell at that slot to remove.',true);
    }else{
      state.layout=J.jellyRemoveCell(state.layout,owner.anchor);
      simulatorChanged(`Removed ${CELL_NAMES[owner.type]} from slot ${owner.anchor}.`);
    }
    render();
    return;
  }
  const base=sourceAnchor==null?state.layout:J.jellyRemoveCell(state.layout,sourceAnchor);
  const placed=J.jellyPlaceCell(base,slot,type,S);
  if(!placed){
    simulatorChanged(`Cannot place ${CELL_NAMES[type]} at slot ${slot}: its footprint is locked, out of bounds, obstructed, or exceeds the Virus limit.`,true);
  }else{
    state.layout=placed;
    simulatorChanged(`${sourceAnchor==null?'Placed':'Moved'} ${CELL_NAMES[type]} to anchor slot ${slot}.`);
  }
  render();
}
function wireSimulator(){
  const state=ensureSimulator(),root=document.querySelector('#tab-simulator');
  if(!root)return;
  const stage=root.querySelector('#sim-stage');
  if(stage)stage.onchange=()=>{
    state.obstruction=Number(stage.value);
    normalizeSimulatorLayout(`Selected stage ${state.obstruction+1}.`);
    render();
  };
  const fever=root.querySelector('#sim-fever');
  if(fever)fever.onchange=()=>{
    state.fever=Number(fever.value);
    simulatorChanged(`Selected ${feverModeName(state.fever)} Fever.`);
    render();
  };
  const roid=root.querySelector('#sim-roid');
  if(roid)roid.onchange=()=>{
    state.roidTiming=Math.max(-1,Math.min(J.jellyBossTime(state.obstruction),Number(roid.value)||0));
    simulatorChanged(state.roidTiming<0?'Stronkroid disabled.':`Stronkroid will activate at ${state.roidTiming} seconds.`);
    render();
  };
  const revive=root.querySelector('#sim-revive');
  if(revive)revive.onchange=()=>{
    state.revivePolicy=revive.value;
    simulatorChanged(`Revival strategy set to ${revive.options[revive.selectedIndex].text}.`);
    render();
  };
  root.querySelector('#sim-load-save').onclick=()=>{
    if(workerProgress?.operation==='simulate')stopJellyWorker();

    simulator.message='Sandbox reset from the current save.';
    render();
  };
  root.querySelector('#sim-clear-board').onclick=()=>{
    state.layout={};
    simulatorChanged('Removed every cell from the sandbox board.');
    render();
  };
  root.querySelector('#sim-remove-mode').onclick=()=>{
    state.selectedType=-1;
    simulatorChanged('Remove mode selected. Click any occupied footprint.');
    render();
  };
  root.querySelector('#sim-use-save-sections').onclick=()=>{
    state.plots=new Set((saveData.research?.[18]||[]).map(Number).filter(Number.isFinite));
    normalizeSimulatorLayout('Restored board sections from the current save.');
    render();
  };
  root.querySelector('#sim-clear-sections').onclick=()=>{
    state.plots.clear();
    normalizeSimulatorLayout('Locked every purchased board section.');
    render();
  };
  root.querySelector('#sim-all-sections').onclick=()=>{
    state.plots=new Set(jellySlotPlots().map(plot=>plot.plotId));
    normalizeSimulatorLayout('Unlocked every board section for this sandbox.');
    render();
  };
  root.querySelectorAll('[data-sim-plot]').forEach(button=>button.onclick=()=>{
    const plotId=Number(button.dataset.simPlot);
    if(state.plots.has(plotId))state.plots.delete(plotId);
    else state.plots.add(plotId);
    normalizeSimulatorLayout(`${state.plots.has(plotId)?'Unlocked':'Locked'} section ${plotId+1}.`);
    render();
  });
  root.querySelectorAll('.sim-cell-pick').forEach(button=>{
    button.onclick=()=>{
      state.selectedType=Number(button.dataset.simType);
      simulatorChanged(`${CELL_NAMES[state.selectedType]} selected. Click an unlocked slot or drag it onto the board.`);
      render();
    };
    button.ondragstart=event=>{
      event.dataTransfer.effectAllowed='copy';
      event.dataTransfer.setData('application/x-jelly-type',button.dataset.simType);
      event.dataTransfer.setData('text/plain',button.dataset.simType);
    };
  });
  const board=root.querySelector('[data-sim-board]');
  if(board){
    board.addEventListener('dragstart',event=>{
      const sprite=event.target.closest('[data-sim-anchor]');
      if(!sprite)return;
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('application/x-jelly-type',sprite.dataset.simType);
      event.dataTransfer.setData('application/x-jelly-anchor',sprite.dataset.simAnchor);
      event.dataTransfer.setData('text/plain',sprite.dataset.simType);
    });
    board.addEventListener('dragover',event=>{
      event.preventDefault();
      event.dataTransfer.dropEffect=event.dataTransfer.getData('application/x-jelly-anchor')?'move':'copy';
    });
    board.addEventListener('drop',event=>{
      event.preventDefault();
      const slot=simulatorSlotFromPointer(board,event);
      if(slot==null)return;
      const typeRaw=event.dataTransfer.getData('application/x-jelly-type')||event.dataTransfer.getData('text/plain');
      const type=Number(typeRaw),anchorRaw=event.dataTransfer.getData('application/x-jelly-anchor');
      if(!Number.isInteger(type)||type<0||type>7){
        simulatorChanged('The dragged item was not a valid Jelly cell.',true);
        render();
        return;
      }
      placeSimulatorCell(type,slot,anchorRaw===''?null:Number(anchorRaw));
    });
    board.addEventListener('click',event=>{
      const slot=simulatorSlotFromPointer(board,event);
      if(slot!=null)placeSimulatorCell(state.selectedType,slot);
    });
    board.addEventListener('contextmenu',event=>{
      event.preventDefault();
      const slot=simulatorSlotFromPointer(board,event);
      if(slot!=null)placeSimulatorCell(-1,slot);
    });
  }
  root.querySelector('#sim-run').onclick=()=>{
    const S=simulatorSave(),validation=J.jellyValidateLayout(state.layout,S);
    if(!validation.valid){
      simulatorChanged(validation.reason||'The sandbox layout is invalid.',true);
      render();
      return;
    }
    state.message='Running one exact 60 FPS operation with fresh randomness.';
    state.messageBad=false;
    startJellyWorker('simulate',{
      layout:state.layout,
      saveData:S,
      options:{
        obstruction:state.obstruction,
        fever:state.fever,
        seed:randomSeed(),
        useRoid:state.roidTiming>=0,
        roidTiming:state.roidTiming>=0?state.roidTiming:'none',
        revivePolicy:J.jellyUpgradeLevel(S,35)>0?state.revivePolicy:'none',
      },
    });
  };
}

}

function operationHtml(layout,op){
  const r=op.representative;
  const contributions=r.contribution.filter(row=>row.hits||row.shots).map(row=>`<tr><td>${esc(row.name)}</td><td class="num">${row.shots}</td><td class="num">${row.hits}</td><td class="num">${fmt(row.damage)}</td><td class="num">${fmt(row.bloodcells)}</td><td class="num">${fmt(row.exp)}</td></tr>`).join('');
  const deaths=r.deathLog.slice(0,12).map(row=>`<span class="move">${row.time.toFixed(2)}s: ${row.focused?'Focused ':''}${row.disabledAnchor?'anchor':'footprint'} slot ${row.slot}${row.revived?' — revived':''}</span>`).join('');
  const policyParts=[];
  if(J.jellyUpgradeLevel(saveData,16)>0)policyParts.push(`Selected Fever: ${feverModeName(op.fever)}`);
  if(spoilersVisible||J.jellyUpgradeLevel(saveData,29)>0)policyParts.push(roidTimingText(op.roidTiming,r.standardTime).toLowerCase());
  if(spoilersVisible||J.jellyUpgradeLevel(saveData,35)>0)policyParts.push(`${op.revivePolicy} revival`);
  return `<div class="cards">
    ${card('Boss HP',fmt(r.hp),`Normal phase: ${r.standardTime} sec`)}
    ${card('Clear probability',pct(op.clearProbability),`${op.successCount} / ${op.trials} seeded trials`)}
    ${card('Clear time',op.successCount?`${op.medianTime.toFixed(2)} sec`:'No clears',op.successCount?`90th percentile ${op.p90Time.toFixed(2)} sec`:pct(op.meanDamage/r.hp)+' mean damage')}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0?card('Critical phase',`${op.meanCriticalTime.toFixed(2)} sec mean`,r.criticalUnlocked?'Critical Condition active':'Fails when normal timer expires'):''}
    ${card('Bloodcells',fmt(op.meanBloodcells),'Mean per attempt, including live Best DPS growth')}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0?card('Cell EXP',fmt(op.meanCellExp),`Mean; ${r.hits} hits in representative trial`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0?card('Boss attacks',op.meanDeaths.toFixed(2)+' mean deaths',`${op.meanRevives.toFixed(2)} mean revives used`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,4)>0?card('Immunoid focus',`${r.immunoidFocusTime.toFixed(2)} sec`,`${r.immunoidHits} focused hits in representative trial`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,28)>0?card('Amoeba weakening',`${r.amoebaStacks} stacks`,`${r.amoebaStacksAtCriticalStart} at Critical start; +${r.amoebaStacks-r.amoebaStacksAtCriticalStart} during Critical`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,29)>0?card('Stronkroid timing',roidTimingText(op.roidTiming,r.standardTime),'',stronkroidTooltip()):''}
  </div>
  ${operationInsightsHtml(layout,op)}
  ${advancedOperationMetricsHtml(op)}
  ${policySensitivityHtml(layout,op)}
  <h3>Representative trial contribution</h3>
  <div class="table-scroll"><table><thead><tr><th>Cell</th><th class="num">Shots</th><th class="num">Hits</th><th class="num">Damage</th><th class="num">Bloodcells</th><th class="num">EXP</th></tr></thead><tbody>${contributions}</tbody></table></div>
  ${deaths?`<h3>Critical target timeline</h3><div>${deaths}</div>`:''}
  <p class="note" style="margin-bottom:0">${policyParts.length?esc(policyParts.join(', '))+'. ':''}${op.trials} trials.</p>`;
}

function objectiveOptions(selected){
  const options=[
    ['clear','Highest clear chance, then fastest',true],
    ['bloodcells','Most Bloodcells per attempt',spoilersVisible||J.jellyUpgradeLevel(saveData,23)>0],
    ['exp','Most Cell EXP per attempt',spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0],
    ['dps','Highest operation damage',true],
    ['survival','Longest Critical survival',spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0],
  ];
  return options.filter(row=>row[2]).map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('');
}

function strategyOptions(selected){
  return [
    ['progression','Progress now'],
    ['bloodcells','Farm Bloodcells'],
    ['exp','Level cells'],
    ['critical','Critical push'],
    ['long-term','Long-term progression'],
    ['low-risk','Low-risk gains'],
  ].map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('');
}

function qualityOptions(selected){
  return [
    ['fast','Fast (8 → 32 → 128)'],
    ['balanced','Balanced (16 → 64 → 256)'],
    ['thorough','Thorough (32 → 128 → 512)'],
  ].map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('');
}

function strategyObjective(strategy,current='clear'){
  if(strategy==='bloodcells'||strategy==='long-term')return 'bloodcells';
  if(strategy==='exp')return 'exp';
  if(strategy==='critical')return 'survival';
  if(strategy==='progression')return 'clear';
  return current;
}

function cellExpTargetOptions(selected){
  const owned=J.jellyUnitsOwned(saveData);
  return `<option value="-1" ${selected<0?'selected':''}>Total EXP</option>`
    +CELL_NAMES.slice(0,owned).map((name,type)=>`<option value="${type}" ${selected===type?'selected':''}>${esc(name)}</option>`).join('');
}

function cellExpValue(operation,type){
  return type<0?Number(operation?.meanCellExp)||0:Number(operation?.meanCellExpByType?.[type])||0;
}

function cellExpTargetName(type){
  return type<0?'Total EXP':CELL_NAMES[type]||'Cell EXP';
}

function operationInsightsHtml(layout,operation){
  if(!operation||typeof J.jellyOperationInsights!=='function')return '';
  const insights=J.jellyOperationInsights(operation,saveData,{layout});
  const noObservedClears=insights.valid&&Number(operation.trials)>0&&Number(operation.successCount)===0;
  const attempts=insights.expectedAttemptsToClear==null?(noObservedClears?'No clears observed':'Unavailable'):insights.expectedAttemptsToClear.toFixed(2);
  const days=insights.expectedDaysToClear==null?(noObservedClears?'Not estimable':'Unavailable'):insights.expectedDaysToClear.toFixed(2);
  const attemptsSub=noObservedClears
    ?`0 / ${fmt(operation.trials)} simulated trials cleared`
    :`${pct(insights.probabilityWithinDailyAttempts)} chance within daily attempts`;
  const daysSub=noObservedClears
    ?`${fmt(insights.dailyAttempts)} daily attempts; more damage is required`
    :`${fmt(insights.dailyAttempts)} attempts per day`;
  const expRows=(insights.expRows||insights.cellExpRows||[]).map(row=>`<tr>
    <td>${esc(row.name)}</td><td class="num">${row.currentLevel}</td><td class="num">${fmt(row.meanExpPerAttempt)}</td>
    <td class="num">${row.attemptsToNextLevel==null?'—':row.attemptsToNextLevel.toFixed(1)}</td>
    <td class="num">${row.daysToNextLevel==null?'—':row.daysToNextLevel.toFixed(2)}</td>
  </tr>`).join('');
  const obstructionRows=(insights.obstructionOutlook||[]).map(row=>`<tr>
    <td>${Number(row.obstruction)+1}</td><td class="num">${fmt(row.hp)}</td><td class="num">${row.estimatedClearProbability==null?'—':pct(row.estimatedClearProbability)}</td>

function plotSlots(plotIds){
  const selected=new Set(plotIds||[]);
  const slots=[];
  for(const plot of jellySlotPlots()){
    if(!selected.has(plot.plotId))continue;
    for(let y=0;y<plot.height;y++)for(let x=0;x<plot.width;x++)slots.push(plot.start+x+JELLY_COLS*y);
  }
  return slots;
}

function footprintSummary(opportunities){
  if(!opportunities)return '—';
  const rows=Array.isArray(opportunities)
    ? opportunities
    : Object.entries(opportunities).map(([type,count])=>({type:Number(type),count}));
  return rows.filter(row=>Number(row.count)>0).map(row=>`${CELL_NAMES[row.type]||`Cell ${row.type+1}`} +${row.count}`).join(', ')||'No new large-cell placements';
}

function purchasePlannerHtml(){
  let result='<p class="note">Sequential purchase simulation.</p>';
  if(upgradeAnalysis){
    const baseline=upgradeAnalysis.baseline,final=upgradeAnalysis.final;
    const expCellType=upgradeAnalysis.expCellType??-1;
    const objective=upgradeAnalysis.objective||purchaseControls.objective;
    const objectiveLabel=objective==='clear'?'clear chance':objective==='bloodcells'?'Bloodcells / attempt':objective==='exp'?`${cellExpTargetName(expCellType)} / attempt`:objective==='survival'?'Critical survival':'operation damage';
    const objectiveHelp=objective==='clear'
      ?'This compares the simulated probability of clearing the selected operation.'
      :objective==='bloodcells'
        ?'This compares expected Bloodcells earned per operation attempt.'
        :objective==='exp'
          ?'This compares expected Cell EXP earned per operation attempt.'
          :objective==='survival'
            ?'This compares expected seconds survived during Critical Condition.'
            :'This compares expected damage dealt during the operation.';
    const formatObjective=value=>{
      if(value==null)return '—';
      if(objective==='clear')return pct(value);
      if(objective==='survival')return `${Number(value).toFixed(2)}s`;
      return fmt(value);
    };
    const formatObjectiveGain=value=>{
      if(value==null)return '—';
      if(objective==='clear')return signedPct(value);
      if(objective==='survival')return `${signed(value)}s`;
      return signed(value,4);
    };
    const decisionMetricFor=row=>row.decisionMetric||(objective==='clear'?'clear-probability':objective);
    const formatDecisionValue=(metric,value)=>{
      if(value==null)return '—';
      if(metric==='clear-probability'||metric==='boss-damage-progress')return pct(value);
      if(metric==='clear-time'||metric==='survival')return `${Number(value).toFixed(2)}s`;
      return fmt(value);
    };
    const formatDecisionGain=row=>{
      const metric=decisionMetricFor(row);
      const gain=row.decisionGain??row.gain;
      if(gain==null)return '—';
      if(metric==='boss-damage-progress'){
        return `<strong>${signedPct(gain)} boss HP damage</strong><div class="sub">No observed clear-chance change</div>`;
      }
      if(metric==='clear-time'){
        const seconds=Math.abs(Number(gain)||0).toFixed(2);
        return `<strong>${Number(gain)>=0?seconds+'s faster':seconds+'s slower'}</strong><div class="sub">Clear chance was unchanged</div>`;
      }
      return formatObjectiveGain(gain);
    };
    const formatObjectiveCell=(row,side)=>{
      const objectiveValue=side==='before'?row.beforeObjective:row.afterObjective;
      const metric=decisionMetricFor(row);
      if(objective==='clear'&&metric!=='clear-probability'){
        const decisionValue=side==='before'?row.decisionBefore:row.decisionAfter;
        const detail=metric==='boss-damage-progress'
          ?`${formatDecisionValue(metric,decisionValue)} boss HP damage`
          :`${formatDecisionValue(metric,decisionValue)} mean clear time`;
        return `<strong>${formatObjective(objectiveValue)} clear</strong><div class="sub">${detail}</div>`;
      }
      return formatObjective(objectiveValue);
    };
    const expTargetName=cellExpTargetName(expCellType);
    const baselineExp=cellExpValue(baseline,expCellType),finalExp=cellExpValue(final,expCellType);
    const rows=upgradeAnalysis.rows.map(row=>`<tr><td><strong>${esc(row.name)}</strong><div class="sub">${esc(row.description)}</div></td><td class="num">${row.purchases}</td><td class="num">${row.startingLevel} → ${row.finalLevel}</td><td class="num">${fmt(row.totalCost)}</td><td class="num">${esc(row.effectText)}</td></tr>`).join('');
    const sequenceRows=(upgradeAnalysis.sequence||[]).map((row,index)=>`<tr>
      <td>${index+1}</td><td><strong>${row.waitDays>0?`Save ${row.waitDays.toFixed(2)}d, then `:''}${esc(row.name||`Upgrade ${row.id}`)}</strong>${row.selectedPlotIds?.length?`<div class="sub">${row.selectedPlotIds.map(id=>`Section ${Number(id)+1}`).join(' → ')}</div>`:''}</td>
      <td class="num">${fmt(row.cost)}</td><td class="num">${row.waitDays==null?'—':row.waitDays.toFixed(2)}</td>
      <td class="num">${formatObjectiveCell(row,'before')}</td>
      <td class="num">${formatObjectiveCell(row,'after')}</td><td class="num">${formatDecisionGain(row)}</td>
      <td class="num">${row.bloodcellGainPerDay==null?'—':signed(row.bloodcellGainPerDay,2)}</td><td class="num">${row.totalPaybackDays==null?'—':row.totalPaybackDays.toFixed(2)}</td>
    </tr>`).join('');
    const timeSaved=baseline.meanTime&&final.meanTime?baseline.meanTime-final.meanTime:0;
    result=`<div class="cards planner-cards">
      ${card('Purchases modeled',`${upgradeAnalysis.completedPurchases} / ${upgradeAnalysis.requestedPurchases}`,upgradeAnalysis.completedPurchases<upgradeAnalysis.requestedPurchases?'Stopped when no eligible purchase remained':'Full requested horizon completed')}
      ${card('Total Bloodcell cost',fmt(upgradeAnalysis.totalCost),upgradeAnalysis.respectBudget?`${fmt(upgradeAnalysis.remainingBloodcells)} projected remaining after saving`:'Hypothetical budget')}
      ${card('Planning horizon',`${upgradeAnalysis.planningDays??purchaseControls.planningDays} days`,`${(upgradeAnalysis.elapsedDays??0).toFixed(2)} expected days spent saving`)}
      ${card('Strategy',esc(upgradeAnalysis.strategy||purchaseControls.strategy),`${esc(upgradeAnalysis.quality||purchaseControls.quality)} quality · ${upgradeAnalysis.lookahead||purchaseControls.lookahead}-step lookahead`)}
      ${card('Clear probability',`${pct(baseline.clearProbability)} → ${pct(final.clearProbability)}`,signedPct(final.clearProbability-baseline.clearProbability))}
      ${card('Mean damage',`${fmt(baseline.meanDamage)} → ${fmt(final.meanDamage)}`,signed(final.meanDamage-baseline.meanDamage))}
      ${card('Bloodcells / attempt',`${fmt(baseline.meanBloodcells)} → ${fmt(final.meanBloodcells)}`,signed(final.meanBloodcells-baseline.meanBloodcells))}
      ${card('Bloodcells / day',`${fmt(upgradeAnalysis.startingBloodcellsPerDay)} → ${fmt(upgradeAnalysis.finalBloodcellsPerDay)}`,signed(upgradeAnalysis.finalBloodcellsPerDay-upgradeAnalysis.startingBloodcellsPerDay))}
      ${card(`${esc(expTargetName)} / attempt`,`${fmt(baselineExp)} → ${fmt(finalExp)}`,signed(finalExp-baselineExp))}
      ${card('Critical survival',`${baseline.meanCriticalTime.toFixed(2)}s → ${final.meanCriticalTime.toFixed(2)}s`,signed(final.meanCriticalTime-baseline.meanCriticalTime)+' sec')}
      ${card('Mean clear time',baseline.meanTime&&final.meanTime?`${baseline.meanTime.toFixed(2)}s → ${final.meanTime.toFixed(2)}s`:'Not cleared in both states',timeSaved?signed(timeSaved)+' sec saved':'')}
    </div>
    ${upgradeAnalysisStale?'<p class="bad">The save refreshed after this purchase analysis started. These results use its starting save.</p>':''}
    ${sequenceRows?`<h3>Purchase sequence</h3><p class="note"><strong>${esc(objectiveLabel)}</strong>: ${objectiveHelp} If sampled clear chance does not change, the planner ranks progress by faster clears or additional boss-health damage and shows that fallback explicitly. Bloodcell payoff is separate: it estimates how long the purchase cost takes to earn back from extra Bloodcells. “Planned effect” below is only the upgrade’s raw in-game effect.</p><div class="table-scroll planner-table"><table><thead><tr><th>Step</th><th>Action</th><th class="num">Cost</th><th class="num">Save days</th><th class="num">Before<br><small>${esc(objectiveLabel)}</small></th><th class="num">After<br><small>${esc(objectiveLabel)}</small></th><th class="num">Improvement used to rank</th><th class="num">Extra Bloodcells / day</th><th class="num">Save + payoff days</th></tr></thead><tbody>${sequenceRows}</tbody></table></div>`:''}
    <h3>Totals by upgrade</h3>
    <div class="table-scroll planner-table"><table><thead><tr><th>Upgrade</th><th class="num">Levels bought</th><th class="num">Level total</th><th class="num">Total cost</th><th class="num">Planned effect</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No eligible purchases were available.</td></tr>'}</tbody></table></div>`;
  }
  return `<div class="section"><h2>Cost-effective purchase planner</h2>
    <div class="planner-controls">
      <label class="control">Strategy<select id="upgrade-strategy">${strategyOptions(purchaseControls.strategy)}</select></label>
      <label class="control">Objective<select id="upgrade-objective">${objectiveOptions(purchaseControls.objective)}</select></label>
      <label class="control" id="upgrade-exp-cell-type-control" ${purchaseControls.objective==='exp'?'':'hidden'}>EXP target<select id="upgrade-exp-cell-type">${cellExpTargetOptions(purchaseControls.expCellType)}</select></label>
      <label class="control">Purchases ahead<input id="upgrade-purchases" type="number" min="1" max="50" value="${purchaseControls.purchases}"></label>
      <label class="control">Planning days<input id="upgrade-planning-days" type="number" min="1" max="365" value="${purchaseControls.planningDays}"></label>
      <label class="control">Quality<select id="upgrade-quality">${qualityOptions(purchaseControls.quality)}</select></label>
      <label class="control">Lookahead<input id="upgrade-lookahead" type="number" min="1" max="3" value="${purchaseControls.lookahead}"></label>
      <label class="check-control"><input id="upgrade-reoptimize" type="checkbox" ${purchaseControls.reoptimize?'checked':''}><span><strong>Reoptimize layout</strong><small>Search again after each purchase</small></span></label>
      <label class="check-control"><input id="upgrade-budget" type="checkbox" ${purchaseControls.budget?'checked':''}><span><strong>Respect Bloodcells</strong><small>Allow saving until a purchase is affordable</small></span></label>
      <button class="primary" id="analyze-upgrades" ${workerProgress?.operation==='purchases'?'disabled':''}>Plan purchases</button>
    </div>${workerProgressHtml('purchases')}${result}</div>`;
}

  }).join('');
  return `<div class="section"><h2>72 obstruction rewards</h2><div class="table-scroll"><table><thead><tr><th>#</th><th>Obstruction</th><th>Target system</th><th>Corrected account bonus</th><th class="num">Effect</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function factorVisible(factor){
  if(spoilersVisible)return true;
  if(factor.unlockId!=null&&J.jellyUpgradeLevel(saveData,factor.unlockId)<=0)return false;
  if(factor.rewardIndex!=null&&J.jellyProgress(saveData).obstruction<=factor.rewardIndex)return false;
  return true;
}
function factorTreeNode(factor){
  if(!factorVisible(factor))return null;
  return {
    label:esc(factor.label),
    val:factor.value,
    fmt:factor.unit==='x'?'x':factor.unit==='%'?'%':undefined,
    children:(factor.children||[]).map(factorTreeNode).filter(Boolean),
  };
}
function multiplierTree(label,breakdown){
  return {
    label:esc(label),
    val:breakdown.value,
    fmt:'x',
    children:(breakdown.factors||[]).map(factorTreeNode).filter(Boolean),
  };
}
function breakdownPanel(id,title,breakdown,lockedText){

}

      ${anchorOnlyNote}
      <h3>Changes</h3><div>${optimized.moves.length?changePlan:'No changes improve this objective.'}</div>
      <details class="optimizer-diagnostics"><summary>Search details</summary>
        <div class="cards">
          ${card('Steady DPS',`${fmt(savedM.dps)} → ${fmt(optimized.metrics.dps)}`,savedM.dps>0?`+${pct(optimized.metrics.dps/savedM.dps-1)}`:'')}
          ${blindOp?card('Blind search vs saved',objectiveComparison(),optimized.search?.savedDiscoveredByConstruction?'Exact saved geometry found':'Saved geometry not independently found'):''}
          ${J.jellyUpgradeLevel(saveData,4)>0?card('Best Immunoid finalist',immunoidOp?objectiveValue(immunoidOp):'None',immunoidOp?`${J.jellyLayoutMetrics(optimized.immunoidLayout,saveData,{fever:immunoidOp.fever}).rawCounts[4]} Immunoid`:'None'):''}
          ${optimized.immunoidBreakpoint?card('Immunoid breakpoint',breakpointRanges||'None',optimized.immunoidBreakpoint.currentPreferred?'Favored here':'Not favored here'):''}
          ${card('Surrogate rank audit',(optimized.proxyAudit?.rankCorrelation??1).toFixed(3),worstProxy&&worstProxy.rankDelta>0?`Largest under-rank: ${worstProxy.rankDelta}`:'No under-ranked finalist')}
          ${card('Search',`${optimized.search?.searchStarts||1} starts`,`${fmt(optimized.evaluated)} candidates · ${optimized.search?.eliteArchiveSize||0} niches`)}
          ${optimized.parallelSearch?card('Dynamic search queue',`${optimized.parallelSearch.executedStarts}/${optimized.parallelSearch.requestedStarts} executed`,`${optimized.parallelSearch.acceptedStarts} retained · ${optimized.parallelSearch.workers} warm-capable workers · ${optimized.parallelSearch.warmWorkersReused||0} reused${optimized.parallelSearch.resumed?' · resumed':''}`):''}
          ${optimized.search?.diversitySummary?card('Exploration diversity',`At least ${fmt(optimized.search.diversitySummary.eliteNiches)} niches`,`At least ${fmt(optimized.search.diversitySummary.compositions)} compositions · observed Virus counts ${(optimized.search.diversitySummary.virusCounts||[]).join(', ')||'none'} · ${fmt(optimized.search.diversitySummary.sources?.length||0)} source families`):''}
          ${card('Adaptive allocation',`${fmt(optimized.search?.adaptiveRacingCandidates||0)} extra racers`,`${fmt(optimized.search?.racingCandidates||0)} candidates received ${fmt(optimized.search?.racingTrials||0)} trials`)}
          ${card('Search islands',(optimized.search?.islandProfiles||[]).join(', ')||'Objective',`${optimized.search?.islandMutationCandidates||0} mutations · ${optimized.search?.islandMigrations||0} migrations · bias scale ${(optimized.search?.islandBiasScale||0).toFixed(3)}`)}
          ${optimized.search?.virusConditionedSeeds?card('Virus conditioning',`${fmt(optimized.search.virusConditionedSeeds)} seeds`,`${fmt(optimized.search.virusStructuresEnumerated)} structures · ${optimized.search.virusStructureComplete?'exhausted declared count scope':'node-budget limited'}`):''}
          ${card('Neighborhood',`${optimized.search?.neighborhoodCandidates||0} checked`,`${optimized.search?.neighborhoodPromoted||0} promoted`)}
          ${card('Exact regional repair',`${optimized.search?.exactRegionLayouts||0} repairs`,`${optimized.search?.exactRegionCompleteScopes||0} complete scopes · ${optimized.search?.exactRegionBudgetLimitedScopes||0} budget-limited`)}
          ${card('Simulation cache',`${optimized.search?.simulationCacheHits||0} reused`,`${optimized.search?.simulationCacheMisses||0} unique batches · ${fmt(optimized.search?.simulationCacheTrialsTrimmed||0)} cached trial records released`)}
          ${optimized.adaptiveConfirmation?.triggered?card('Confirmation',`${optimized.adaptiveConfirmation.confirmedTrials} trials`,`${optimized.adaptiveConfirmation.validationTrials||0} validation trials`):''}
          ${card('Paired vs saved',pairedStatusText,pairedSaved?`${pairedDifference}; ${pct(pairedSaved.chanceBeatsBaseline)} trial wins`:'Requires held-out confirmation')}
        </div>
        ${optimized.search?.diversitySummary?`<h3>Exploration coverage</h3><div class="cards">
          ${card('Distinct compositions',`At least ${fmt(optimized.search.diversitySummary.compositions)}`,`${fmt(optimized.search.diversitySummary.layouts)} layouts in the largest shard archive`)}
          ${card('Virus counts explored',(optimized.search.diversitySummary.virusCounts||[]).join(', ')||'None',`${optimized.search.virusSearchMode||'balanced'} conditioning scope`)}
          ${card('Cell types represented',(optimized.search.diversitySummary.cellTypes||[]).map(type=>CELL_NAMES[type]||`Cell ${type+1}`).join(', ')||'None')}
          ${card('Candidate sources',fmt(optimized.search.diversitySummary.sources?.length||0),(optimized.search.diversitySummary.sources||[]).join(', '))}
          ${card('Policy niches',fmt(optimized.search.policyNiches||0),`${fmt(optimized.search.screeningPoliciesEvaluated||0)} policy evaluations`)}
        </div>`:''}
        <h3>Evaluation ledger</h3>
        <p class="note">Each row states what was evaluated and the strongest claim that evidence supports. Only explicitly exhausted exact scopes are proofs; the final stochastic recommendation is never labeled a global optimum.</p>
        <div class="table-scroll"><table><thead><tr><th>Phase</th><th>Method</th><th class="num">Candidates</th><th class="num">Trials</th><th>Claim</th><th>Evidence</th></tr></thead><tbody>${evaluationLedgerRows}</tbody></table></div>
        ${parallelShardRows?`<h3>Dynamic search starts</h3><div class="table-scroll"><table><thead><tr><th>Start</th><th class="num">Offset</th><th class="num">Score</th><th class="num">Evaluated</th><th>Status</th></tr></thead><tbody>${parallelShardRows}</tbody></table></div>`:''}
        <h3>Cell-type finalists</h3>
        <div class="table-scroll"><table><thead><tr><th>Required type</th><th class="num">Count</th><th class="num">Objective</th><th class="num">Clear 95% interval</th></tr></thead><tbody>${archetypeRows}</tbody></table></div>
        <h3>Count finalists</h3>
        <div class="table-scroll"><table><thead><tr><th>Cell type</th><th class="num">Count</th><th class="num">Objective</th><th class="num">Clear 95% interval</th></tr></thead><tbody>${countArchetypeRows}</tbody></table></div>
        <h3>Anchor contributions</h3>
        <div class="table-scroll"><table><thead><tr><th>Anchor</th><th>Cell</th><th class="num">Direct DPS</th><th class="num">Marginal DPS</th><th class="num">Share</th></tr></thead><tbody>${contributionRows}</tbody></table></div>
      </details>
    </div>`;
  }
  return `<div class="section"><h2>Layout search</h2>
    <div class="controls">
      <label class="control">Search mode<select id="optimizer-mode">
        <option value="bounded" ${optimizerControls.mode==='bounded'?'selected':''}>Bounded global search</option>
        <option value="exact" ${optimizerControls.mode==='exact'?'selected':''}>Exact / certifiable</option>
        <option value="local" ${optimizerControls.mode==='local'?'selected':''}>Local optimality proof</option>
      </select></label>
      ${optimizerControls.mode==='bounded'?`
      <label class="control">Objective<select id="objective">
        ${objectiveOptions(optimizerControls.objective)}
      </select></label>
      <label class="control" id="exp-cell-type-control" ${optimizerControls.objective==='exp'?'':'hidden'}>EXP target<select id="exp-cell-type">${cellExpTargetOptions(optimizerControls.expCellType)}</select></label>
      <label class="control">Obstruction<input id="obstruction" type="number" min="1" max="72" value="${optimizerControls.obstruction+1}"></label>
      <label class="control">Diverse beam width<input id="beam" type="number" min="4" max="128" value="${optimizerControls.beamWidth}"></label>
      <label class="control">Empty-board build rounds<input id="iterations" type="number" min="1" max="120" value="${optimizerControls.iterations}"></label>
      <label class="control">Saved-board relocation rounds<input id="saved-refinement-rounds" type="number" min="0" max="30" value="${optimizerControls.savedRefinementRounds}"></label>
      <label class="control">Merged local rounds<input id="refinement-rounds" type="number" min="0" max="30" value="${optimizerControls.refinementRounds}"></label>
      <label class="control">Independent starts<input id="search-starts" type="number" min="1" max="32" value="${optimizerControls.searchStarts}"></label>
      <label class="control">Parallel search workers<input id="search-workers" type="number" min="1" max="4" value="${optimizerControls.searchWorkers}"></label>
      <label class="control">Virus conditioning<select id="virus-search-mode"><option value="fast" ${optimizerControls.virusSearchMode==='fast'?'selected':''}>Fast</option><option value="balanced" ${optimizerControls.virusSearchMode==='balanced'?'selected':''}>Balanced</option><option value="thorough" ${optimizerControls.virusSearchMode==='thorough'?'selected':''}>Thorough</option></select></label>
      <label class="control"><input id="adaptive-search" type="checkbox" ${optimizerControls.adaptiveSearch?'checked':''}> Stop starts after deterministic convergence</label>
      <label class="control">Minimum starts<input id="adaptive-min-starts" type="number" min="1" max="32" value="${optimizerControls.adaptiveMinStarts}"></label>
      <label class="control">Convergence window<input id="adaptive-convergence-window" type="number" min="2" max="32" value="${optimizerControls.adaptiveConvergenceWindow}"></label>
      <label class="control">Fully simulated finalists<input id="finalists" type="number" min="1" max="64" value="${optimizerControls.finalistCount}"></label>
      <label class="control">Simulation trials<input id="trials" type="number" min="4" max="1000" value="${optimizerControls.simulationTrials}"></label>
      <label class="control">Adaptive confirmation cap<input id="adaptive-max-trials" type="number" min="512" max="8192" step="512" value="${optimizerControls.adaptiveMaxTrials}"></label>
      `:`
      <input id="objective" type="hidden" value="${optimizerControls.objective}">
      <input id="exp-cell-type" type="hidden" value="${optimizerControls.expCellType}">
      <input id="obstruction" type="hidden" value="${optimizerControls.obstruction+1}">
      <input id="beam" type="hidden" value="${optimizerControls.beamWidth}">
      <input id="iterations" type="hidden" value="${optimizerControls.iterations}">
      <input id="saved-refinement-rounds" type="hidden" value="${optimizerControls.savedRefinementRounds}">
      <input id="refinement-rounds" type="hidden" value="${optimizerControls.refinementRounds}">
      <input id="search-starts" type="hidden" value="${optimizerControls.searchStarts}">
      <input id="search-workers" type="hidden" value="${optimizerControls.searchWorkers}">
      <input id="virus-search-mode" type="hidden" value="${optimizerControls.virusSearchMode}">
      <input id="adaptive-search" type="checkbox" hidden ${optimizerControls.adaptiveSearch?'checked':''}>
      <input id="adaptive-min-starts" type="hidden" value="${optimizerControls.adaptiveMinStarts}">
      <input id="adaptive-convergence-window" type="hidden" value="${optimizerControls.adaptiveConvergenceWindow}">
      <input id="finalists" type="hidden" value="${optimizerControls.finalistCount}">
      <input id="trials" type="hidden" value="${optimizerControls.simulationTrials}">
      <input id="adaptive-max-trials" type="hidden" value="${optimizerControls.adaptiveMaxTrials}">
      <label class="control" ${optimizerControls.mode==='local'?'hidden':''}>Node budget<input id="exact-node-budget" type="number" min="1" max="50000000" value="${optimizerControls.exactNodeBudget}"></label>
      <label class="control" ${optimizerControls.mode==='local'?'hidden':''}>Time budget (seconds)<input id="exact-time-budget" type="number" min="1" max="3600" value="${Math.round(optimizerControls.exactTimeBudgetMs/1000)}"></label>
      <label class="control" ${optimizerControls.mode==='local'?'hidden':''}><input id="exact-full-coverage" type="checkbox" ${optimizerControls.exactRequireFullCoverage?'checked':''}> Require every unlocked slot occupied</label>
      <label class="control" ${optimizerControls.mode==='local'?'hidden':''}><input id="exact-deterministic-budget" type="checkbox" ${optimizerControls.exactDeterministicNodeBudget?'checked':''}> Deterministic node-budget stopping</label>
      `}
      ${optimizerControls.mode==='bounded'?`
      <input id="exact-node-budget" type="hidden" value="${optimizerControls.exactNodeBudget}">
      <input id="exact-time-budget" type="hidden" value="${Math.round(optimizerControls.exactTimeBudgetMs/1000)}">
      <input id="exact-full-coverage" type="checkbox" hidden ${optimizerControls.exactRequireFullCoverage?'checked':''}>
      <input id="exact-deterministic-budget" type="checkbox" hidden ${optimizerControls.exactDeterministicNodeBudget?'checked':''}>
      `:''}
      ${optimizerControls.mode==='local'?`
      <label class="control">Window size<input id="certify-window" type="number" min="2" max="6" value="${optimizerControls.certifyWindow}"></label>
      <label class="control">Window stride<input id="certify-stride" type="number" min="1" max="6" value="${optimizerControls.certifyStride}"></label>
      <label class="control">Coordinated windows<select id="certify-coordination-depth"><option value="1" ${optimizerControls.certifyCoordinationDepth===1?'selected':''}>Single windows only</option><option value="2" ${optimizerControls.certifyCoordinationDepth===2?'selected':''}>Single + adjacent pairs</option></select></label>
      <label class="control">Distant window pairs<input id="certify-nonlocal-pairs" type="number" min="0" max="64" value="${optimizerControls.certifyNonlocalPairs}"></label>
      <label class="control">Adaptive structural regions<input id="certify-adaptive-regions" type="number" min="0" max="32" value="${optimizerControls.certifyAdaptiveRegions}"></label>
      <label class="control">Dependency graph regions<input id="certify-dependency-regions" type="number" min="0" max="32" value="${optimizerControls.certifyDependencyRegions}"></label>
      <label class="control">Certificate score<select id="certify-score-model"><option value="deterministic-proxy" ${optimizerControls.certifyScoreModel==='deterministic-proxy'?'selected':''}>Steady DPS</option><option value="sampled-operation" ${optimizerControls.certifyScoreModel==='sampled-operation'?'selected':''}>Frozen operation sample</option></select></label>
      <label class="control">Sampled trials / layout<input id="certify-sampled-trials" type="number" min="1" max="256" value="${optimizerControls.certifySampledTrials}"></label>
      <label class="control"><input id="certify-joint-policy" type="checkbox" ${optimizerControls.certifyJointPolicy?'checked':''}> Optimize a bounded policy portfolio per layout</label>
      <label class="control">Total node budget<input id="certify-node-budget" type="number" min="100" max="50000000" value="${optimizerControls.certifyNodeBudget}"></label>
      <label class="control">Time budget (seconds)<input id="certify-time-budget" type="number" min="1" max="3600" value="${Math.round(optimizerControls.certifyTimeBudgetMs/1000)}"></label>
      <label class="control"><input id="certify-deterministic-budget" type="checkbox" ${optimizerControls.certifyDeterministicNodeBudget?'checked':''}> Deterministic node-budget stopping</label>
      <label class="control"><input id="certify-iterative" type="checkbox" ${optimizerControls.certifyIterative?'checked':''}> Apply repairs until a fixed point</label>
      <label class="control"><input id="certify-move-neighborhood" type="checkbox" ${optimizerControls.certifyMoveNeighborhood?'checked':''}> Certify global relocations, swaps, replacements, and repacks</label>
      <label class="control">Maximum repair passes<input id="certify-max-passes" type="number" min="1" max="20" value="${optimizerControls.certifyMaxPasses}"></label>
      <label class="control">Connected repack size<select id="certify-repack-cells"><option value="0" ${optimizerControls.certifyRepackCells===0?'selected':''}>Disabled</option><option value="2" ${optimizerControls.certifyRepackCells===2?'selected':''}>Up to 2 cells</option><option value="3" ${optimizerControls.certifyRepackCells===3?'selected':''}>Up to 3 cells</option></select></label>
      `:`
      <input id="certify-window" type="hidden" value="${optimizerControls.certifyWindow}">
      <input id="certify-stride" type="hidden" value="${optimizerControls.certifyStride}">
      <input id="certify-coordination-depth" type="hidden" value="${optimizerControls.certifyCoordinationDepth}">
      <input id="certify-nonlocal-pairs" type="hidden" value="${optimizerControls.certifyNonlocalPairs}">
      <input id="certify-adaptive-regions" type="hidden" value="${optimizerControls.certifyAdaptiveRegions}">
      <input id="certify-dependency-regions" type="hidden" value="${optimizerControls.certifyDependencyRegions}">
      <input id="certify-score-model" type="hidden" value="${optimizerControls.certifyScoreModel}">
      <input id="certify-sampled-trials" type="hidden" value="${optimizerControls.certifySampledTrials}">
      <input id="certify-joint-policy" type="checkbox" hidden ${optimizerControls.certifyJointPolicy?'checked':''}>
      <input id="certify-node-budget" type="hidden" value="${optimizerControls.certifyNodeBudget}">
      <input id="certify-time-budget" type="hidden" value="${Math.round(optimizerControls.certifyTimeBudgetMs/1000)}">
      <input id="certify-deterministic-budget" type="checkbox" hidden ${optimizerControls.certifyDeterministicNodeBudget?'checked':''}>
      <input id="certify-iterative" type="checkbox" hidden ${optimizerControls.certifyIterative?'checked':''}>
      <input id="certify-move-neighborhood" type="checkbox" hidden ${optimizerControls.certifyMoveNeighborhood?'checked':''}>
      <input id="certify-max-passes" type="hidden" value="${optimizerControls.certifyMaxPasses}">
      <input id="certify-repack-cells" type="hidden" value="${optimizerControls.certifyRepackCells}">
      `}
      <button class="primary" id="run-optimizer" ${['layout','certify','certifyLocal'].includes(workerProgress?.operation)?'disabled':''}>${optimizerControls.mode==='exact'?'Run exact search':(optimizerControls.mode==='local'?'Prove local optimality':'Run optimizer')}</button>
    </div>
    ${workerProgressHtml(optimizerControls.mode==='exact'?'certify':(optimizerControls.mode==='local'?'certifyLocal':'layout'))}
    <p class="note">${optimizerControls.mode==='exact'
      ?'Exact mode proves the best steady-state DPS layout only when it exhausts the declared finite scope. Deterministic stopping ignores wall-clock time and ends at the same node budget on repeated runs.'
      :(optimizerControls.mode==='local'
        ?'Local optimality can add weak-cell, Virus, Organelle, Immunoid, and leader-disagreement regions, then apply the strongest repair until a fixed point. Frozen operation sample mode proves only the declared finite seed sample and fixed policy, not the full random game distribution.'
        :'Higher values search longer. The search is bounded rather than a mathematical proof of the global optimum. Adaptive confirmation escalates statistically unresolved finalists through shared-seed paired trials up to the selected cap; the evaluation ledger distinguishes best-found evidence from proofs.')}</p>
  </div>${checkpointHtml}${result}`;
}

wireJsTooltips();
if(J.hasJellyData(saveData))render();
</script>
</body>
</html>
