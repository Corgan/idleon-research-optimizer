<style>

.main{max-width:1500px;margin:auto;padding:16px}.tabs{display:flex;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid #334}.tab{padding:10px 18px;color:var(--text2);cursor:pointer;font-weight:700;border-bottom:2px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}.section{background:var(--bg2);padding:16px;border-radius:8px;margin:14px 0}.section h2{font-size:1.12rem;color:var(--accent);margin:0 0 12px;border-bottom:1px solid #334;padding-bottom:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:var(--bg3);padding:11px;border-radius:7px;border:1px solid #40506d}.label{font-size:.76rem;color:var(--text2)}.value{font-size:1.35rem;color:var(--gold);font-weight:750}.sub{font-size:.72rem;color:var(--text2);margin-top:2px}
.grid-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.jelly-grid{display:grid;grid-template-columns:repeat(18,37px);grid-auto-rows:37px;gap:0;background:#0a1020;padding:4px;border-radius:6px;width:max-content;min-width:0;position:relative}.grid-wrap{overflow:visible;max-width:none}
.slot{width:37px;height:37px;min-width:0;background:#171c2e;border:1px solid #262d43;border-radius:2px;position:relative;font-size:.42rem;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}.slot.locked{opacity:.24}.slot.obstruction{background:#4b2638;border-color:#a74462;opacity:1}.slot.cell{border-radius:0}.slot.contribution::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(255,209,102,calc(.08 + var(--heat,0)*.42))}.slot.join-l{border-left-color:transparent}.slot.join-r{border-right-color:transparent}.slot.join-u{border-top-color:transparent}.slot.join-d{border-bottom-color:transparent}.slot.round-tl{border-top-left-radius:2px}.slot.round-tr{border-top-right-radius:2px}.slot.round-bl{border-bottom-left-radius:2px}.slot.round-br{border-bottom-right-radius:2px}.slot.core{z-index:1}.slot.proximity::after{content:"";position:absolute;z-index:5;right:2px;bottom:2px;width:5px;height:5px;background:#7cff72;border:1px solid #173b14;border-radius:50%}.cell-sprite,.obstruction-sprite{position:absolute;max-width:none;object-fit:contain;pointer-events:none;user-select:none;image-rendering:pixelated;image-rendering:crisp-edges}.cell-sprite{z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}.obstruction-sprite{z-index:4;filter:drop-shadow(0 2px 3px rgba(0,0,0,.85))}
.t0{background:#96767b;border-color:#f8eadc}.t1{background:#487154;border-color:#edf9b3}.t2{background:#ab4a42;border-color:#ffcc97}.t3{background:#8e4ba1;border-color:#ffb7cf}.t4{background:#536ab8;border-color:#aefeff}.t5{background:#7c5fd7;border-color:#f3cdff}.t6{background:#a86d36;border-color:#fffeae}.t7{background:#687080;border-color:#e9fcff}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}.legend span{padding:3px 8px;border:1px solid rgba(255,255,255,.35);border-radius:4px;font-size:.74rem;color:#fff;font-weight:700;text-shadow:0 1px 2px #000}.upgrade-tip{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}.tooltip-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:4px;border:1px solid #60708d;border-radius:50%;color:var(--cyan);font-size:.68rem;font-weight:800;line-height:1;cursor:help;vertical-align:middle}.js-tooltip{position:fixed;display:none;z-index:1000;max-width:340px;padding:8px 10px;background:#101b35;color:var(--text);border:1px solid #60708d;border-radius:6px;box-shadow:0 5px 18px rgba(0,0,0,.45);font-size:.78rem;line-height:1.4;white-space:pre-line;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.control{display:flex;flex-direction:column;gap:4px;color:var(--text2);font-size:.78rem}.control select,.control input{background:#101a32;color:var(--text);border:1px solid #42506c;border-radius:4px;padding:7px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:8px 16px;font-weight:750;cursor:pointer}.primary:disabled{opacity:.5}.note{color:var(--text2);font-size:.8rem;line-height:1.45}.good{color:var(--green)}.bad{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.8rem}th{text-align:left;color:var(--text2);border-bottom:1px solid #445;padding:6px;position:sticky;top:0;background:var(--bg2)}td{padding:6px;border-bottom:1px solid #ffffff0c}.num{text-align:right;font-variant-numeric:tabular-nums}.table-scroll{overflow:auto;max-height:650px}
.move{display:inline-block;margin:3px;padding:4px 7px;background:#0d2947;border-radius:4px;font-size:.75rem}
.optimizer-diagnostics{margin-top:14px;padding:10px 12px;background:#101a32;border:1px solid #42506c;border-radius:7px}.optimizer-diagnostics>summary{cursor:pointer;color:var(--cyan);font-weight:750}.optimizer-diagnostics[open]>summary{margin-bottom:12px}
.progress-panel{margin-top:12px;padding:10px;background:#101a32;border:1px solid #42506c;border-radius:6px}.bar-outer{height:10px;border-radius:5px;background:#333;overflow:hidden;margin:7px 0}.bar-fill{height:100%;background:var(--green);transition:width .12s linear}.progress-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.cancel{background:#4b2638;color:var(--text);border:1px solid #a74462;border-radius:5px;padding:5px 10px;cursor:pointer}
.view-tools{display:flex;justify-content:flex-end;padding:8px 0}.spoiler-toggle{background:#101a32;color:var(--text2);border:1px solid #42506c;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:700}.spoiler-toggle[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}.spoiler-hidden{color:var(--text2);font-style:italic}
.sim-workspace{display:grid;grid-template-columns:minmax(190px,240px) minmax(560px,1fr);gap:14px;align-items:start}.sim-palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.sim-cell-pick,.sim-action,.plot-toggle{background:#101a32;color:var(--text);border:1px solid #42506c;border-radius:6px;cursor:pointer}.sim-cell-pick{display:flex;align-items:center;gap:7px;padding:6px;text-align:left;font-size:.76rem}.sim-cell-pick img{width:32px;height:32px;object-fit:contain;flex:none}.sim-cell-pick.active,.sim-action.active,.plot-toggle.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.sim-cell-pick:disabled{opacity:.35;cursor:not-allowed}.sim-board{touch-action:none}.sim-board .slot:not(.locked):not(.obstruction){cursor:crosshair}.sim-board .cell-sprite{pointer-events:auto;cursor:grab}.sim-board .cell-sprite:active{cursor:grabbing}.sim-actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.sim-action{padding:6px 10px;font-size:.76rem}.plot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px;max-height:220px;overflow:auto;padding:4px}.plot-toggle{padding:5px;font-size:.7rem}.sim-message{margin-top:8px;padding:7px 9px;border-radius:5px;background:#101a32;color:var(--text2);font-size:.78rem}.sim-message.bad{background:#4b2638;color:#ffb3c1}.sim-result-status{font-weight:800}.sim-result-status.good{color:#78e08f}.sim-result-status.bad{color:#ff7f96}
.planner-controls{display:grid;grid-template-columns:minmax(240px,1.4fr) repeat(2,minmax(140px,.7fr)) repeat(2,minmax(180px,.8fr)) auto;gap:14px;align-items:stretch;padding:13px;background:#101a32;border:1px solid #42506c;border-radius:8px}.planner-controls .control{justify-content:center}.check-control{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#162544;border:1px solid #40536e;border-radius:6px;color:var(--text);font-size:.78rem;cursor:pointer}.check-control input{width:17px;height:17px;flex:none}.check-control strong{display:block}.check-control small{display:block;color:var(--text2);margin-top:2px}.planner-controls .primary{align-self:center;min-height:42px;padding-inline:20px}.planner-cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:14px}.planner-cards .card{padding:14px;min-height:112px}.planner-table{margin-top:12px}
.breakdown-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.breakdown-panel{min-width:0;padding:10px;background:#101b35;border:1px solid #40536e;border-radius:8px}.breakdown-panel h3{margin:0 0 8px;color:var(--cyan);font-size:.95rem}.bt-controls{margin-bottom:8px;display:flex;gap:6px}.bt-controls .btn-sm{padding:4px 10px;background:var(--bg3);color:var(--text2);border:1px solid #4a607e;border-radius:4px;cursor:pointer;font-size:.8em}.bt-tree{font-size:.85em}.bt-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.04);min-height:26px;cursor:pointer}.bt-row:hover{background:rgba(255,255,255,.07)}.bt-children{background:rgba(0,0,0,.12);border-left:2px solid rgba(255,255,255,.08)}.bt-root{font-weight:700;font-size:1.05em;padding-top:6px;padding-bottom:6px;border-bottom:2px solid #445}.bt-arrow{cursor:pointer;color:var(--text2);font-size:1em;width:14px;text-align:center;user-select:none;flex-shrink:0}.bt-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt-val{font-weight:600;text-align:right;flex-shrink:0;white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}.bt-tooltip{position:fixed;display:none;z-index:10;max-width:320px;padding:8px;background:#101b35;color:var(--text);border:1px solid #4a607e;border-radius:4px;font-size:.8em}
@media(max-width:1100px){.breakdown-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1250px){.planner-controls{grid-template-columns:repeat(3,minmax(180px,1fr))}.planner-controls .primary{align-self:stretch}}
@media(max-width:900px){.sim-workspace{grid-template-columns:1fr}.sim-palette{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
@media(max-width:1400px){.grid-pair{grid-template-columns:1fr}}

</style>
</head>
<body>
<h1><a class="home" href="index.html">Home</a><span>Jelly Operator Optimizer</span></h1>
<div id="save-area"></div>
<main class="main" id="main-content"><p class="note" style="text-align:center;padding:40px">Load a save.</p></main>
<div id="jelly-js-tooltip" class="js-tooltip" role="tooltip" aria-hidden="true"></div>
<script type="module">
import { saveData } from './js/state.js';
import { initSaveLoader } from './js/ui/save-loader.js';
import { fmtVal } from './js/renderers/format.js';
import { renderBreakdownTree, resetTreeCounter } from './js/ui/dash-breakdowns.js';
import { CELL_NAMES, JELLY_COLS, JELLY_OBSTRUCTION_SLOTS, JELLY_SIZE, jellyRewards, jellyRewardTarget, jellySlotPlots, jellyUpgradeData, jellyUpgradeOrder } from './js/stats/data/w7/jelly-operator.js';
import * as J from './js/stats/systems/w7/jelly-operator.js';

const FEVER_MODES=[
  {name:'COLD',bonus:'+1% all damage each elapsed second'},
  {name:'RASH',bonus:'2.00x all damage'},
  {name:'SEPSIS',bonus:'2.00x Bloodcell gains'},
  {name:'NAUSEA',bonus:'2.00x EXP gains for all cells'},
  {name:'RABIES',bonus:'1.50x all damage and 1.25x all speed'},
  {name:'PLAGUE',bonus:'1.40x all speed'},
];
const JELLY_CELL_PITCH=37;
const JELLY_GRID_PADDING=4;
const JELLY_RENDER_SCALE=1;
const JELLY_OBSTRUCTION_SIZE=50*3*JELLY_RENDER_SCALE; // The game renders the 50px source at 300%.
const CELL_SPRITE_SIZES=[[36,36],[73,36],[36,109],[110,110],[73,73],[36,36],[147,147],[184,183]];

let optimized = null;
let optimizedStale = false;
let upgradeAnalysis = null;
let currentPolicy = null;
let simulator = null;
let purchaseControls={objective:'clear',expCellType:-1,purchases:10,trials:8,reoptimize:false,budget:true};
let optimizerControls={objective:'clear',expCellType:-1,obstruction:null,beamWidth:12,iterations:20,savedRefinementRounds:3,refinementRounds:4,searchStarts:8,finalistCount:8,simulationTrials:256};
let activeTab = 'overview';
let jellyWorker = null;
let workerRequestId = 0;
let workerProgress = null;
let workerError = '';
let spoilersVisible = false;
initSaveLoader({
  target:'#save-area',
  auth:true,
  onLoad:(_state,_raw,metadata)=>{
    const automatic=metadata?.source==='auto-refresh';
    const activeLayoutRun=automatic&&jellyWorker&&workerProgress?.operation==='layout';
    if(automatic&&optimized)optimizedStale=true;
    if(activeLayoutRun){
      optimizedStale=true;
      render();
      return;
    }
    stopJellyWorker();
    if(!automatic){
      optimized=null;
      optimizedStale=false;
    }
    upgradeAnalysis=null;
    currentPolicy=null;
    simulator=makeSimulatorState();
    workerError='';
    const layout=J.jellyLayoutFromSave(saveData);
    render();
    startJellyWorker('policy',{layout,options:{objective:'clear',trials:24,screeningTrials:3,seed:randomSeed()}});
  },
});

function fmt(value){return fmtVal(Number(value)||0)}
function pct(value){return ((Number(value)||0)*100).toFixed(2)+'%'}
function signed(value,digits=2){const number=Number(value)||0;return `${number>=0?'+':''}${number.toFixed(digits)}`}
function signedPct(value){return signed((Number(value)||0)*100)+'%'}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function tooltipIcon(text,label='More information'){return `<span class="tooltip-icon" tabindex="0" role="img" aria-label="${esc(label)}" data-tooltip="${esc(text)}">i</span>`}
function card(label,value,sub='',tooltip=''){
  return `<div class="card"><div class="label">${esc(label)}${tooltip?tooltipIcon(tooltip,`${label} details`):''}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function feverModeName(index){return FEVER_MODES[index]?.name||`Fever ${index+1}`}
function feverizerTooltip(){
  const unlocked=Math.min(FEVER_MODES.length,J.jellyUpgradeLevel(saveData,16));
  const visible=spoilersVisible?FEVER_MODES.length:unlocked;
  if(visible<=0)return 'No Fever modes unlocked yet.';
  const heading=spoilersVisible?'Fever modes by upgrade level:':'Unlocked Fever modes:';
  return heading+'\n'+FEVER_MODES.slice(0,visible).map((mode,index)=>`Level ${index+1}: ${mode.name} - ${mode.bonus}`).join('\n');
}
function stronkroidTooltip(){
  return 'One activation per operation. Stronkroid lasts 300 frames (5 seconds). In the simulator, use -1 to disable it or 0 to activate immediately.';
}
function positionJsTooltip(tip,x,y){
  const margin=10,offset=12;
  tip.style.left='0px';
  tip.style.top='0px';
  const rect=tip.getBoundingClientRect();
  tip.style.left=Math.max(margin,Math.min(x+offset,window.innerWidth-rect.width-margin))+'px';
  tip.style.top=Math.max(margin,Math.min(y+offset,window.innerHeight-rect.height-margin))+'px';
}
function wireJsTooltips(){
  const tip=document.getElementById('jelly-js-tooltip');
  if(!tip||document.body.dataset.jellyTooltipsWired)return;
  document.body.dataset.jellyTooltipsWired='true';
  let active=null;
  const show=(target,x,y)=>{
    active=target;
    tip.textContent=target.dataset.tooltip||'';
    tip.style.display='block';
    tip.setAttribute('aria-hidden','false');
    positionJsTooltip(tip,x,y);
  };
  const hide=()=>{
    active=null;
    tip.style.display='none';
    tip.setAttribute('aria-hidden','true');
  };
  document.addEventListener('mouseover',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(!target||target.contains(event.relatedTarget))return;
    show(target,event.clientX,event.clientY);
  });
  document.addEventListener('mousemove',event=>{
    if(active)positionJsTooltip(tip,event.clientX,event.clientY);
  });
  document.addEventListener('mouseout',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(target&&target===active&&!target.contains(event.relatedTarget))hide();
  });
  document.addEventListener('focusin',event=>{
    const target=event.target.closest?.('[data-tooltip]');
    if(!target)return;
    const rect=target.getBoundingClientRect();
    show(target,rect.left+rect.width/2,rect.bottom);
  });
  document.addEventListener('focusout',event=>{
    if(event.target.closest?.('[data-tooltip]')===active)hide();
  });
}
function spoilerToggle(){return `<button type="button" class="spoiler-toggle" data-toggle-spoilers aria-pressed="${spoilersVisible?'true':'false'}">Spoilers: ${spoilersVisible?'Shown':'Hidden'}</button>`}
function toggleSpoilersPreservingScroll(){
  const page={x:window.scrollX,y:window.scrollY};
  const scrolls=Array.from(document.querySelectorAll('#main-content .table-scroll,#main-content .grid-wrap')).map(element=>({top:element.scrollTop,left:element.scrollLeft}));
  spoilersVisible=!spoilersVisible;
  render();
  requestAnimationFrame(()=>{
    Array.from(document.querySelectorAll('#main-content .table-scroll,#main-content .grid-wrap')).forEach((element,index)=>{
      if(!scrolls[index])return;
      element.scrollTop=scrolls[index].top;
      element.scrollLeft=scrolls[index].left;
    });
    window.scrollTo(page.x,page.y);
  });
}
function gameDescription(description,value){
  const amount=Number(value)||0;
  return String(description||'')
    .replace(/}/g,(1+amount/100).toFixed(2))
    .replace(/[{$]/g,fmt(amount))
    .replace(/@/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function rewardEffectText(reward){
  const description=String(reward.description||''),value=Number(reward.value)||0;
  if(/Nothing yet/i.test(description))return 'No effect';
  if(reward.index===0)return `${(1+value/100).toFixed(2)}x Research EXP; +2 Jelly slots`;
  if(reward.index===1)return `${(1+value/100).toFixed(2)}x Rank EXP; +2 Jelly slots`;
  if(reward.index===8)return `+${fmt(value)}% Crystal chance; ${(1+value/100).toFixed(2)}x Minehead currency`;
  if(/^Unlocks/i.test(description))return 'Unlock';
  if(/slot unlock|Golden Tile|weekly Exotic|Regal Mob|Research Point|Talent PTS|Cooking Mastery|Max LV|maximum possible roll/i.test(description))return `+${fmt(value)}`;
  if(/0\.01x higher/i.test(description))return `+${(value/100).toFixed(2)}x`;
  if(/0\.1% Chance/i.test(description))return `+${(value/10).toFixed(1)}%`;
  if(/}x/i.test(description))return `${(1+value/100).toFixed(2)}x`;
  if(/%/i.test(description))return `+${fmt(value)}%`;
  return `+${fmt(value)}`;
}
function randomSeed(){
  const values=new Uint32Array(1);
  crypto.getRandomValues(values);
  return values[0]||1;
}
function roidTimingText(timing,standardTime){
  if(timing==='none'||timing==null||!Number.isFinite(Number(timing)))return 'Do not use';
  const seconds=Number(timing);
  if(seconds<=0)return 'Use immediately';
  if(Math.abs(seconds-standardTime)<0.01)return `Use at Critical start (${standardTime.toFixed(0)}s)`;
  if(seconds<standardTime)return `Use ${seconds.toFixed(0)}s after start`;
  return `Use ${seconds.toFixed(0)}s after start`;
}
function workerProgressHtml(operation){
  if(!workerProgress||workerProgress.operation!==operation)return '';
  const completed=Number(workerProgress.completed)||0,total=Math.max(1,Number(workerProgress.total)||1);
  const localPercent=Math.max(0,Math.min(100,completed/total*100));
  const overall=Number(workerProgress.overallPercent);
  const percent=Math.max(0,Math.min(100,Number.isFinite(overall)?overall:localPercent));
  return `<div class="progress-panel"><div class="progress-row"><strong>${esc(workerProgress.phase||'Working...')}</strong><span>${percent.toFixed(1)}%</span></div><div class="bar-outer"><div class="bar-fill" style="width:${percent}%"></div></div><div class="progress-row"><span class="note">Overall progress</span><button class="cancel" data-cancel-worker>Cancel</button></div></div>`;
}
function stopJellyWorker(){
  workerRequestId++;
  jellyWorker?.terminate();
  jellyWorker=null;
  workerProgress=null;
}
function updateWorkerProgress(){
  const panel=document.querySelector('.progress-panel');
  if(!panel||!workerProgress)return;
  const completed=Number(workerProgress.completed)||0,total=Math.max(1,Number(workerProgress.total)||1);
  const localPercent=Math.max(0,Math.min(100,completed/total*100));
  const overall=Number(workerProgress.overallPercent);
  const percent=Math.max(0,Math.min(100,Number.isFinite(overall)?overall:localPercent));
  const strong=panel.querySelector('strong'),value=panel.querySelector('.progress-row span'),fill=panel.querySelector('.bar-fill');
  if(strong)strong.textContent=workerProgress.phase||'Working...';
  if(value)value.textContent=percent.toFixed(1)+'%';
  if(fill)fill.style.width=percent+'%';
}
function startJellyWorker(operation,payload){
  stopJellyWorker();
  const requestId=++workerRequestId;
  workerProgress={operation,phase:'Starting...',completed:0,total:1};
  workerError='';
  render();
  const worker=new Worker('./js/workers/jelly-operator-worker.js',{type:'module'});
  jellyWorker=worker;
  worker.onmessage=event=>{
    const message=event.data||{};
    if(message.requestId!==requestId)return;
    if(message.type==='progress'){
      const previous=Number(workerProgress?.overallPercent)||0;
      const next=Number(message.progress?.overallPercent);
      workerProgress={operation,...message.progress,overallPercent:Number.isFinite(next)?Math.max(previous,next):previous};
      updateWorkerProgress();
      return;
    }
    worker.terminate();
    jellyWorker=null;
    workerProgress=null;
    if(message.type==='error'){
      workerError=message.error||'Jelly worker failed.';
    }else if(message.type!=='done'||!message.result){
      workerError='Jelly worker completed without returning a result.';
    }else if(operation==='policy'){
      currentPolicy=message.result;
    }else if(operation==='layout'){
      optimized=message.result;
    }else if(operation==='purchases'){
      upgradeAnalysis=message.result;
    }else if(operation==='simulate'){
      simulator.result=message.result;
    }
    try{
      render();
    }catch(error){
      console.error(error);
      if(operation==='layout')optimized=null;
      else if(operation==='policy')currentPolicy=null;
      else if(operation==='purchases')upgradeAnalysis=null;
      else if(operation==='simulate'&&simulator)simulator.result=null;
      workerError=`Jelly result rendering failed: ${String(error?.message||error)}`;
      render();
    }
  };
  worker.onmessageerror=()=>{
    if(requestId!==workerRequestId)return;
    worker.terminate();
    jellyWorker=null;
    workerProgress=null;
    workerError='The Jelly result could not be transferred from the worker. Try fewer finalists or trials.';
    render();
  };
  worker.onerror=event=>{
    if(requestId!==workerRequestId)return;
    worker.terminate();
    jellyWorker=null;
    workerProgress=null;
    workerError=event.message||'Jelly worker failed.';
    render();
  };
  worker.postMessage({type:'run',operation,requestId,saveData,...payload});
}
function obstructionSlots(){return new Set(JELLY_OBSTRUCTION_SLOTS)}

function gridHtml(layout,title,obstructionIndex=J.jellyProgress(saveData).obstruction,options={}){
  const boardSave=options.save||saveData;
  const interactive=Boolean(options.interactive);
  const unlocked=options.unlocked?new Set(options.unlocked):J.jellyUnlockedSlots(boardSave), occupied=J.jellyLayoutOccupancy(layout), cores=new Map(Object.entries(layout).map(([a,t])=>[Number(a),Number(t)]));
  const contributions=new Map((options.contributions||[]).map(row=>[Number(row.anchor),row]));
  const maxContribution=Math.max(0,...Array.from(contributions.values(),row=>Number(row.marginalDps)||0));
  let html=`<div><h3>${esc(title)}</h3><div class="grid-wrap"><div class="jelly-grid${interactive?' sim-board':''}"${interactive?' data-sim-board':''}>`;
  const blocked=obstructionSlots();
  for(let i=0;i<JELLY_SIZE;i++){
    const cell=occupied.get(i), type=cell?.type, classes=['slot'];
    if(blocked.has(i))classes.push('obstruction');
    else if(!unlocked.has(i))classes.push('locked');
    if(cell){
      classes.push('cell','t'+type);
      const contribution=contributions.get(cell.anchor);
      if(contribution)classes.push('contribution');
      const sameCell=slot=>occupied.get(slot)?.anchor===cell.anchor;
      const left=i%JELLY_COLS>0&&sameCell(i-1);
      const right=i%JELLY_COLS<JELLY_COLS-1&&sameCell(i+1);
      const up=i>=JELLY_COLS&&sameCell(i-JELLY_COLS);
      const down=i<JELLY_SIZE-JELLY_COLS&&sameCell(i+JELLY_COLS);
      if(left)classes.push('join-l');
      if(right)classes.push('join-r');
      if(up)classes.push('join-u');
      if(down)classes.push('join-d');
      if(!left&&!up)classes.push('round-tl');
      if(!right&&!up)classes.push('round-tr');
      if(!left&&!down)classes.push('round-bl');
      if(!right&&!down)classes.push('round-br');
    }
    if(cores.has(i))classes.push('core');
    if([43,44,45,46,60,65,78,83,96,101,114,119,133,134,135,136].includes(i))classes.push('proximity');
    const slotTitle=blocked.has(i)?`Slot ${i} - obstruction`:cell?`Slot ${i} - ${CELL_NAMES[type]} core ${cell.anchor}`:`Slot ${i}`;
    const contribution=cell?contributions.get(cell.anchor):null;
    const heat=contribution&&maxContribution>0?Math.max(0,contribution.marginalDps/maxContribution):0;
    const contributionTitle=contribution?` - marginal ${fmt(contribution.marginalDps)} DPS (${pct(contribution.marginalPct)})`:'';
    html+=`<div class="${classes.join(' ')}" title="${esc(slotTitle+contributionTitle)}"${contribution?` style="--heat:${heat.toFixed(4)}"`:''}${interactive?` data-sim-slot="${i}"`:''}></div>`;
  }
  for(const [rawAnchor,rawType] of Object.entries(layout||{})){
    const anchor=Number(rawAnchor),type=Number(rawType),slots=J.jellyFootprintSlots(anchor,type);
    if(!slots?.length||type<0||type>7)continue;
    const xs=slots.map(slot=>slot%JELLY_COLS),ys=slots.map(slot=>Math.floor(slot/JELLY_COLS));
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const [nativeWidth,nativeHeight]=CELL_SPRITE_SIZES[type],width=nativeWidth*JELLY_RENDER_SCALE,height=nativeHeight*JELLY_RENDER_SCALE;
    const areaWidth=(maxX-minX+1)*JELLY_CELL_PITCH,areaHeight=(maxY-minY+1)*JELLY_CELL_PITCH;
    const left=JELLY_GRID_PADDING+minX*JELLY_CELL_PITCH+(areaWidth-width)/2;
    const top=JELLY_GRID_PADDING+minY*JELLY_CELL_PITCH+(areaHeight-height)/2;
    html+=`<img class="cell-sprite" src="./assets/jelly-operator/JellyUnit${type}.png" alt="${esc(CELL_NAMES[type])} at slot ${anchor}" draggable="${interactive?'true':'false'}"${interactive?` data-sim-anchor="${anchor}" data-sim-type="${type}"`:''} style="left:${left}px;top:${top}px;width:${width}px;height:${height}px">`;
  }
  const obstruction=Math.max(0,Math.min(71,Math.floor(Number(obstructionIndex)||0)));
  const obstructionName=jellyRewards()[obstruction]?.name||`Obstruction ${obstruction+1}`;
  const obstructionLeft=JELLY_GRID_PADDING+7*JELLY_CELL_PITCH+(4*JELLY_CELL_PITCH-JELLY_OBSTRUCTION_SIZE)/2;
  const obstructionTop=JELLY_GRID_PADDING+3*JELLY_CELL_PITCH+(4*JELLY_CELL_PITCH-JELLY_OBSTRUCTION_SIZE)/2;
  html+=`<img class="obstruction-sprite" src="./assets/jelly-operator/JellyOp${obstruction}.png" alt="${esc(obstructionName)}" draggable="false" style="left:${obstructionLeft}px;top:${obstructionTop}px;width:${JELLY_OBSTRUCTION_SIZE}px;height:${JELLY_OBSTRUCTION_SIZE}px">`;
  return html+'</div></div></div>';
}

function makeSimulatorState(){
  const progress=J.jellyProgress(saveData);
  const feverCount=Math.max(0,Math.min(FEVER_MODES.length,J.jellyUpgradeLevel(saveData,16)));
  return {
    layout:J.jellyLayoutFromSave(saveData),
    obstruction:Math.max(0,Math.min(71,progress.obstruction)),
    plots:new Set((saveData.research?.[18]||[]).map(Number).filter(Number.isFinite)),
    fever:feverCount>0?Math.min(feverCount-1,progress.fever):0,
    roidTiming:-1,
    revivePolicy:'immunoid-first',
    selectedType:0,
    result:null,
    message:'Sandbox initialized from the current save.',
    messageBad:false,
  };
}
function ensureSimulator(){
  if(!simulator)simulator=makeSimulatorState();
  return simulator;
}
function simulatorSave(){
  const state=ensureSimulator();
  const S=structuredClone(saveData);
  if(!Array.isArray(S.research))S.research=[];
  while(S.research.length<=18)S.research.push([]);
  S.research[7]=Array.isArray(S.research[7])?S.research[7].slice():[];
  S.research[7][9]=state.obstruction;
  S.research[14]=Array(JELLY_SIZE).fill(-1);
  for(const [anchor,type] of Object.entries(state.layout))S.research[14][Number(anchor)]=Number(type);
  S.research[18]=Array.from(state.plots).sort((a,b)=>a-b);
  return S;
}
function normalizeSimulatorLayout(message){
  const state=ensureSimulator(),S=simulatorSave();
  let next={},removed=0;
  for(const [rawAnchor,rawType] of Object.entries(state.layout).sort((a,b)=>Number(a[0])-Number(b[0]))){
    const placed=J.jellyPlaceCell(next,Number(rawAnchor),Number(rawType),S);
    if(placed)next=placed;
    else removed++;
  }
  state.layout=next;
  state.result=null;
  state.message=removed?`${message} Removed ${removed} cell${removed===1?'':'s'} that no longer fit unlocked slots.`:message;
  state.messageBad=false;
}

function simulatorSlotFromPointer(board,event){
  const rect=board.getBoundingClientRect(),style=getComputedStyle(board);
  const padX=parseFloat(style.paddingLeft)||0,padY=parseFloat(style.paddingTop)||0;
  const innerWidth=rect.width-padX-(parseFloat(style.paddingRight)||0);
  const innerHeight=rect.height-padY-(parseFloat(style.paddingBottom)||0);
  const x=event.clientX-rect.left-padX,y=event.clientY-rect.top-padY;
  if(x<0||y<0||x>=innerWidth||y>=innerHeight)return null;
  const column=Math.floor(x/(innerWidth/JELLY_COLS));
  const row=Math.floor(y/(innerHeight/(JELLY_SIZE/JELLY_COLS)));
  return column+row*JELLY_COLS;
}
function simulatorChanged(message,bad=false){
  if(workerProgress?.operation==='simulate')stopJellyWorker();
  const state=ensureSimulator();
  state.result=null;
  state.message=message;
  state.messageBad=bad;
}
function placeSimulatorCell(type,slot,sourceAnchor=null){
  const state=ensureSimulator(),S=simulatorSave();
  if(type===-1){
    const owner=J.jellyLayoutOccupancy(state.layout).get(slot);
    if(!owner){
      simulatorChanged('There is no cell at that slot to remove.',true);
    }else{
      state.layout=J.jellyRemoveCell(state.layout,owner.anchor);
      simulatorChanged(`Removed ${CELL_NAMES[owner.type]} from slot ${owner.anchor}.`);
    }
    render();
    return;
  }
  const base=sourceAnchor==null?state.layout:J.jellyRemoveCell(state.layout,sourceAnchor);
  const placed=J.jellyPlaceCell(base,slot,type,S);
  if(!placed){
    simulatorChanged(`Cannot place ${CELL_NAMES[type]} at slot ${slot}: its footprint is locked, out of bounds, obstructed, or exceeds the Virus limit.`,true);
  }else{
    state.layout=placed;
    simulatorChanged(`${sourceAnchor==null?'Placed':'Moved'} ${CELL_NAMES[type]} to anchor slot ${slot}.`);
  }
  render();
}
function wireSimulator(){
  const state=ensureSimulator(),root=document.querySelector('#tab-simulator');
  if(!root)return;
  const stage=root.querySelector('#sim-stage');
  if(stage)stage.onchange=()=>{
    state.obstruction=Number(stage.value);
    normalizeSimulatorLayout(`Selected stage ${state.obstruction+1}.`);
    render();
  };
  const fever=root.querySelector('#sim-fever');
  if(fever)fever.onchange=()=>{
    state.fever=Number(fever.value);
    simulatorChanged(`Selected ${feverModeName(state.fever)} Fever.`);
    render();
  };
  const roid=root.querySelector('#sim-roid');
  if(roid)roid.onchange=()=>{
    state.roidTiming=Math.max(-1,Math.min(J.jellyBossTime(state.obstruction),Number(roid.value)||0));
    simulatorChanged(state.roidTiming<0?'Stronkroid disabled.':`Stronkroid will activate at ${state.roidTiming} seconds.`);
    render();
  };
  const revive=root.querySelector('#sim-revive');
  if(revive)revive.onchange=()=>{
    state.revivePolicy=revive.value;

  };
  root.querySelector('#sim-load-save').onclick=()=>{
    if(workerProgress?.operation==='simulate')stopJellyWorker();

    render();
  };
  root.querySelector('#sim-clear-board').onclick=()=>{
    state.layout={};

  };
  root.querySelector('#sim-remove-mode').onclick=()=>{
    state.selectedType=-1;
    simulatorChanged('Remove mode selected. Click any occupied footprint.');
    render();
  };
  root.querySelector('#sim-use-save-sections').onclick=()=>{
    state.plots=new Set((saveData.research?.[18]||[]).map(Number).filter(Number.isFinite));
    normalizeSimulatorLayout('Restored board sections from the current save.');
    render();
  };
  root.querySelector('#sim-clear-sections').onclick=()=>{
    state.plots.clear();
    normalizeSimulatorLayout('Locked every purchased board section.');
    render();
  };
  root.querySelector('#sim-all-sections').onclick=()=>{
    state.plots=new Set(jellySlotPlots().map(plot=>plot.plotId));
    normalizeSimulatorLayout('Unlocked every board section for this sandbox.');
    render();
  };
  root.querySelectorAll('[data-sim-plot]').forEach(button=>button.onclick=()=>{
    const plotId=Number(button.dataset.simPlot);
    if(state.plots.has(plotId))state.plots.delete(plotId);
    else state.plots.add(plotId);
    normalizeSimulatorLayout(`${state.plots.has(plotId)?'Unlocked':'Locked'} section ${plotId+1}.`);
    render();
  });
  root.querySelectorAll('.sim-cell-pick').forEach(button=>{
    button.onclick=()=>{
      state.selectedType=Number(button.dataset.simType);
      simulatorChanged(`${CELL_NAMES[state.selectedType]} selected. Click an unlocked slot or drag it onto the board.`);
      render();
    };
    button.ondragstart=event=>{
      event.dataTransfer.effectAllowed='copy';
      event.dataTransfer.setData('application/x-jelly-type',button.dataset.simType);
      event.dataTransfer.setData('text/plain',button.dataset.simType);
    };
  });
  const board=root.querySelector('[data-sim-board]');
  if(board){
    board.addEventListener('dragstart',event=>{
      const sprite=event.target.closest('[data-sim-anchor]');
      if(!sprite)return;
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('application/x-jelly-type',sprite.dataset.simType);
      event.dataTransfer.setData('application/x-jelly-anchor',sprite.dataset.simAnchor);
      event.dataTransfer.setData('text/plain',sprite.dataset.simType);
    });
    board.addEventListener('dragover',event=>{
      event.preventDefault();
      event.dataTransfer.dropEffect=event.dataTransfer.getData('application/x-jelly-anchor')?'move':'copy';
    });
    board.addEventListener('drop',event=>{
      event.preventDefault();
      const slot=simulatorSlotFromPointer(board,event);
      if(slot==null)return;
      const typeRaw=event.dataTransfer.getData('application/x-jelly-type')||event.dataTransfer.getData('text/plain');
      const type=Number(typeRaw),anchorRaw=event.dataTransfer.getData('application/x-jelly-anchor');
      if(!Number.isInteger(type)||type<0||type>7){
        simulatorChanged('The dragged item was not a valid Jelly cell.',true);
        render();
        return;
      }
      placeSimulatorCell(type,slot,anchorRaw===''?null:Number(anchorRaw));
    });
    board.addEventListener('click',event=>{
      const slot=simulatorSlotFromPointer(board,event);
      if(slot!=null)placeSimulatorCell(state.selectedType,slot);
    });
    board.addEventListener('contextmenu',event=>{
      event.preventDefault();
      const slot=simulatorSlotFromPointer(board,event);
      if(slot!=null)placeSimulatorCell(-1,slot);
    });
  }
  root.querySelector('#sim-run').onclick=()=>{
    const S=simulatorSave(),validation=J.jellyValidateLayout(state.layout,S);
    if(!validation.valid){
      simulatorChanged(validation.reason||'The sandbox layout is invalid.',true);
      render();
      return;
    }
    state.message='Running one exact 60 FPS operation with fresh randomness.';
    state.messageBad=false;
    startJellyWorker('simulate',{
      layout:state.layout,
      saveData:S,
      options:{
        obstruction:state.obstruction,
        fever:state.fever,
        seed:randomSeed(),
        useRoid:state.roidTiming>=0,
        roidTiming:state.roidTiming>=0?state.roidTiming:'none',
        revivePolicy:J.jellyUpgradeLevel(S,35)>0?state.revivePolicy:'none',
      },
    });
  };
}

    ${spoilersVisible||J.jellyUpgradeLevel(saveData,23)>0?card('Bloodcells',fmt(p.bloodcells),`Daily: ${fmt(J.jellyDailyBloodcells(saveData))}`):''}
    ${card('Attempts banked',fmt(p.tries),`Daily floor: ${fmt(J.jellyDailyTries(saveData))}`)}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,12)>0?card('Best DPS',fmt(p.bestDps),`${J.jellyBestDpsMultiplier(saveData).toFixed(3)}x Bloodcells`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0?card('Cell levels',fmt(J.jellyTotalCellLevel(saveData)),`EXP multiplier: ${J.jellyCellExpMultiplier(saveData,fever).toFixed(2)}x`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,9)>0?card('Slot unlocks left',fmt(J.jellySlotPurchasesLeft(saveData)),`${J.jellyUnlockedSlots(saveData).size} grid slots available`):''}

}

  root.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeTab=tab.dataset.tab;render()});
  root.querySelectorAll('[data-toggle-spoilers]').forEach(button=>button.onclick=toggleSpoilersPreservingScroll);
  root.querySelectorAll('[data-cancel-worker]').forEach(button=>button.onclick=()=>{stopJellyWorker();workerError='Operation cancelled.';render()});
  const run=root.querySelector('#run-optimizer');
  const syncOptimizerControls=()=>{
    const objective=root.querySelector('#objective');
    if(!objective)return;
    optimizerControls={
      objective:objective.value,
      expCellType:Math.max(-1,Math.min(J.jellyUnitsOwned(saveData)-1,Number(root.querySelector('#exp-cell-type')?.value))),
      obstruction:Math.max(0,Math.min(71,Number(root.querySelector('#obstruction').value)-1)),
      beamWidth:Number(root.querySelector('#beam').value),
      iterations:Number(root.querySelector('#iterations').value),
      savedRefinementRounds:Number(root.querySelector('#saved-refinement-rounds').value),
      refinementRounds:Number(root.querySelector('#refinement-rounds').value),
      searchStarts:Number(root.querySelector('#search-starts').value),
      finalistCount:Number(root.querySelector('#finalists').value),
      simulationTrials:Number(root.querySelector('#trials').value),
    };
  };
  root.querySelectorAll('#objective,#exp-cell-type,#obstruction,#beam,#iterations,#saved-refinement-rounds,#refinement-rounds,#search-starts,#finalists,#trials').forEach(control=>{
    control.onchange=syncOptimizerControls;
    control.oninput=syncOptimizerControls;
  });
  if(root.querySelector('#objective'))root.querySelector('#objective').onchange=()=>{
    syncOptimizerControls();
    root.querySelector('#exp-cell-type-control').hidden=optimizerControls.objective!=='exp';
  };
  if(run)run.onclick=()=>{
    syncOptimizerControls();
    optimizedStale=false;
    startJellyWorker('layout',{options:{
        layout:saved,
        ...optimizerControls,
        seed:randomSeed(),
      }});
  };
  const analyze=root.querySelector('#analyze-upgrades');
  const syncPurchaseControls=()=>{
    const objective=root.querySelector('#upgrade-objective');
    if(!objective)return;
    purchaseControls={
      objective:objective.value,
      expCellType:Math.max(-1,Math.min(J.jellyUnitsOwned(saveData)-1,Number(root.querySelector('#upgrade-exp-cell-type')?.value))),
      purchases:Math.max(1,Math.min(50,Number(root.querySelector('#upgrade-purchases').value)||10)),
      trials:Math.max(4,Math.min(128,Number(root.querySelector('#upgrade-trials').value)||8)),
      reoptimize:root.querySelector('#upgrade-reoptimize').checked,
      budget:root.querySelector('#upgrade-budget').checked,
    };
  };
  root.querySelectorAll('#upgrade-objective,#upgrade-exp-cell-type,#upgrade-purchases,#upgrade-trials,#upgrade-reoptimize,#upgrade-budget').forEach(control=>{
    control.onchange=syncPurchaseControls;
    control.oninput=syncPurchaseControls;
  });
  if(root.querySelector('#upgrade-objective'))root.querySelector('#upgrade-objective').onchange=()=>{
    syncPurchaseControls();
    root.querySelector('#upgrade-exp-cell-type-control').hidden=purchaseControls.objective!=='exp';
  };
  if(analyze)analyze.onclick=()=>{
    syncPurchaseControls();
    startJellyWorker('purchases',{options:{
        layout:saved,
        objective:purchaseControls.objective,
        expCellType:purchaseControls.expCellType,
        purchases:purchaseControls.purchases,
        trials:purchaseControls.trials,
        seed:randomSeed(),
        reoptimize:purchaseControls.reoptimize,
        respectBudget:purchaseControls.budget,
      }});
  };
  if(activeTab==='simulator')wireSimulator();
  if(activeTab==='breakdowns')initializeBreakdownTrees(saved);
}

    ${spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0?card('Critical phase',`${op.meanCriticalTime.toFixed(2)} sec mean`,r.criticalUnlocked?'Critical Condition active':'Fails when normal timer expires'):''}
    ${card('Bloodcells',fmt(op.meanBloodcells),'Mean per attempt, including live Best DPS growth')}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0?card('Cell EXP',fmt(op.meanCellExp),`Mean; ${r.hits} hits in representative trial`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0?card('Boss attacks',op.meanDeaths.toFixed(2)+' mean deaths',`${op.meanRevives.toFixed(2)} mean revives used`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,4)>0?card('Immunoid focus',`${r.immunoidFocusTime.toFixed(2)} sec`,`${r.immunoidHits} focused hits in representative trial`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,28)>0?card('Amoeba weakening',`${r.amoebaStacks} stacks`,`${r.amoebaStacksAtCriticalStart} at Critical start; +${r.amoebaStacks-r.amoebaStacksAtCriticalStart} during Critical`):''}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,29)>0?card('Stronkroid timing',roidTimingText(op.roidTiming,r.standardTime),'',stronkroidTooltip()):''}
  </div>
  <h3>Representative trial contribution</h3>
  <div class="table-scroll"><table><thead><tr><th>Cell</th><th class="num">Shots</th><th class="num">Hits</th><th class="num">Damage</th><th class="num">Bloodcells</th><th class="num">EXP</th></tr></thead><tbody>${contributions}</tbody></table></div>
  ${deaths?`<h3>Critical target timeline</h3><div>${deaths}</div>`:''}
  <p class="note" style="margin-bottom:0">${policyParts.length?esc(policyParts.join(', '))+'. ':''}${op.trials} trials.</p>`;
}

function objectiveOptions(selected){
  const options=[

    ['exp','Most Cell EXP per attempt',spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0],

function cellExpTargetOptions(selected){
  const owned=J.jellyUnitsOwned(saveData);
  return `<option value="-1" ${selected<0?'selected':''}>Total EXP</option>`
    +CELL_NAMES.slice(0,owned).map((name,type)=>`<option value="${type}" ${selected===type?'selected':''}>${esc(name)}</option>`).join('');

  return type<0?Number(operation?.meanCellExp)||0:Number(operation?.meanCellExpByType?.[type])||0;

function purchasePlannerHtml(){
  let result='<p class="note">Sequential purchase simulation.</p>';
  if(upgradeAnalysis){
    const baseline=upgradeAnalysis.baseline,final=upgradeAnalysis.final;
    const expCellType=upgradeAnalysis.expCellType??-1;
    const expTargetName=cellExpTargetName(expCellType);
    const baselineExp=cellExpValue(baseline,expCellType),finalExp=cellExpValue(final,expCellType);
    const rows=upgradeAnalysis.rows.map(row=>`<tr><td><strong>${esc(row.name)}</strong><div class="sub">${esc(row.description)}</div></td><td class="num">${row.purchases}</td><td class="num">${row.startingLevel} → ${row.finalLevel}</td><td class="num">${fmt(row.totalCost)}</td><td class="num">${esc(row.effectText)}</td></tr>`).join('');
    const timeSaved=baseline.meanTime&&final.meanTime?baseline.meanTime-final.meanTime:0;
    result=`<div class="cards planner-cards">
      ${card('Purchases modeled',`${upgradeAnalysis.completedPurchases} / ${upgradeAnalysis.requestedPurchases}`,upgradeAnalysis.completedPurchases<upgradeAnalysis.requestedPurchases?'Stopped when no eligible purchase remained':'Full requested horizon completed')}
      ${card('Total Bloodcell cost',fmt(upgradeAnalysis.totalCost),upgradeAnalysis.respectBudget?`${fmt(upgradeAnalysis.remainingBloodcells)} remaining from current save`:'Hypothetical budget')}
      ${card('Clear probability',`${pct(baseline.clearProbability)} → ${pct(final.clearProbability)}`,signedPct(final.clearProbability-baseline.clearProbability))}
      ${card('Mean damage',`${fmt(baseline.meanDamage)} → ${fmt(final.meanDamage)}`,signed(final.meanDamage-baseline.meanDamage))}
      ${card('Bloodcells / attempt',`${fmt(baseline.meanBloodcells)} → ${fmt(final.meanBloodcells)}`,signed(final.meanBloodcells-baseline.meanBloodcells))}
      ${card(`${esc(expTargetName)} / attempt`,`${fmt(baselineExp)} → ${fmt(finalExp)}`,signed(finalExp-baselineExp))}
      ${card('Critical survival',`${baseline.meanCriticalTime.toFixed(2)}s → ${final.meanCriticalTime.toFixed(2)}s`,signed(final.meanCriticalTime-baseline.meanCriticalTime)+' sec')}
      ${card('Mean clear time',baseline.meanTime&&final.meanTime?`${baseline.meanTime.toFixed(2)}s → ${final.meanTime.toFixed(2)}s`:'Not cleared in both states',timeSaved?signed(timeSaved)+' sec saved':'')}
    </div>
    <div class="table-scroll planner-table"><table><thead><tr><th>Upgrade</th><th class="num">Levels bought</th><th class="num">Level total</th><th class="num">Total cost</th><th class="num">Planned effect</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No eligible purchases were available.</td></tr>'}</tbody></table></div>`;
  }
  return `<div class="section"><h2>Cost-effective purchase planner</h2>
    <div class="planner-controls">
      <label class="control">Objective<select id="upgrade-objective">${objectiveOptions(purchaseControls.objective)}</select></label>
      <label class="control" id="upgrade-exp-cell-type-control" ${purchaseControls.objective==='exp'?'':'hidden'}>EXP target<select id="upgrade-exp-cell-type">${cellExpTargetOptions(purchaseControls.expCellType)}</select></label>
      <label class="control">Purchases ahead<input id="upgrade-purchases" type="number" min="1" max="50" value="${purchaseControls.purchases}"></label>
      <label class="control">Trials per comparison<input id="upgrade-trials" type="number" min="4" max="128" value="${purchaseControls.trials}"></label>
      <label class="check-control"><input id="upgrade-reoptimize" type="checkbox" ${purchaseControls.reoptimize?'checked':''}><span><strong>Reoptimize layout</strong><small>Search again after each purchase</small></span></label>
      <label class="check-control"><input id="upgrade-budget" type="checkbox" ${purchaseControls.budget?'checked':''}><span><strong>Respect Bloodcells</strong><small>Stop at the current saved balance</small></span></label>
      <button class="primary" id="analyze-upgrades" ${workerProgress?.operation==='purchases'?'disabled':''}>Plan purchases</button>
    </div>${workerProgressHtml('purchases')}${result}</div>`;
}

function bonusesHtml(){
  const obstruction=J.jellyProgress(saveData).obstruction;
  if(!spoilersVisible&&J.jellyUpgradeLevel(saveData,39)<=0)return '<div class="section"><h2>Obstruction rewards</h2><p class="spoiler-hidden">Operational Bonuses is not unlocked yet.</p></div>';
  const rows=jellyRewards().map(r=>{
    const active=obstruction>r.index;
    if(!active&&!spoilersVisible)return `<tr><td>${r.index+1}</td><td class="spoiler-hidden">???</td><td class="spoiler-hidden">Unreached reward</td><td class="spoiler-hidden">Clear this obstruction to reveal its bonus.</td><td class="num spoiler-hidden">???</td></tr>`;
    return `<tr><td>${r.index+1}</td><td>${esc(r.name)}</td><td>${esc(jellyRewardTarget(r.index))}</td><td>${esc(gameDescription(r.description,r.value))}</td><td class="num">${esc(rewardEffectText(r))}</td></tr>`;
  }).join('');

function factorVisible(factor){
  if(spoilersVisible)return true;
  if(factor.unlockId!=null&&J.jellyUpgradeLevel(saveData,factor.unlockId)<=0)return false;
  if(factor.rewardIndex!=null&&J.jellyProgress(saveData).obstruction<=factor.rewardIndex)return false;
  return true;
}
function factorTreeNode(factor){
  if(!factorVisible(factor))return null;
  return {
    label:esc(factor.label),
    val:factor.value,
    fmt:factor.unit==='x'?'x':factor.unit==='%'?'%':undefined,
    children:(factor.children||[]).map(factorTreeNode).filter(Boolean),
  };
}
function multiplierTree(label,breakdown){
  return {
    label:esc(label),
    val:breakdown.value,
    fmt:'x',
    children:(breakdown.factors||[]).map(factorTreeNode).filter(Boolean),
  };
}
function breakdownPanel(id,title,breakdown,lockedText){
  if(breakdown.available===false&&!spoilersVisible)return `<div class="breakdown-panel"><h3>${esc(title)}</h3><p class="spoiler-hidden">${esc(lockedText)}</p></div>`;
  return `<div class="breakdown-panel"><h3>${esc(title)}</h3><div id="${id}"></div></div>`;
}
function breakdownsHtml(layout){
  const fever=currentPolicy?.fever??J.jellyProgress(saveData).fever;
  const feverUnlocked=J.jellyUpgradeLevel(saveData,16)>0;
  const feverContext=feverUnlocked
    ? `<p class="note">Fever: ${esc(feverModeName(fever))}${fever===0?' · COLD starts at 1.00x':''}</p>`
    : '';
  const damage=J.jellyCellDamageBreakdown(saveData,{fever});
  const speed=J.jellyCellSpeedBreakdown(saveData,fever);
  const exp=J.jellyCellExpBreakdown(saveData,fever);
  const bloodcells=J.jellyBloodcellBreakdown(saveData,fever);
  const layoutBreakdown=J.jellyLayoutBreakdown(layout,saveData,{fever});
  const owned=J.jellyUnitsOwned(saveData);
  const cellRows=CELL_NAMES.slice(0,8).map((name,type)=>{
    if(type>=owned&&!spoilersVisible)return '';
    const cells=layoutBreakdown.metrics?.cells?.filter(cell=>cell.type===type)||[];
    const attacks=cells.reduce((sum,cell)=>sum+cell.attacksPerSecond,0);
    const dps=cells.reduce((sum,cell)=>sum+cell.dps,0);
    const hit=cells.length?cells.reduce((sum,cell)=>sum+cell.damage,0)/cells.length:0;
    return `<tr><td>${esc(name)}</td><td class="num">${cells.length}</td><td class="num">${fmt(hit)}</td><td class="num">${fmt(attacks)}/sec</td><td class="num">${fmt(dps)}</td></tr>`;
  }).join('');
  return `<div class="section"><h2>Formula breakdowns</h2>${feverContext}
    <div class="breakdown-grid">
      ${breakdownPanel('jelly-damage-tree','Cell Damage',damage,'Cell Damage is not available.')}
      ${breakdownPanel('jelly-speed-tree','Cell Speed',speed,'Cell Speed is not available.')}
      ${breakdownPanel('jelly-exp-tree','Cell EXP per hit',exp,'Cell EXP unlocks with Cell Biology.')}
      ${breakdownPanel('jelly-bloodcell-tree','Bloodcells per damage',bloodcells,'Bloodcell gain unlocks with Bloodcell Coagulation.')}
      ${layoutBreakdown.available?'<div class="breakdown-panel"><h3>Layout Damage</h3><div id="jelly-layout-damage-tree"></div></div>':''}
      ${layoutBreakdown.available?'<div class="breakdown-panel"><h3>Layout Speed</h3><div id="jelly-layout-speed-tree"></div></div>':''}
    </div>
    <div id="jelly-bt-tooltip" class="bt-tooltip"></div>
  </div>
  ${layoutBreakdown.available?`<div class="section"><h2>Per-cell output</h2><div class="cards">
    ${card('Total steady DPS',fmt(layoutBreakdown.metrics.dps),`${fmt(layoutBreakdown.metrics.attacksPerSecond)} attacks/sec`)}
    ${card('Damage passive',layoutBreakdown.metrics.damagePassive.toFixed(3)+'x')}
    ${card('Speed passive',layoutBreakdown.metrics.speedPassive.toFixed(3)+'x')}
    ${spoilersVisible||J.jellyUpgradeLevel(saveData,5)>0?card('Virus multiplier',layoutBreakdown.metrics.virusMultiplier.toFixed(3)+'x',`${layoutBreakdown.metrics.infectedSlots} infected slots`):''}
  </div><div class="table-scroll"><table><thead><tr><th>Cell type</th><th class="num">Placed</th><th class="num">Average hit</th><th class="num">Attack rate</th><th class="num">DPS</th></tr></thead><tbody>${cellRows}</tbody></table></div></div>`:''}`;
}
function initializeBreakdownTrees(layout){
  const fever=currentPolicy?.fever??J.jellyProgress(saveData).fever;
  const damage=J.jellyCellDamageBreakdown(saveData,{fever});
  const speed=J.jellyCellSpeedBreakdown(saveData,fever);
  const exp=J.jellyCellExpBreakdown(saveData,fever);
  const bloodcells=J.jellyBloodcellBreakdown(saveData,fever);
  const layoutBreakdown=J.jellyLayoutBreakdown(layout,saveData,{fever});
  resetTreeCounter();
  const trees=[
    ['jelly-damage-tree',multiplierTree('Cell Damage',damage)],
    ['jelly-speed-tree',multiplierTree('Cell Speed',speed)],
    ['jelly-exp-tree',multiplierTree('Cell EXP per hit',exp)],
    ['jelly-bloodcell-tree',multiplierTree('Bloodcells per damage',bloodcells)],
    ['jelly-layout-damage-tree',{label:'Layout Damage Multiplier',val:layoutBreakdown.layoutDamageMultiplier||0,fmt:'x',children:(layoutBreakdown.damageFactors||[]).map(factorTreeNode).filter(Boolean)}],
    ['jelly-layout-speed-tree',{label:'Layout Speed Multiplier',val:layoutBreakdown.layoutSpeedMultiplier||0,fmt:'x',children:(layoutBreakdown.speedFactors||[]).map(factorTreeNode).filter(Boolean)}],
  ];
  for(const [id,tree] of trees){
    const host=document.getElementById(id);
    if(host)renderBreakdownTree(tree,host,{tooltipId:'jelly-bt-tooltip'});
  }
}

function optimizerHtml(saved){
  const p=J.jellyProgress(saveData);
  if(optimizerControls.obstruction==null)optimizerControls.obstruction=p.obstruction;
  let result='';
  if(optimized){
    const resultSaved=optimized.savedLayout||saved;
    const savedM=optimized.savedMetrics||J.jellyLayoutMetrics(resultSaved,saveData,{fever:optimized.fever});
    const op=optimized.operation, savedOp=optimized.savedOperation, blindOp=optimized.blindOperation, immunoidOp=optimized.immunoidOperation, r=op.representative;
    const expCellType=optimized.expCellType??-1;
    const expTargetName=cellExpTargetName(expCellType);
    const clearInterval=target=>target?`${pct(target.clearProbabilityLow)}–${pct(target.clearProbabilityHigh)}`:'—';
    const objectiveValue=target=>{
      if(!target)return '—';
      if(optimized.objective==='clear')return pct(target.clearProbability);
      if(optimized.objective==='bloodcells')return fmt(target.meanBloodcells);
      if(optimized.objective==='exp')return fmt(cellExpValue(target,expCellType));
      if(optimized.objective==='survival')return `${target.meanCriticalTime.toFixed(2)} sec`;
      return fmt(target.meanDamage);
    };
    const objectiveComparison=()=>{
      if(!blindOp||!savedOp)return null;
      return `${objectiveValue(blindOp)} blind vs ${objectiveValue(savedOp)} saved`;
    };
    const savedOccupied=Array.from(J.jellyLayoutOccupancy(resultSaved).keys()).sort((a,b)=>a-b);
    const optimizedOccupied=Array.from(J.jellyLayoutOccupancy(optimized.layout).keys()).sort((a,b)=>a-b);
    const sameCoverage=savedOccupied.length===optimizedOccupied.length&&savedOccupied.every((slot,index)=>slot===optimizedOccupied[index]);
    const sameCounts=savedM.rawCounts.every((count,type)=>count===optimized.metrics.rawCounts[type]);
    const anchorOnlyNote=sameCoverage&&sameCounts
      ? '<p class="note">Same cells and occupied slots; anchors differ.</p>'
      : '';
    const archetypeRows=(optimized.archetypeResults||[]).filter(row=>row.type<J.jellyUnitsOwned(saveData)).map(row=>`<tr>
      <td>${esc(row.name)}</td><td class="num">${row.count}</td><td class="num">${row.operation?objectiveValue(row.operation):'—'}</td>
      <td class="num">${row.operation?clearInterval(row.operation):'—'}</td>
    </tr>`).join('');
    const contributionRows=(optimized.anchorContributions||[]).map(row=>`<tr>
      <td>${row.anchor}</td><td>${esc(row.name)}</td><td class="num">${fmt(row.directDps)}</td><td class="num">${fmt(row.marginalDps)}</td><td class="num">${pct(row.marginalPct)}</td>
    </tr>`).join('');
    const countArchetypeRows=(optimized.countArchetypeResults||[]).filter(row=>row.type<J.jellyUnitsOwned(saveData)&&row.operation).map(row=>`<tr>
      <td>${esc(row.name)}</td><td class="num">${row.count}</td><td class="num">${objectiveValue(row.operation)}</td><td class="num">${clearInterval(row.operation)}</td>
    </tr>`).join('');
    const breakpointRanges=(optimized.immunoidBreakpoint?.ranges||[]).map(range=>range.start===range.end?String(range.start+1):`${range.start+1}–${range.end+1}`).join(', ');
    const worstProxy=optimized.proxyAudit?.underRanked?.[0];
    const clearGain=savedOp?op.clearProbability-savedOp.clearProbability:0;
    const changeGroups=Array.from(optimized.moves.reduce((groups,move)=>{
      const key=`${move.action}|${move.type}`;
      const row=groups.get(key)||{action:move.action,name:move.name,anchors:[]};
      row.anchors.push(move.anchor);
      groups.set(key,row);
      return groups;
    },new Map()).values()).sort((a,b)=>a.action.localeCompare(b.action)||a.name.localeCompare(b.name));
    const changePlan=changeGroups.map(group=>`<div class="move"><strong>${group.action==='remove'?'Remove':'Place'} ${esc(group.name)}:</strong> slots ${group.anchors.sort((a,b)=>a-b).join(', ')}</div>`).join('');
    result=`<div class="section"><h2>Recommendation</h2>
      <div class="cards">
        ${savedOp?card('Saved clear probability',pct(savedOp.clearProbability),savedOp.successCount?`Median ${savedOp.medianTime.toFixed(2)} sec`:`${pct(savedOp.meanDamage/savedOp.representative.hp)} mean damage`):''}
        ${card('Recommended clear probability',pct(op.clearProbability),`${clearInterval(op)} 95% interval`)}
        ${savedOp?card('Improvement',`${clearGain>=0?'+':''}${(clearGain*100).toFixed(2)} points`,op.successCount?`Median clear ${op.medianTime.toFixed(2)} sec`:`${pct(op.meanDamage/r.hp)} mean damage`):''}
        ${J.jellyUpgradeLevel(saveData,16)>0?card('Fever',feverModeName(op.fever)):''}
        ${spoilersVisible||J.jellyUpgradeLevel(saveData,29)>0?card('Stronkroid',roidTimingText(op.roidTiming,r.standardTime),'',stronkroidTooltip()):''}
        ${spoilersVisible||J.jellyUpgradeLevel(saveData,35)>0?card('Revival priority',esc(op.revivePolicy)):''}
        ${spoilersVisible||J.jellyUpgradeLevel(saveData,36)>0?card('Critical survival',`${op.meanCriticalTime.toFixed(2)} sec`,`${op.meanDeaths.toFixed(2)} deaths; ${op.meanRevives.toFixed(2)} revives`):''}
        ${spoilersVisible||J.jellyUpgradeLevel(saveData,23)>0?card('Bloodcells / attempt',fmt(op.meanBloodcells)):''}
        ${spoilersVisible||J.jellyUpgradeLevel(saveData,10)>0?card(`${esc(expTargetName)} / attempt`,fmt(cellExpValue(op,expCellType))):''}
      </div>
      ${optimizedStale?'<p class="bad">The save refreshed while this search was running. This recommendation uses the save from when the search started.</p>':''}
      ${legendHtml()}<div class="grid-pair">${gridHtml(resultSaved,optimizedStale?'Search starting save':'Current save',op.representative.obstruction,{unlocked:optimized.savedUnlockedSlots})}${gridHtml(optimized.layout,'Optimized',op.representative.obstruction,{unlocked:optimized.savedUnlockedSlots})}</div>
      ${anchorOnlyNote}
      <h3>Changes</h3><div>${optimized.moves.length?changePlan:'No changes improve this objective.'}</div>
      <details class="optimizer-diagnostics"><summary>Search details</summary>
        <div class="cards">
          ${card('Steady DPS',`${fmt(savedM.dps)} → ${fmt(optimized.metrics.dps)}`,savedM.dps>0?`+${pct(optimized.metrics.dps/savedM.dps-1)}`:'')}
          ${blindOp?card('Blind search vs saved',objectiveComparison(),optimized.search?.savedDiscoveredByConstruction?'Exact saved geometry found':'Saved geometry not independently found'):''}
          ${J.jellyUpgradeLevel(saveData,4)>0?card('Best Immunoid finalist',immunoidOp?objectiveValue(immunoidOp):'None',immunoidOp?`${J.jellyLayoutMetrics(optimized.immunoidLayout,saveData,{fever:immunoidOp.fever}).rawCounts[4]} Immunoid`:'None'):''}
          ${optimized.immunoidBreakpoint?card('Immunoid breakpoint',breakpointRanges||'None',optimized.immunoidBreakpoint.currentPreferred?'Favored here':'Not favored here'):''}
          ${card('Surrogate rank audit',(optimized.proxyAudit?.rankCorrelation??1).toFixed(3),worstProxy&&worstProxy.rankDelta>0?`Largest under-rank: ${worstProxy.rankDelta}`:'No under-ranked finalist')}
          ${card('Search',`${optimized.search?.searchStarts||1} starts`,`${fmt(optimized.evaluated)} candidates · ${optimized.search?.eliteArchiveSize||0} niches`)}
          ${card('Neighborhood',`${optimized.search?.neighborhoodCandidates||0} checked`,`${optimized.search?.neighborhoodPromoted||0} promoted`)}
          ${optimized.adaptiveConfirmation?.triggered?card('Confirmation',`${optimized.adaptiveConfirmation.confirmedTrials} trials`,`${optimized.adaptiveConfirmation.validationTrials||0} validation trials`):''}
        </div>
        <h3>Cell-type finalists</h3>
        <div class="table-scroll"><table><thead><tr><th>Required type</th><th class="num">Count</th><th class="num">Objective</th><th class="num">Clear 95% interval</th></tr></thead><tbody>${archetypeRows}</tbody></table></div>
        <h3>Count finalists</h3>
        <div class="table-scroll"><table><thead><tr><th>Cell type</th><th class="num">Count</th><th class="num">Objective</th><th class="num">Clear 95% interval</th></tr></thead><tbody>${countArchetypeRows}</tbody></table></div>
        <h3>Anchor contributions</h3>
        <div class="table-scroll"><table><thead><tr><th>Anchor</th><th>Cell</th><th class="num">Direct DPS</th><th class="num">Marginal DPS</th><th class="num">Share</th></tr></thead><tbody>${contributionRows}</tbody></table></div>
      </details>
    </div>`;
  }
  return `<div class="section"><h2>Layout search</h2>
    <div class="controls">
      <label class="control">Objective<select id="objective">
        ${objectiveOptions(optimizerControls.objective)}
      </select></label>
      <label class="control" id="exp-cell-type-control" ${optimizerControls.objective==='exp'?'':'hidden'}>EXP target<select id="exp-cell-type">${cellExpTargetOptions(optimizerControls.expCellType)}</select></label>
      <label class="control">Obstruction<input id="obstruction" type="number" min="1" max="72" value="${optimizerControls.obstruction+1}"></label>
      <label class="control">Diverse beam width<input id="beam" type="number" min="4" max="128" value="${optimizerControls.beamWidth}"></label>
      <label class="control">Empty-board build rounds<input id="iterations" type="number" min="1" max="120" value="${optimizerControls.iterations}"></label>
      <label class="control">Saved-board relocation rounds<input id="saved-refinement-rounds" type="number" min="0" max="30" value="${optimizerControls.savedRefinementRounds}"></label>
      <label class="control">Merged local rounds<input id="refinement-rounds" type="number" min="0" max="30" value="${optimizerControls.refinementRounds}"></label>
      <label class="control">Independent starts<input id="search-starts" type="number" min="1" max="12" value="${optimizerControls.searchStarts}"></label>
      <label class="control">Fully simulated finalists<input id="finalists" type="number" min="1" max="64" value="${optimizerControls.finalistCount}"></label>
      <label class="control">Simulation trials<input id="trials" type="number" min="4" max="1000" value="${optimizerControls.simulationTrials}"></label>
      <button class="primary" id="run-optimizer" ${workerProgress?.operation==='layout'?'disabled':''}>Run optimizer</button>
    </div>
    ${workerProgressHtml('layout')}
    <p class="note">Higher values search longer. Thorough: 12 / 20 / 3 / 4 / 8 starts / 8 finalists / 256 trials.</p>
  </div>${result}`;
}

wireJsTooltips();
if(J.hasJellyData(saveData))render();
</script>
</body>
</html>
