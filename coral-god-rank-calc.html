<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idleon Singularity Spirals Planner</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460; --accent: #e94560;
  --text: #eee; --text2: #c0c0d4; --gold: #ffd700; --green: #4caf50;
  --blue: #2196f3; --purple: #bb86fc; --cyan: #4dd0e1; --red: #f44;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
h1 { text-align: center; padding: 12px; background: var(--bg2); border-bottom: 2px solid var(--accent); font-size: 1.4em; }
h1 span { color: var(--accent); }
.main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.section { background: var(--bg2); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.section h2 { margin-bottom: 12px; color: var(--accent); font-size: 1.15em; border-bottom: 1px solid #333; padding-bottom: 6px; }
.section h3 { margin: 12px 0 8px; color: var(--cyan); font-size: 1em; }
.card-grid { display: grid; gap: 10px; }
.card-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.card-grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.card { background: var(--bg3); border-radius: 8px; padding: 10px 12px; border: 1px solid #444; min-width: 0; }
.card-title { font-weight: 700; font-size: .85em; color: var(--cyan); }
.card-val { font-weight: 700; font-size: 1.5em; color: var(--gold); }
.card-sub { color: var(--text2); font-size: .8em; }
.data-table { width: 100%; border-collapse: collapse; font-size: .9em; }
.data-table th { text-align: left; padding: 6px; color: var(--text2); border-bottom: 1px solid #333; background: var(--bg2); }
.data-table td { padding: 8px 6px; border-bottom: 1px solid #ffffff0a; vertical-align: top; overflow-wrap: anywhere; }
.data-table tr:hover td { background: #ffffff08; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }
strong { color: var(--gold); }
.bad { color: var(--red); }
#spending-root .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
#main-content label { display: flex; flex-direction: column; gap: 4px; font-size: .9em; color: var(--text2); min-width: 0; }
#main-content input, #main-content select { max-width: 100%; min-height: 38px; border-radius: 4px; border: 1px solid #555; background: var(--bg3); color: var(--text); padding: 6px 8px; font: inherit; }
#spending-root button { background: var(--accent); color: var(--text); min-height: 38px; padding: 10px 16px; border: 0; border-radius: 5px; cursor: pointer; font: inherit; }
#spending-root button:disabled { opacity: .55; cursor: default; }
#spending-root :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#spending-root [hidden] { display: none !important; }
#spending-root .goal-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 2px solid #41465b; }
#spending-root .goal-tabs button { background: var(--bg2); color: var(--text2); border-radius: 5px 5px 0 0; border-bottom: 3px solid transparent; }
#spending-root .goal-tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
#spending-root .spend-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
#spending-root .spend-heading h2 { margin: 0; border: 0; padding: 0; }
#spending-root .spend-banks { color: var(--text2); margin-top: 10px; }
#spending-root .spend-banks span { color: var(--gold); }
#spending-root .spend-note { color: var(--text2); margin: 10px 0; font-size: .9em; line-height: 1.5; }
#spending-root .bank-redemption-steps { padding-left: 28px; line-height: 1.5; overflow-wrap: anywhere; }
#spending-root .bank-step { margin: 10px 0; padding: 10px 14px; border: 1px solid #ffffff18; border-left: 3px solid var(--purple); border-radius: 5px; background: #ffffff05; }
#spending-root .bank-step::marker { color: var(--text2); font-weight: 700; }
#spending-root .bank-step-claim { border-left-color: var(--green); }
#spending-root .bank-step-grind { border-left-color: var(--cyan); }
#spending-root .bank-step-convert { border-left-color: var(--gold); }
#spending-root .bank-step-rank { border-left-color: var(--red); }
#spending-root .bank-step-heading, #spending-root .bank-step-values, #spending-root .bank-step-overview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
#spending-root .bank-step-heading { margin-bottom: 5px; }
#spending-root .bank-step-kind { color: var(--text2); text-transform: uppercase; font-size: .75em; font-weight: 700; letter-spacing: .06em; }
#spending-root .bank-step-muted { color: var(--text2); font-size: .9em; }
#spending-root .bank-step-gain { color: var(--green); font-size: .9em; }
#spending-root .bank-number { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
#spending-root .bank-number > span { color: var(--text2); font-weight: 400; }
#spending-root .bank-step-overview { margin: 12px 0; color: var(--text2); font-size: .9em; }
#spending-root .bank-step details { margin-top: 4px; }
#spending-root .bank-step summary { padding: 4px 0; font-size: .9em; }
#main-content .bank-rank-choice { flex-direction: row; align-items: center; }
#main-content .bank-rank-choice input { min-height: 0; width: 16px; height: 16px; }
#spending-root .spend-reserve { max-width: 500px; margin: 12px 0; }
#spending-root details { margin-top: 14px; }
#spending-root summary { cursor: pointer; color: var(--cyan); padding: 8px 0; }
#spending-root pre { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
#spending-root .spend-claim-chips { display: flex; flex-wrap: wrap; gap: 6px; }
#spending-root .pill { background: #ffffff0a; border: 1px solid #ffffff14; color: var(--text2); padding: 4px 8px; border-radius: 999px; font-size: .9em; }
#spending-root .spend-purchases { display: grid; gap: 6px; margin: 12px 0; }
#spending-root .spend-purchases > div { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; padding: 8px 10px; background: #ffffff0a; border-radius: 4px; }
#spending-root .spend-activity { display: block; color: var(--text2); font-size: .9em; margin-top: 3px; }
#spending-root .spend-activity.bad { color: var(--red); }
#spending-root .spend-best td { color: var(--gold); background: #ffd70014; }
#spending-root .singularity-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
#spending-root .singularity-chart { min-width: 0; }
#spending-root .singularity-chart svg { display: block; width: 100%; height: auto; }
#spending-root .singularity-chart svg text { fill: var(--text2); font-size: 11px; }
#spending-root .singularity-chart p { overflow-wrap: anywhere; }
#spending-root .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 10px 0; font-size: .9em; }
#spending-root .chart-legend span::before { content: ''; display: inline-block; width: 16px; border-top: 3px solid currentColor; margin-right: 6px; vertical-align: middle; }
#spending-root .bank-characters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
#spending-root .bank-characters label { flex-direction: row; align-items: center; gap: 6px; border: 1px solid #555; border-radius: 999px; padding: 4px 10px; min-height: 38px; }
#spending-root .bank-characters input { width: 16px; min-height: 16px; padding: 0; }
@media (max-width: 650px) {
  #spending-root .bank-plans thead { display: none; }
  #spending-root .bank-plans tr { display: grid; grid-template-columns: 1fr 1fr; padding: 8px; margin: 10px 0; background: #ffffff0a; }
  #spending-root .bank-plans td:first-child { grid-column: 1 / -1; }
  #spending-root .bank-plans td::before { content: attr(data-label); display: block; color: var(--text2); font-size: .85em; }
  #spending-root .spend-pending thead { display: none; }
  #spending-root .spend-pending tr { display: grid; grid-template-columns: 1fr 1fr; margin: 10px 0; background: #ffffff0a; border-radius: 5px; padding: 8px; }
  #spending-root .spend-pending td { border: 0; }
  #spending-root .spend-pending td:first-child, #spending-root .spend-pending td:last-child { grid-column: 1 / -1; }
  #spending-root .spend-pending td:not(:first-child)::before { content: attr(data-label); display: block; font-size: .85em; color: var(--text2); }
  #spending-root .controls > label { flex: 1 1 100%; }
}
.coral-exact-tooltip { position: fixed; z-index: 10000; max-width: min(450px, calc(100vw - 16px)); padding: 8px 10px; border: 1px solid var(--cyan); border-radius: 5px; background: var(--bg2); color: var(--text); overflow-wrap: anywhere; pointer-events: none; }
</style>
<script type="module" src="./js/ui/site-nav.js"></script>
</head>
<body>
<h1><span>Idleon</span> Singularity Spirals Planner</h1>
<div id="save-area"></div>
<div class="main" id="main-content"><div class="section">Checking saved login/save data...</div></div>
<script type="module">
import { saveData } from './js/state.js';
import { initSaveLoader } from './js/ui/save-loader.js';
import { mountCoralDivinitySpending } from './js/ui/coral-divinity-spending.js?v=spiral-bank-7';

let rawSave = null, spendingUI = null;
function render() {
  spendingUI?.dispose();
  const root = document.getElementById('main-content');
  root.innerHTML = '<div id="spending-root"></div>';
  spendingUI = mountCoralDivinitySpending(root.firstElementChild, saveData, rawSave, { onRecalculate: render });
}
initSaveLoader({
  target: '#save-area',
  auth: true,
  onLoad(_, raw, metadata) {
    rawSave = raw;
    if (metadata?.source === 'auto-refresh' && spendingUI) spendingUI.stale();
    else render();
  },
  onReady(status) {
    if (!status.loaded && !rawSave)
      document.getElementById('main-content').innerHTML = '<div class="section">Load a save or sign in to begin.</div>';
  },
  statusText: () => 'Save loaded',
});
</script>
</body>
</html>
