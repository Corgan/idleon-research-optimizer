<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Idleon Royal Guardian Calculator</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --bg2: #16213e;
        --bg3: #0f3460;
        --accent: #e94560;
        --text: #eee;
        --text2: #c0c0d4;
        --gold: #ffd700;
        --green: #4caf50;
        --blue: #2196f3;
        --cyan: #4dd0e1;
        --red: #f44;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      h1 {
        text-align: center;
        margin: 0;
        background: var(--bg2);
        border-bottom: 2px solid var(--accent);
      }
      h1 a {
        float: left;
        font-size: 0.7em;
      }
      h1 span {
        color: var(--accent);
      }
      .main {
        max-width: 1400px;
        margin: auto;
        padding: 16px;
      }
      .tabs,
      .subtabs {
        display: flex;
        flex-wrap: wrap;
        background: var(--bg2);
        border-bottom: 1px solid #334;
      }
      .tab-btn,
      .subtabs button,
      button,
      select,
      input {
        font: inherit;
      }
      .tab-btn,
      .subtabs button {
        background: transparent;
        color: var(--text2);
        border: 0;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .tab-btn:hover,
      .subtabs button:hover {
        background: #ffffff0d;
        color: var(--text);
      }
      .tab-btn[aria-selected="true"],
      .subtabs button[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: bold;
      }
      .section,
      .opt-section {
        background: var(--bg2);
        border-radius: 8px;
        padding: 16px;
        margin: 12px 0;
      }
      .section h2,
      .opt-section h2 {
        color: var(--accent);
        font-size: 1.15em;
        border-bottom: 1px solid #333;
        padding-bottom: 7px;
        margin: 0 0 12px;
      }
      .section h3,
      .opt-section h3 {
        color: var(--cyan);
        font-size: 1em;
        margin: 12px 0 7px;
      }
      .card-grid {
        display: grid;
        gap: 10px;
      }
      .cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .cols-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .card {
        border: 1px solid #445;
        border-radius: 6px;
        padding: 10px;
        min-width: 0;
      }
      .card-title {
        color: var(--cyan);
        font-size: 0.82em;
      }
      .card-val {
        color: var(--gold);
        font-size: 1.35em;
        font-weight: bold;
      }
      .card-sub,
      .note,
      .small {
        color: var(--text2);
        font-size: 0.82em;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.74em;
        font-weight: bold;
      }
      .badge-green {
        background: #4caf5033;
        color: var(--green);
      }
      .badge-gold {
        background: #ffd70022;
        color: var(--gold);
      }
      .badge-blue {
        background: #2196f333;
        color: var(--blue);
      }
      .badge-red {
        background: #ff444422;
        color: var(--red);
      }
      .badge-cyan {
        background: #4dd0e133;
        color: var(--cyan);
      }
      button {
        padding: 7px 12px;
        color: var(--text);
        background: var(--bg3);
        border: 1px solid #4a607e;
        border-radius: 4px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .controls,
      .planner-controls {
        display: flex;
        gap: 10px;
        align-items: end;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .controls label,
      .planner-controls label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--text2);
        font-size: 0.84em;
      }
      input,
      select {
        background: #101b35;
        color: var(--text);
        border: 1px solid #4a607e;
        padding: 6px;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.82em;
      }
      .data-table th,
      .data-table td {
        padding: 6px;
        border-bottom: 1px solid #334;
        text-align: left;
        vertical-align: top;
      }
      .data-table th {
        color: var(--text2);
      }
      .table-wrap {
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #526b8f #101b35;
      }
      .table-wrap::-webkit-scrollbar,
      .resource-list::-webkit-scrollbar,
      .resource-inspector::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      .table-wrap::-webkit-scrollbar-track,
      .resource-list::-webkit-scrollbar-track,
      .resource-inspector::-webkit-scrollbar-track {
        background: #101b35;
      }
      .table-wrap::-webkit-scrollbar-thumb,
      .resource-list::-webkit-scrollbar-thumb,
      .resource-inspector::-webkit-scrollbar-thumb {
        background: #526b8f;
        border: 2px solid #101b35;
        border-radius: 8px;
      }
      .table-wrap::-webkit-scrollbar-thumb:hover,
      .resource-list::-webkit-scrollbar-thumb:hover,
      .resource-inspector::-webkit-scrollbar-thumb:hover {
        background: #6f8db8;
      }
      .mobile-cards {
        display: none;
        gap: 8px;
      }
      .mobile-card {
        background: #132745;
        border: 1px solid #334;
        border-radius: 5px;
        padding: 9px;
        overflow-wrap: anywhere;
      }
      .mobile-card b {
        display: block;
        color: var(--cyan);
        margin-bottom: 4px;
      }
      .progress {
        height: 9px;
        min-width: 70px;
        background: #333;
        border-radius: 5px;
        overflow: hidden;
        margin: 5px 0;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--green);
      }
      .info-panel {
        border-left: 3px solid var(--cyan);
        padding: 9px 12px;
        background: #132745;
      }
      .outpost-row {
        border: 1px solid #40536e;
        border-radius: 6px;
        margin: 8px 0;
        background: #132745;
      }
      .outpost-row summary {
        cursor: pointer;
        padding: 10px;
        list-style: none;
      }
      .outpost-row summary::-webkit-details-marker {
        display: none;
      }
      .outpost-workspace { display: grid; grid-template-columns: minmax(240px, .72fr) minmax(0, 1.8fr); gap: 12px; align-items: start; }
      .outpost-list, .outpost-detail { min-width: 0; max-height: 680px; overflow: auto; padding: 10px; background: #101b35; border: 1px solid #40536e; border-radius: 8px; scrollbar-width: thin; scrollbar-color: #526b8f #101b35; }
      .outpost-selectable { display: block; width: 100%; text-align: left; color: var(--text); cursor: pointer; }
      .outpost-selectable:hover, .outpost-selectable.selected { border-color: var(--accent); background: #ffffff12; }
      .outpost-selectable.selected { box-shadow: inset 3px 0 var(--accent); }
      .outpost-selectable .small { color: var(--text2); }
      .royal-map-scroll {
        min-width: 0;
        overflow: hidden;
        padding-top: 20px;
        background: #0b1428;
        border: 1px solid #40536e;
        border-radius: 6px;
      }
      .royal-map-shell {
        display: grid;
        grid-template-columns: 48px 960px 210px;
        gap: 10px;
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
        align-items: start;
      }
      .royal-world-rail {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .royal-world-rail button {
        width: 48px;
        min-height: 32px;
        padding: 5px 2px;
      }
      .royal-map {
        position: relative;
        width: 960px;
        min-width: 960px;
        max-width: 960px;
        aspect-ratio: 811 / 433;
        overflow: visible;
        background: #0b1428 center / cover no-repeat;
      }
      .royal-map-counters {
        height: 533px;
        min-width: 0;
        overflow: hidden;
        padding: 8px;
        background: #101b35;
        border: 1px solid #40536e;
        border-radius: 6px;
      }
      .royal-map-counters h3 { margin: 0 0 7px; color: var(--cyan); font-size: .9em; }
      .royal-counter-grid { display: grid; gap: 5px; }
      .royal-counter { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 5px; align-items: center; min-width: 0; font-size: .76em; }
      .royal-counter img, .royal-currency-chip img { width: 20px; height: 20px; object-fit: contain; }
      .royal-counter-label { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .royal-counter-value { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
      .royal-currency-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .royal-currency-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px; background: #132745; border: 1px solid #40536e; border-radius: 4px; color: var(--text); font-size: .72em; }
      .royal-partial { display: block; color: var(--gold); font-size: .82em; white-space: normal; overflow-wrap: anywhere; }
      .royal-map-layer { position: absolute; inset: 0; }
      .royal-map-upgrade-layer { z-index: 20; pointer-events: none; }
      .royal-map-upgrade-anchor { position: absolute; width: 6.905%; aspect-ratio: 56 / 20; transform: translate(-48.2%, -40%); pointer-events: none; }
      .royal-map-line {
        position: absolute;
        height: 1.386%;
        transform-origin: left center;
        pointer-events: none;
        opacity: .85;
      }
      .royal-map-node,
      .royal-map-outpost {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: pointer;
      }
      .royal-map-node {
        width: 6.905%;
        aspect-ratio: 1;
        transform: none;
        padding: 0;
        background: transparent;
        border: 0;
      }
      .royal-map-node img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .royal-map-node img:last-child {
        inset: 21.429% auto auto 25%;
        width: 50%;
        height: 50%;
      }
      .royal-map-resource-status {
        position: absolute;
        left: 50%;
        bottom: calc(100% - 8px);
        z-index: 3;
        min-width: max-content;
        padding: 2px 4px;
        transform: translateX(-50%);
        border: 1px solid #52657d;
        border-radius: 2px;
        background: rgba(7, 16, 31, .94);
        color: #fff;
        box-shadow: 0 1px 3px rgba(3, 8, 18, .95);
        font-family: Verdana, Geneva, sans-serif;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0;
        white-space: nowrap;
        pointer-events: none;
      }
      .royal-map-resource-status.empty { color: #a6afbd; }
      .royal-map-resource-status.ready { border-color: var(--green); color: #8cf397; }
      .royal-map-resource-status.empty,
      .royal-map-resource-status.ready {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        min-width: 18px;
        height: 18px;
        padding: 0;
        border-radius: 50%;
        font-size: 12px;
      }
      .royal-map-resource-grade { position: absolute; left: 50%; bottom: calc(100% - 2px); z-index: 3; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 2px solid #58e36b; border-radius: 50%; background: #07101f; color: #fff; box-shadow: 0 1px 4px rgba(3, 8, 18, .98); transform: translateX(-50%); font-family: Verdana, Geneva, sans-serif; font-size: 10px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; text-shadow: 0 1px 1px #000; pointer-events: none; }
      .royal-map-resource-grade > span { display: block; transform: translateY(-.5px); }
      .royal-map-outpost {
        width: 2.836%;
        aspect-ratio: 23 / 18;
        padding: 0;
        background: transparent;
        border: 0;
        overflow: visible;
      }
      .royal-map-outpost.built {
        width: 6.905%;
        aspect-ratio: 56 / 20;
        transform: translate(-48.2%, -40%);
      }
      .royal-map-outpost.locked { opacity: .45; filter: grayscale(1); }
      .royal-map-outpost::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 117.4%;
        aspect-ratio: 27 / 24;
        transform: translate(-50%, -50%);
        background: url('./assets/royal-guardian/UImapsel.png') center / contain no-repeat;
        opacity: 0;
        pointer-events: none;
      }
      .royal-map-outpost:hover::after,
      .royal-map-outpost:focus-visible::after,
      .royal-map-outpost.selected::after { opacity: 1; }
      .royal-map-outpost.built::after {
        left: 49.1%;
        top: 45%;
        width: 48.2%;
      }
      .royal-map-outpost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .royal-map-glyph { position: absolute; overflow: hidden; pointer-events: none; }
      .royal-map-glyph img {
        position: absolute;
        left: calc(-1 * var(--gx) / var(--gw) * 100%);
        top: calc(-1 * var(--gy) / var(--gh) * 100%);
        width: calc(var(--aw) / var(--gw) * 100%);
        height: calc(var(--ah) / var(--gh) * 100%);
        max-width: none;
      }
      .royal-map-outpost:not(.built) .royal-map-node-glyph { inset: 0; }
      .royal-map-outpost.built .royal-map-node-glyph { left: 28.571%; top: 0; width: 41.071%; height: 90%; }
      .royal-map-outpost-glyph { left: 0; top: 10%; width: 100%; height: 85%; }
      .royal-map-glory-glyph { left: 35.714%; top: 55%; width: 28.571%; height: 25%; z-index: 4; filter: drop-shadow(0 1px 2px rgba(3, 8, 18, .95)); }
      .royal-map-assignments { position: absolute; left: 50%; top: calc(50% + 11.2px); display: flex; align-items: flex-end; justify-content: center; gap: 0; transform: translate(-50%, -100%); z-index: 1; pointer-events: none; }
      .royal-map-assignments .royal-map-glyph { filter: drop-shadow(0 1px 1px rgba(3, 8, 18, .95)) drop-shadow(0 0 3px rgba(3, 8, 18, .85)); }
      .royal-map-ranks { position: absolute; left: 50%; bottom: calc(100% - 2px); display: flex; gap: 2px; transform: translateX(-50%); z-index: 5; pointer-events: none; }
      .royal-map-rank { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; box-sizing: border-box; border: 2px solid var(--rank-color); border-radius: 50%; background: #07101f; color: #fff; box-shadow: 0 1px 4px rgba(3, 8, 18, .98); font-family: Verdana, Geneva, sans-serif; font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; text-align: center; text-shadow: 0 1px 1px #000; }
      .royal-map-rank > span { display: block; transform: translateY(-.5px); }
      .royal-map-rank.wide { font-size: 8px; }
      .royal-map-rank.bar-0 { --rank-color: rgb(74, 229, 74); }
      .royal-map-rank.bar-1 { --rank-color: rgb(68, 138, 166); }
      .royal-map-rank.bar-2 { --rank-color: rgb(249, 130, 114); }
      .royal-map-rank.bar-3 { --rank-color: rgb(255, 214, 97); }
      .royal-map-rank.bar-4 { --rank-color: rgb(236, 214, 133); }
      .royal-map-upgrades { position: absolute; left: 48.2%; bottom: calc(100% - 2px); display: flex; flex-direction: column; align-items: center; gap: 3px; transform: translateX(-50%); pointer-events: none; }
      .royal-map-upgrade-points { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 24px; padding: 2px 5px; border: 1px solid #7d8796; border-radius: 3px; background: rgba(7, 16, 31, .94); color: #58e36b; box-shadow: 0 1px 4px rgba(3, 8, 18, .98); font-family: Verdana, Geneva, sans-serif; font-size: 10px; font-weight: 700; line-height: 1; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
      .royal-map-point-diamond { width: 6px; height: 6px; background: #58e36b; border: 1px solid #d8ffe0; box-shadow: 0 1px 3px #000; transform: rotate(45deg); }
      .royal-map-upgrade-levels { display: flex; gap: 2px; }
      .royal-map-upgrade { --rank-color: #9ca3af; width: 17px; height: 17px; border-width: 1px; background: #18202d; font-size: 9px; }
      .royal-map-node-glyph { z-index: 2; }
      .royal-map-outpost-glyph { z-index: 3; }
      .royal-worker-icon { position: relative; width: 28.8px; height: 43.2px; flex: 0 0 auto; }
      .royal-worker-icon .worker-profession { left: 3.2px; top: 0; width: 20.8px; height: 28.8px; }
      .royal-worker-icon .worker-shadow { left: 3.2px; top: 27.2px; width: 22.4px; height: 8px; }
      .royal-worker-icon .transient-profession { left: 4.8px; top: 3.2px; width: 19.2px; height: 20.8px; }
      .assignment-count { position: absolute; right: -3.2px; top: -4.8px; min-width: 19.2px; padding: 0 4.8px; border-radius: 9.6px; background: #111827; color: var(--gold); font-size: 12.8px; line-height: 17.6px; text-align: center; }
      .royal-map-shell.map-size-small { grid-template-columns: 48px 600px 210px; max-width: 900px; }
      .map-size-small .royal-map { width: 600px; min-width: 600px; max-width: 600px; }
      .map-size-small .royal-map-counters { height: 340px; }
      .map-size-small .royal-map-assignments { top: calc(50% + 7px); }
      .map-size-small .royal-map-ranks { bottom: calc(100% - 1px); gap: 1px; }
      .map-size-small .royal-map-upgrades { bottom: calc(100% - 1px); gap: 2px; }
      .map-size-small .royal-map-upgrade-points { gap: 3px; min-width: 19px; padding: 2px 4px; font-size: 8px; }
      .map-size-small .royal-map-point-diamond { width: 4px; height: 4px; }
      .map-size-small .royal-map-upgrade-levels { gap: 1px; }
      .map-size-small .royal-map-rank { width: 15px; height: 15px; border-width: 1px; font-size: 8px; }
      .map-size-small .royal-map-rank.wide { font-size: 6px; }
      .map-size-small .royal-map-upgrade { width: 12px; height: 12px; font-size: 7px; }
      .map-size-small .royal-map-resource-grade { width: 15px; height: 15px; border-width: 1px; font-size: 8px; }
      .map-size-small .royal-map-resource-status { padding: 1px 3px; font-size: 7px; }
      .map-size-small .royal-worker-icon { width: 18px; height: 27px; }
      .map-size-small .royal-worker-icon .worker-profession { left: 2px; width: 13px; height: 18px; }
      .map-size-small .royal-worker-icon .worker-shadow { left: 2px; top: 17px; width: 14px; height: 5px; }
      .map-size-small .royal-worker-icon .transient-profession { left: 3px; top: 2px; width: 12px; height: 13px; }
      .map-size-small .assignment-count { right: -2px; top: -3px; min-width: 12px; padding: 0 3px; border-radius: 6px; font-size: 8px; line-height: 11px; }
      .currency-inline { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; margin-right: 4px; }
      .royal-resource-icon { position: relative; display: inline-block; width: 28px; height: 28px; flex: 0 0 28px; vertical-align: middle; }
      .royal-resource-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .royal-resource-icon img:last-child { inset: 21.429% auto auto 25%; width: 50%; height: 50%; }
      .resource-label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .outpost-unit-list, .outpost-connection-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .outpost-unit-detail, .outpost-connection-detail { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 3px 7px; border: 1px solid #40536e; border-radius: 4px; background: #101b35; color: var(--text2); font-size: .82em; }
      .outpost-unit-detail .royal-worker-icon { width: 24px; height: 34px; }
      .outpost-unit-detail .worker-profession { left: 3px; width: 18px; height: 24px; }
      .outpost-unit-detail .worker-shadow { left: 3px; top: 23px; width: 19px; height: 6px; }
      .outpost-upgrade-card { background: #101b35; border-color: #40536e; }
      .outpost-upgrade-card.locked { opacity: .68; }
      .outpost-upgrade-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .outpost-upgrade-head b { color: var(--cyan); }
      .outpost-upgrade-meta { display: flex; gap: 6px; flex-wrap: wrap; }
      .outpost-upgrade-effect { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.08); color: var(--text2); font-size: .82em; }
      .outpost-upgrade-effect strong { color: var(--gold); text-align: right; }
      .outpost-point-planner { margin: 12px 0 16px; padding: 10px; background: #101b35; border: 1px solid #40536e; border-radius: 6px; }
      .outpost-point-planner h3 { margin: 0 0 8px; }
      .outpost-point-planner-controls { display: flex; align-items: end; gap: 8px; flex-wrap: wrap; }

          document.querySelector("#royal-map-host")?.scrollIntoView({ behavior: "smooth", block: "start" });
        }));
        document.querySelectorAll("[data-shelf-nav]").forEach(button => button.addEventListener("click", () => {
          const indices = shelfLayoutStepIndices(), position = indices.indexOf(session.shelfStepIndex), target = indices[position + n(button.dataset.shelfNav)];
          if (target === undefined || !selectShelfLayoutStep(target)) return;
          render();
        }));
        document.querySelector("[data-go-shelf-step]")?.addEventListener("click", () => {
          const targetId = `#shelf-layout-step-${session.shelfStepIndex}`;
          session.tab = "optimizer";
          render();
          requestAnimationFrame(() => {
            const target = document.querySelector(targetId);
            target?.scrollIntoView({ behavior: "smooth", block: "start" });
            target?.focus({ preventScroll: true });
          });
        });
        document.querySelectorAll("[data-map-state]").forEach(button => button.addEventListener("click", () => { session.royalStateView = button.dataset.mapState; if (session.royalStateView === "shelf-step" ? !selectedShelfLayoutStep() : session.royalStateView !== "current" && !validOptimizedRecommendation()) session.royalStateView = "current"; clearOutpostPointPlan(); render(); }));
        document.querySelectorAll("[data-layout-result-view]").forEach(button => button.addEventListener("click", () => { session.layoutResultView = button.dataset.layoutResultView; if (session.layoutResultView === "post-reset" && !session.layoutResult?.postReset?.recommendation) session.layoutResultView = "now"; render(); }));
        document.querySelectorAll("[data-world]").forEach(
          (x) =>
            (x.onclick = () => {
              session.worldIdx = n(x.dataset.world);
              clearOutpostPointPlan();
              if (!R.worldOutpostRows(activeRoyalState(), session.worldIdx).some(y => y.mapIdx === session.selectedOutpost)) session.selectedOutpost = null;
              if (session.selectedResource !== null && R.resourceWorld(session.selectedResource) !== session.worldIdx) session.selectedResource = null;
              if ((session.mapSelectionKind === "outpost" && session.selectedOutpost === null) || (session.mapSelectionKind === "resource" && session.selectedResource === null)) session.mapSelectionKind = null;
              session.tab = "outposts";
              render();
            }),
        );
        document
          .querySelector("#outpost-filter")
          ?.addEventListener("change", (e) => {
            session.outpostFilter = e.target.value;
            render();
          });
        document.querySelectorAll("[data-outpost-select]").forEach(x => {
          const select = () => { session.selectedOutpost = n(x.dataset.outpostSelect); clearOutpostPointPlan(); session.mapSelectionKind = "outpost"; session.tab = "outposts"; render(); };
          x.onclick = select;
          x.onkeydown = e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); return; }
            if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
            e.preventDefault();
            const owner = x.closest(".outpost-list"), options = [...owner.querySelectorAll("[data-outpost-select]")], index = options.indexOf(x);
            const next = currencyNavigationIndex(e.key, index, options.length);
            if (next < 0) return;
            const target = n(options[next].dataset.outpostSelect);
            session.selectedOutpost = target;
            clearOutpostPointPlan();
            session.mapSelectionKind = "outpost";
            session.tab = "outposts";
            render();
            document.querySelector(`.outpost-list [data-outpost-select="${target}"]`)?.focus();
          };
        });
        for (const [id, key] of [["resource-state", "resourceState"], ["resource-currency", "resourceCurrency"], ["resource-sort", "resourceSort"]])
          document.querySelector(`#${id}`)?.addEventListener("change", e => { session[key] = e.target.value; render(); });
        document.querySelector("#resource-search")?.addEventListener("input", e => { session.resourceSearch = e.target.value; render(); });
        document.querySelectorAll("[data-resource]").forEach(x => {
          const select = () => { session.selectedResource = n(x.dataset.resource); session.mapSelectionKind = "resource"; render(); };
          x.onclick = select;
          x.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } };
        });
        document.querySelectorAll("[data-map-resource]").forEach(x => x.onclick = () => {
          session.selectedResource = n(x.dataset.mapResource);
          session.mapSelectionKind = "resource";
          session.resourceState = "all";
          session.resourceCurrency = "all";
          session.resourceSearch = "";
          session.tab = "resources";
          render();
        });
        document.querySelectorAll("[data-map-outpost]").forEach(x => {
          const select = () => { session.selectedOutpost = n(x.dataset.mapOutpost); clearOutpostPointPlan(); session.mapSelectionKind = "outpost"; session.outpostFilter = "all"; session.tab = "outposts"; render(); };
          x.onclick = select;
          x.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } };
        });
        document.querySelectorAll("[data-map-overlay]").forEach(button => button.addEventListener("click", () => {
          session.mapOverlayMode = button.dataset.mapOverlay;
          render();
        }));
        document.querySelectorAll("[data-banked-mode]").forEach(button => button.addEventListener("click", () => {
          session.bankedProjectionMode = button.dataset.bankedMode;
          render();
        }));
        document.querySelector("#banked-hours-after-reset")?.addEventListener("change", event => {
          session.bankedHoursAfterReset = Math.max(0, n(event.target.value));
          render();
        });
        document.querySelectorAll("[data-assignment-layer]").forEach(button => button.addEventListener("click", () => {
          const layer = button.dataset.assignmentLayer;
          session.assignmentLayers[layer] = !session.assignmentLayers[layer];
          render();
        }));
        document.querySelector("[data-toggle-range-finder]")?.addEventListener("click", () => {
          session.rangeFinderMode = !session.rangeFinderMode;
          royalQuickTooltip.classList.remove("open");
          render();
        });
        document.querySelector("[data-toggle-map-size]")?.addEventListener("click", () => {
          session.largeMap = !session.largeMap;
          render();
        });
        document.querySelectorAll("[data-toggle-spoilers]").forEach(toggle => toggle.addEventListener("click", () => {
          session.spoilersVisible = !session.spoilersVisible;
          if (!session.spoilersVisible && !R.royalWorldUnlocked(activeRoyalState(), session.worldIdx)) session.worldIdx = visibleWorlds(activeRoyalState())[0] ?? 0;
          render();
        }));
        document.querySelector("#currency-selector")?.addEventListener("change", e => {
          session.currencyTarget = n(e.target.value);
          const first = currencyDetails(activeRoyalState(), session.currencyTarget).nodes?.[0];
          if (first) { session.selectedResource = first.resourceIdx; session.mapSelectionKind = "resource"; session.worldIdx = R.resourceWorld(first.resourceIdx); }
          render();
        });
        document.querySelector("#breakdown-outpost")?.addEventListener("change", e => {
          session.breakdownOutpost = n(e.target.value);
          render();
        });
        document.querySelector("#analyze-outpost-points")?.addEventListener("click", () => {
          const S = activeRoyalState();
          const mapIdx = session.selectedOutpost;
          if (mapIdx === null) return;
          clearOutpostPointPlan();
          const requestId = session.outpostPointRequestId;
          session.outpostPointRunning = true;
          session.outpostPointError = "";
          session.outpostPointPlanKey = `${mapIdx}`;
          render();
          const worker = new Worker("./js/workers/royal-planner-worker.js", { type: "module" });
          session.outpostPointWorker = worker;
          worker.onmessage = (event) => {
            if (event.data?.requestId !== session.outpostPointRequestId) return;
            if (event.data.type === "progress") {
              session.outpostPointProgress = event.data.progress;
              render();
              return;
            }
            if (event.data.type === "done") session.outpostPointPlan = structuredClone(event.data.result);
            else session.outpostPointError = event.data.error || "Point analysis failed.";
            session.outpostPointRunning = false;
            session.outpostPointProgress = null;
            session.outpostPointWorker = null;
            worker.terminate();
            render();
          };
          worker.onerror = (event) => {
            if (requestId !== session.outpostPointRequestId) return;
            session.outpostPointRunning = false;
            session.outpostPointProgress = null;
            session.outpostPointWorker = null;
            session.outpostPointError = event.message || "Point planner worker failed.";
            worker.terminate();
            render();
          };
          worker.postMessage({ type: "run", operation: "outpost-points", requestId, saveData: S, mapIdx, options: {} });
        });
        document.querySelector("#cancel-outpost-points")?.addEventListener("click", () => { clearOutpostPointPlan(); render(); });
        document.querySelectorAll("[data-currency-resource]").forEach(x => {
          const select = (focusOwner = false) => {
            session.selectedResource = n(x.dataset.currencyResource);
            session.mapSelectionKind = "resource";
            session.worldIdx = R.resourceWorld(session.selectedResource);
            const owner = x.closest(".currency-list, .currency-mobile-list"), ownerClass = owner?.classList.contains("currency-list") ? "currency-list" : "currency-mobile-list";
            render();
            if (focusOwner) document.querySelector(`.${ownerClass} [data-currency-resource="${session.selectedResource}"]`)?.focus();
          };
          x.onclick = () => select();
          x.onkeydown = e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); return; }
            if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
            e.preventDefault();
            const owner = x.closest(".currency-list, .currency-mobile-list"), options = [...owner.querySelectorAll("[data-currency-resource]")], index = options.indexOf(x);
            if (!options.length) return;
            const next = currencyNavigationIndex(e.key, index, options.length);
            const ownerClass = owner.classList.contains("currency-list") ? "currency-list" : "currency-mobile-list";
            const target = n(options[next].dataset.currencyResource);
            session.selectedResource = target;
            session.mapSelectionKind = "resource";
            session.worldIdx = R.resourceWorld(target);
            render();
            document.querySelector(`.${ownerClass} [data-currency-resource="${n(target)}"]`)?.focus();
          };
        });
        document
          .querySelector("#flair-category")
          ?.addEventListener("change", (e) => {
            session.flairCategory = e.target.value;
            render();
          });
        document
          .querySelector("#flair-maxed")
          ?.addEventListener("change", (e) => {
            session.flairShowMaxed = e.target.checked;
            render();
          });
        wireRoyalTooltips();
        wireRoyalRangeFinder();
      }
      initSaveLoader({
        target: "#save-area",
        onLoad: (S) => {
          const firstLoad = session.saveRevision === 0;
          preserveOptimizerResultsOnSaveRefresh();
          if (firstLoad && session.mapSelectionKind === null && session.selectedOutpost === null) {
            const initialOutpost = R.worldOutpostRows(S, session.worldIdx).find(
              (row) => row.built || row.state === "in-progress",
            );
            session.selectedOutpost = initialOutpost?.mapIdx ?? null;
          }
          render();
        },
        auth: true,
      });
      render();
    </script>
  </body>
</html>
