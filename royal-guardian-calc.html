<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Idleon Royal Guardian Calculator</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --bg2: #16213e;
        --bg3: #0f3460;
        --accent: #e94560;
        --text: #eee;
        --text2: #c0c0d4;
        --gold: #ffd700;
        --green: #4caf50;
        --blue: #2196f3;
        --cyan: #4dd0e1;
        --red: #f44;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      h1 {
        text-align: center;
        margin: 0;
        padding: 12px;
        background: var(--bg2);
        border-bottom: 2px solid var(--accent);
      }
      h1 a {
        float: left;
        color: var(--text2);
        font-size: 0.7em;
      }
      h1 span {
        color: var(--accent);
      }
      .main {
        max-width: 1400px;
        margin: auto;
        padding: 16px;
      }
      .tabs,
      .subtabs {
        display: flex;
        flex-wrap: wrap;
        background: var(--bg2);
        border-bottom: 1px solid #334;
      }
      .tab-btn,
      .subtabs button,
      button,
      select,
      input {
        font: inherit;
      }
      .tab-btn,
      .subtabs button {
        padding: 10px 18px;
        background: transparent;
        color: var(--text2);
        border: 0;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .tab-btn:hover,
      .subtabs button:hover {
        background: #ffffff0d;
        color: var(--text);
      }
      .tab-btn[aria-selected="true"],
      .subtabs button[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: bold;
      }
      .section,
      .opt-section {
        background: var(--bg2);
        border-radius: 8px;
        padding: 16px;
        margin: 12px 0;
      }
      .section h2,
      .opt-section h2 {
        color: var(--accent);
        font-size: 1.15em;
        border-bottom: 1px solid #333;
        padding-bottom: 7px;
        margin: 0 0 12px;
      }
      .section h3,
      .opt-section h3 {
        color: var(--cyan);
        font-size: 1em;
        margin: 12px 0 7px;
      }
      .card-grid {
        display: grid;
        gap: 10px;
      }
      .cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .cols-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .card {
        border: 1px solid #445;
        border-radius: 6px;
        padding: 10px;
        min-width: 0;
      }
      .card-title {
        color: var(--cyan);
        font-size: 0.82em;
      }
      .card-val {
        color: var(--gold);
        font-size: 1.35em;
        font-weight: bold;
      }
      .card-sub,
      .note,
      .small {
        color: var(--text2);
        font-size: 0.82em;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.74em;
        font-weight: bold;
      }
      .badge-green {
        background: #4caf5033;
        color: var(--green);
      }
      .badge-gold {
        background: #ffd70022;
        color: var(--gold);
      }
      .badge-blue {
        background: #2196f333;
        color: var(--blue);
      }
      .badge-red {
        background: #ff444422;
        color: var(--red);
      }
      .badge-cyan {
        background: #4dd0e133;
        color: var(--cyan);
      }
      button {
        padding: 7px 12px;
        color: var(--text);
        background: var(--bg3);
        border: 1px solid #4a607e;
        border-radius: 4px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .controls,
      .planner-controls {
        display: flex;
        gap: 10px;
        align-items: end;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .controls label,
      .planner-controls label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--text2);
        font-size: 0.84em;
      }
      input,
      select {
        background: #101b35;
        color: var(--text);
        border: 1px solid #4a607e;
        padding: 6px;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.82em;
      }
      .data-table th,
      .data-table td {
        padding: 6px;
        border-bottom: 1px solid #334;
        text-align: left;
        vertical-align: top;
      }
      .data-table th {
        color: var(--text2);
      }
      .table-wrap {
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #526b8f #101b35;
      }
      .table-wrap::-webkit-scrollbar,
      .resource-list::-webkit-scrollbar,
      .resource-inspector::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      .table-wrap::-webkit-scrollbar-track,
      .resource-list::-webkit-scrollbar-track,
      .resource-inspector::-webkit-scrollbar-track {
        background: #101b35;
      }
      .table-wrap::-webkit-scrollbar-thumb,
      .resource-list::-webkit-scrollbar-thumb,
      .resource-inspector::-webkit-scrollbar-thumb {
        background: #526b8f;
        border: 2px solid #101b35;
        border-radius: 8px;
      }
      .table-wrap::-webkit-scrollbar-thumb:hover,
      .resource-list::-webkit-scrollbar-thumb:hover,
      .resource-inspector::-webkit-scrollbar-thumb:hover {
        background: #6f8db8;
      }
      .mobile-cards {
        display: none;
        gap: 8px;
      }
      .mobile-card {
        background: #132745;
        border: 1px solid #334;
        border-radius: 5px;
        padding: 9px;
        overflow-wrap: anywhere;
      }
      .mobile-card b {
        display: block;
        color: var(--cyan);
        margin-bottom: 4px;
      }
      .progress {
        height: 9px;
        min-width: 70px;
        background: #333;
        border-radius: 5px;
        overflow: hidden;
        margin: 5px 0;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--green);
      }
      .info-panel {
        border-left: 3px solid var(--cyan);
        padding: 9px 12px;
        background: #132745;
      }
      .outpost-row {
        border: 1px solid #40536e;
        border-radius: 6px;
        margin: 8px 0;
        background: #132745;
      }
      .outpost-row summary {
        cursor: pointer;
        padding: 10px;
        list-style: none;
      }
      .outpost-row summary::-webkit-details-marker {
        display: none;
      }
      .outpost-workspace { display: grid; grid-template-columns: minmax(240px, .72fr) minmax(0, 1.8fr); gap: 12px; align-items: start; }
      .outpost-list, .outpost-detail { min-width: 0; max-height: 680px; overflow: auto; padding: 10px; background: #101b35; border: 1px solid #40536e; border-radius: 8px; scrollbar-width: thin; scrollbar-color: #526b8f #101b35; }
      .outpost-selectable { display: block; width: 100%; text-align: left; color: var(--text); cursor: pointer; }
      .outpost-selectable:hover, .outpost-selectable.selected { border-color: var(--accent); background: #ffffff12; }
      .outpost-selectable.selected { box-shadow: inset 3px 0 var(--accent); }
      .outpost-selectable .small { color: var(--text2); }
      .royal-map-scroll {
        min-width: 0;
        overflow: hidden;
        background: #0b1428;
        border: 1px solid #40536e;
        border-radius: 6px;
      }
      .royal-map-shell {
        display: grid;
        grid-template-columns: 48px 600px 210px;
        gap: 10px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        align-items: start;
      }
      .royal-world-rail {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .royal-world-rail button {
        width: 48px;
        min-height: 32px;
        padding: 5px 2px;
      }
      .royal-map {
        position: relative;
        width: 600px;
        min-width: 600px;
        max-width: 600px;
        aspect-ratio: 811 / 433;
        overflow: hidden;
        background: #0b1428 center / cover no-repeat;
      }
      .royal-map-counters {
        height: 320px;
        min-width: 0;
        overflow: hidden;
        padding: 8px;
        background: #101b35;
        border: 1px solid #40536e;
        border-radius: 6px;
      }
      .royal-map-counters h3 { margin: 0 0 7px; color: var(--cyan); font-size: .9em; }
      .royal-counter-grid { display: grid; gap: 5px; }
      .royal-counter { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 5px; align-items: center; min-width: 0; font-size: .76em; }
      .royal-counter img, .royal-currency-chip img { width: 20px; height: 20px; object-fit: contain; }
      .royal-counter-label { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .royal-counter-value { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
      .royal-currency-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .royal-currency-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px; background: #132745; border: 1px solid #40536e; border-radius: 4px; color: var(--text); font-size: .72em; }
      .royal-partial { display: block; color: var(--gold); font-size: .82em; white-space: normal; overflow-wrap: anywhere; }
      .royal-map-layer { position: absolute; inset: 0; }
      .royal-map-line {
        position: absolute;
        height: 1.386%;
        transform-origin: left center;
        pointer-events: none;
        opacity: .85;
      }
      .royal-map-node,
      .royal-map-outpost {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: pointer;
      }
      .royal-map-node {
        width: 6.905%;
        aspect-ratio: 1;
        transform: none;
        padding: 0;
        background: transparent;
        border: 0;
      }
      .royal-map-node img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .royal-map-node img:last-child {
        inset: 21.429% auto auto 25%;
        width: 50%;
        height: 50%;
      }
      .royal-map-outpost {
        width: 2.836%;
        aspect-ratio: 23 / 18;
        padding: 0;
        background: transparent;
        border: 0;
        overflow: visible;
      }
      .royal-map-outpost.built {
        width: 6.905%;
        aspect-ratio: 56 / 20;
        transform: translate(-48.2%, -40%);
      }
      .royal-map-outpost.locked { opacity: .45; filter: grayscale(1); }
      .royal-map-outpost::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 117.4%;
        aspect-ratio: 27 / 24;
        transform: translate(-50%, -50%);
        background: url('./assets/royal-guardian/UImapsel.png') center / contain no-repeat;
        opacity: 0;
        pointer-events: none;
      }
      .royal-map-outpost:hover::after,
      .royal-map-outpost:focus-visible::after,
      .royal-map-outpost.selected::after { opacity: 1; }
      .royal-map-outpost.built::after {
        left: 49.1%;
        top: 45%;
        width: 48.2%;
      }
      .royal-map-outpost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .royal-map-glyph { position: absolute; overflow: hidden; pointer-events: none; }
      .royal-map-glyph img {
        position: absolute;
        left: calc(-1 * var(--gx) / var(--gw) * 100%);
        top: calc(-1 * var(--gy) / var(--gh) * 100%);
        width: calc(var(--aw) / var(--gw) * 100%);
        height: calc(var(--ah) / var(--gh) * 100%);
        max-width: none;
      }
      .royal-map-outpost:not(.built) .royal-map-node-glyph { inset: 0; }
      .royal-map-outpost.built .royal-map-node-glyph { left: 28.571%; top: 0; width: 41.071%; height: 90%; }
      .royal-map-outpost-glyph { left: 0; top: 10%; width: 100%; height: 85%; }
      .royal-map-assignments { position: absolute; left: 50%; top: calc(50% + 7px); display: flex; align-items: flex-end; justify-content: center; gap: 0; transform: translate(-50%, -100%); z-index: 1; pointer-events: none; }
      .royal-map-assignments .royal-map-glyph { filter: drop-shadow(0 1px 1px rgba(3, 8, 18, .95)) drop-shadow(0 0 3px rgba(3, 8, 18, .85)); }
      .royal-map-node-glyph { z-index: 2; }
      .royal-map-outpost-glyph { z-index: 3; }
      .royal-worker-icon { position: relative; width: 18px; height: 27px; flex: 0 0 auto; }
      .royal-worker-icon .worker-profession { left: 2px; top: 0; width: 13px; height: 18px; }
      .royal-worker-icon .worker-shadow { left: 2px; top: 17px; width: 14px; height: 5px; }
      .royal-worker-icon .militia-profession { left: 3px; top: 2px; width: 12px; height: 13px; }
      .assignment-count { position: absolute; right: -2px; top: -3px; min-width: 12px; padding: 0 3px; border-radius: 6px; background: #111827; color: var(--gold); font-size: 8px; line-height: 11px; text-align: center; }
      .currency-inline { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; margin-right: 4px; }
      .royal-resource-icon { position: relative; display: inline-block; width: 28px; height: 28px; flex: 0 0 28px; vertical-align: middle; }
      .royal-resource-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .royal-resource-icon img:last-child { inset: 21.429% auto auto 25%; width: 50%; height: 50%; }
      .resource-label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .outpost-unit-list, .outpost-connection-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .outpost-unit-detail, .outpost-connection-detail { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 3px 7px; border: 1px solid #40536e; border-radius: 4px; background: #101b35; color: var(--text2); font-size: .82em; }
      .outpost-unit-detail .royal-worker-icon { width: 24px; height: 34px; }
      .outpost-unit-detail .worker-profession { left: 3px; width: 18px; height: 24px; }
      .outpost-unit-detail .worker-shadow { left: 3px; top: 23px; width: 19px; height: 6px; }
      .currency-icon-picker { position: relative; display: inline-block; }
      .currency-icon-picker summary { display: flex; align-items: center; justify-content: center; min-width: 44px; height: 34px; padding: 3px 8px; border: 1px solid #40536e; border-radius: 4px; background: #101b35; color: var(--text2); cursor: pointer; list-style: none; }
      .currency-icon-picker summary::-webkit-details-marker { display: none; }
      .currency-icon-menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; display: grid; grid-template-columns: repeat(6, 30px); gap: 3px; padding: 6px; border: 1px solid #40536e; border-radius: 5px; background: #0c172b; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
      .currency-icon-picker button { width: 30px; height: 30px; padding: 3px; border: 1px solid #40536e; border-radius: 4px; background: #101b35; color: var(--text2); cursor: pointer; }
      .currency-icon-picker button.selected { border-color: var(--gold); background: #1d3150; box-shadow: 0 0 0 1px var(--gold); }
      .currency-icon-picker img { width: 22px; height: 22px; object-fit: contain; margin: 0; }
      .currency-icon-picker + select { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .royal-quick-tooltip { position: fixed; z-index: 1000; display: none; width: min(330px, calc(100vw - 20px)); max-height: min(460px, calc(100vh - 20px)); overflow: auto; padding: 10px; border: 1px solid #60799d; border-radius: 6px; background: #0c172b; color: var(--text); box-shadow: 0 10px 28px rgba(0,0,0,.5); pointer-events: none; font-size: .8em; }
      .royal-quick-tooltip.open { display: block; }
      .royal-quick-tooltip h3 { margin: 0 0 6px; color: var(--cyan); }
      .tooltip-grid { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
      .tooltip-grid b { color: var(--gold); text-align: right; }
      .tooltip-units { display: flex; gap: 5px; flex-wrap: wrap; margin: 7px 0; }
      .tooltip-unit { display: inline-flex; align-items: center; }
      .tooltip-unit .royal-worker-icon { width: 36px; height: 52px; }
      .tooltip-unit .worker-profession { left: 6px; width: 24px; height: 34px; }
      .tooltip-unit .worker-shadow { left: 6px; top: 33px; width: 25px; height: 8px; }
      .royal-map-key { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; color: var(--text2); font-size: .8em; }
      .royal-map-key i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; }
      .royal-map-assignment-toggle { padding: 3px 8px; border-radius: 999px; font-size: .9em; line-height: 1.1; }
      .royal-map-assignment-toggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
      .royal-map-assignment-toggle:disabled { opacity: .5; cursor: not-allowed; }
      .royal-map-range-toggle { padding: 3px 8px; border-radius: 999px; font-size: .9em; line-height: 1.1; }
      .royal-map-range-toggle[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 0 1px rgba(77, 208, 225, .25); }
      .royal-range-circle { position: absolute; z-index: 0; display: none; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(77, 208, 225, .9); border-radius: 50%; background: rgba(77, 208, 225, .1); box-shadow: 0 0 12px rgba(77, 208, 225, .3); pointer-events: none; }
      .royal-map.range-finder-active .royal-map-node,
      .royal-map.range-finder-active .royal-map-outpost { transition: opacity .12s, filter .12s; }
      .royal-map.range-finder-active .range-dimmed { opacity: .22; filter: grayscale(.75); }
      .royal-map.range-finder-active .range-active { z-index: 5; filter: drop-shadow(0 0 4px var(--cyan)); }
      .royal-map.range-finder-active .range-match { z-index: 4; opacity: 1; filter: drop-shadow(0 0 5px var(--gold)); }
      .royal-range-status { min-width: 150px; color: var(--cyan); }
      .royal-map-node.selected { z-index: 2; filter: drop-shadow(0 0 3px var(--gold)); outline: 2px solid var(--gold); outline-offset: 2px; }
      .row-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .row-head strong {
        color: var(--cyan);
      }
      .row-body {
        padding: 0 10px 12px;
      }
      .metric-line {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--text2);
        font-size: 0.82em;
      }
      .metric-line b {
        color: var(--gold);
      }
      .range-target { margin: 10px 0; padding: 9px; border: 1px solid #40536e; border-radius: 6px; background: rgba(10, 24, 44, .72); }
      .range-target h3 { margin-top: 0; }
      .range-target-main { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
      .range-target-main .currency-inline { margin: 0; }
      .rank-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(100px, 1fr));
        gap: 7px;
      }
      .rank {
        background: #101b35;
        padding: 7px;
        border-radius: 4px;
      }
      .rank.locked {
        opacity: 0.5;
      }
      .rank small {
        display: block;
        color: var(--text2);
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .move {
        padding: 7px;
        border-bottom: 1px solid #334;
      }
      .world-card {
        cursor: pointer;
      }
      .world-card.locked {
        opacity: 0.6;
      }
      .empty-state {
        text-align: center;
        color: var(--text2);
        padding: 25px;
        border: 1px dashed #4a607e;
        border-radius: 6px;
      }
      .resource-workspace {
        display: grid;
        grid-template-columns: minmax(520px, 1.2fr) minmax(320px, 0.8fr);
        gap: 12px;
        align-items: start;
      }
      .resource-list,
      .resource-inspector {
        min-width: 0;
        max-height: 680px;
        overflow: auto;
        padding: 10px;
        background: #101b35;
        border: 1px solid #40536e;
        border-radius: 8px;
        scrollbar-width: thin;
        scrollbar-color: #526b8f #101b35;
      }
      .resource-list table { table-layout: fixed; }
      .resource-list th:nth-child(1) { width: 22%; }
      .resource-list th:nth-child(2) { width: 10%; }
      .resource-list th:nth-child(3) { width: 30%; }
      .resource-list th:nth-child(4) { width: 18%; }
      .resource-list th:nth-child(5) { width: 20%; }
      .resource-selectable { cursor: pointer; }
      .resource-selectable:hover td,
      .resource-selectable.selected td { background: #ffffff12; }
      .resource-selectable.selected td:first-child { box-shadow: inset 3px 0 var(--accent); }
      .resource-cell { display: grid; gap: 4px; }
      .resource-cell .progress { width: 100%; }
      .inspector-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
      .inspector-head h3 { margin-top: 0; }
      .resource-inspector .data-table { margin-top: 8px; }
      .resource-mobile-list { display: none; gap: 8px; }
      .resource-mobile-card { cursor: pointer; }
      .resource-mobile-card.selected { border-color: var(--accent); }
      .resource-mobile-card .resource-inspector { max-height: none; overflow: visible; margin-top: 10px; }
      .resource-toolbar { margin-bottom: 12px; }
      .context-balance {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--text2);
        font-size: 0.82em;
        margin: 7px 0;

      function currencyOutpostCard(S, node, outpost) {
        const connected = node.streams.filter(stream => stream.mapIdx === outpost.mapIdx).length, normal = outpost.type !== 2;
        return `<article class="mobile-card"><b>${mapName(outpost.mapIdx)}</b><div>${types[outpost.type]} | Distance / Reach ${f(outpost.distance)} / ${f(outpost.range + 15)}</div><div>Free endpoints ${f(outpost.slotsFree)} | Connected here ${f(connected)}</div><div>${normal ? `Potential currency/hr per endpoint ${f(outpost.potentialCurrencyRate)}` : "Drain only / 0 currency"}</div></article>`;
      }
      function currencyInspector(S, node) {
        const streamCount = node.streams.length, connectable = currencyOutpostRows(S, node);
        return `<div class="info-panel"><div class="inspector-head"><div><h3 aria-live="polite">Resource ${node.resourceIdx + 1}</h3><div class="small">World ${node.tier + 1} | Grade ${f(node.grade)} | Grade multiplier ${fmtMultiplier(node.gradeMultiplier)}x</div></div><span class="badge badge-cyan">${currencyState(node)}</span></div><div>${f(node.remaining)} / ${f(node.capacity)}${bar(node.capacity ? node.remaining / node.capacity : 0)}</div><div class="card-grid cols-2">${card("Nominal currency/hr", f(node.nominalCurrencyPerHour))}${card("Total drain/hr", f(node.drainRate))}${card(`Collectable before reset`, resetValue(node.collectableBeforeReset, node.resetProjectionAvailable))}${card("Current streams", streamCount)}${card("Connectable outposts", connectable.length)}</div>${resetProjection(node)}<h3>Current streams</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Outpost</th><th>Endpoint</th><th>Type</th><th>Currency/hr</th><th>Drain/hr</th><th>Current reach</th></tr></thead><tbody>${node.streams.map(stream => currencyStream(S, node, stream)).join("") || '<tr><td colspan="6">No current streams.</td></tr>'}</tbody></table></div><div class="mobile-cards">${node.streams.map(stream => currencyStreamCard(S, node, stream)).join("") || '<div class="note">No current streams.</div>'}</div><h3>Connectable outposts</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Outpost</th><th>Type</th><th>Distance / Reach</th><th>Free endpoints</th><th>Connected here</th><th>Potential / endpoint</th></tr></thead><tbody>${connectable.map(outpost => currencyOutpost(S, node, outpost)).join("") || '<tr><td colspan="6">No connectable outposts.</td></tr>'}</tbody></table></div><div class="mobile-cards">${connectable.map(outpost => currencyOutpostCard(S, node, outpost)).join("") || '<div class="note">No connectable outposts.</div>'}</div></div>`;
      }
      function currencyNodeRow(S, node) {
        const selected = node.resourceIdx === session.selectedResource;
        return `<tr class="currency-selectable ${selected ? "selected" : ""}" data-currency-resource="${node.resourceIdx}" tabindex="${selected ? "0" : "-1"}" role="option" aria-selected="${selected ? "true" : "false"}" aria-label="Select Resource ${node.resourceIdx + 1}"><td>${currencyIcon(node.currencySlot)}Resource ${node.resourceIdx + 1}</td><td>${fi(node.grade)}</td><td>${f(node.remaining)} / ${f(node.capacity)}</td><td>${currencyState(node)}</td><td>${f(node.nominalCurrencyPerHour)}/hr</td></tr>`;
      }
      function currencyNodeCard(S, node) {
        const selected = node.resourceIdx === session.selectedResource;
        return `<article class="mobile-card currency-mobile-card ${selected ? "selected" : ""}" data-currency-resource="${node.resourceIdx}" tabindex="${selected ? "0" : "-1"}" role="option" aria-selected="${selected ? "true" : "false"}" aria-label="Select Resource ${node.resourceIdx + 1}"><b>${currencyIcon(node.currencySlot)}Resource ${node.resourceIdx + 1}</b><div><span class="badge badge-gold">${currencyState(node)}</span> | Grade ${fi(node.grade)} (${fmtMultiplier(node.gradeMultiplier)}x)</div><div>Remaining ${f(node.remaining)} / ${f(node.capacity)} | Nominal configured/hr ${f(node.nominalCurrencyPerHour)}</div>${selected ? `<div class="currency-inspector">${currencyInspector(S, node)}</div>` : ""}</article>`;
      }
      function currencyViewTabs() {
        return `<section class="section"><nav class="subtabs currency-subtabs" role="tablist" aria-label="Currency views"><button role="tab" aria-selected="${session.currencyView === "sources" ? "true" : "false"}" tabindex="${session.currencyView === "sources" ? 0 : -1}" data-currency-view="sources">Sources</button><button role="tab" aria-selected="${session.currencyView === "breakdown" ? "true" : "false"}" tabindex="${session.currencyView === "breakdown" ? 0 : -1}" data-currency-view="breakdown">Collection Breakdown</button></nav></section>`;
      }
      function currencyBreakdownView(S) {
        const options = R.outpostRows(S).filter(x => x.type === 0 || x.type === 2);
        if (!options.some(x => x.mapIdx === session.breakdownOutpost)) session.breakdownOutpost = options[0]?.mapIdx ?? null;
        return `${currencyViewTabs()}<section class="section"><h2>Collection Breakdown</h2><div class="breakdown-grid"><div class="breakdown-panel"><h3>Global collection</h3><div class="breakdown-warning"></div><div id="global-collection-tree"></div></div><div class="breakdown-panel"><h3>Selected outpost</h3><label>Outpost<select id="breakdown-outpost">${options.map(x => `<option value="${x.mapIdx}" ${x.mapIdx === session.breakdownOutpost ? "selected" : ""}>${mapName(x.mapIdx)} (${types[x.type]})</option>`).join("")}</select></label><div class="breakdown-warning"></div><div id="outpost-collection-tree"></div>${options.length ? "" : '<div class="empty-state">No Normal or Savage collecting outposts are available.</div>'}</div></div></section>`;
      }
      function currencies() {
        if (!R.hasCompleteRoyalData(saveData)) return royalDataGate();
        const slots = O.validCurrencySlots(), slot = slots.includes(session.currencyTarget) ? session.currencyTarget : (session.currencyTarget = slots[0] ?? 0), breakdown = currencyDetails(saveData, slot), nodes = breakdown.nodes || [];
        if (nodes.length && !nodes.some(node => node.resourceIdx === session.selectedResource)) session.selectedResource = nodes[0].resourceIdx;
        if (nodes.length && session.mapSelectionKind === null) { session.mapSelectionKind = "resource"; session.worldIdx = R.resourceWorld(session.selectedResource); }
        const selected = nodes.find(node => node.resourceIdx === session.selectedResource) || nodes[0];
        if (session.currencyView === "breakdown") return currencyBreakdownView(saveData);
        const sourcePanel = `<section class="section"><h2>Currency slot ${slot} source nodes</h2>${breakdown.available === false ? '<div class="empty-state">Currency source nodes are unavailable for this save.</div>' : nodes.length ? `<div class="currency-workspace"><div class="currency-list" role="listbox" aria-label="Currency source nodes"><table class="data-table"><thead><tr><th>Resource</th><th>World</th><th>Grade</th><th>Remaining</th><th>State</th><th>Nominal configured / hr</th></tr></thead><tbody>${nodes.map(node => currencyNodeRow(saveData, node)).join("")}</tbody></table></div><div class="currency-inspector">${currencyInspector(saveData, selected)}</div></div><div class="currency-mobile-list" role="listbox" aria-label="Currency source nodes">${nodes.map(node => currencyNodeCard(saveData, node)).join("")}</div>` : '<div class="empty-state">No resource nodes produce this currency.</div>'}</section>`;
        return `${currencyViewTabs()}<section class="section"><div class="planner-controls"><label>Currency<select id="currency-selector">${slots.map(value => `<option value="${value}" ${value === slot ? "selected" : ""}>Currency slot ${value}</option>`).join("")}</select></label><button class="primary" id="optimize-currency">Optimize before reset</button></div>${invalidResourceWarning(breakdown.invalid)}${currencyCoverageWarning(breakdown)}${currencySummary(breakdown)}<p class="note">Nominal configured output uses the fixed current node state. Projection ends at the saved daily reset; no post-reset simulation. Boundary refill and grade are projected.${breakdown.invalid?.length ? " Some saved connections are excluded from totals." : ""}</p></section>${sourcePanel}`;
      }
      function balances(S, k) {
        const a =
          k === "orblets"
            ? [R.orbletOwnedDetail(S)]
            : k === "statues"
              ? [
                  R.parchmentOwnedDetail(S),
                  ...visibleMarbles.map((_, i) =>
                    R.royalMarbleOwnedDetail(S, i),
                  ),
                ]
              : visibleMarbles.map((_, i) => R.royalMarbleOwnedDetail(S, i));
        return `<div class="context-balance">${a.map((x) => `<span>${displayItemName(x.itemName)} <b>${f(x.value)}</b></span>`).join("")}</div>`;
      }
      function upgrades() {
        if (!R.hasCompleteRoyalData(saveData)) return royalDataGate();
        return `<section class="section"><nav class="subtabs" role="tablist" aria-label="Upgrade views">${["armory", "statues", "flair", "orblets"].map((v) => `<button role="tab" aria-selected="${session.upgradeView === v ? "true" : "false"}" data-upgrade="${v}">${v === "armory" ? "Armory" : v === "statues" ? "Royal Statues" : v === "flair" ? "Statue Flair" : "Orblets"}</button>`).join("")}</nav>${session.upgradeView === "armory" ? armory() : session.upgradeView === "statues" ? statues() : session.upgradeView === "flair" ? flair() : orblets()}</section>`;
      }
      function armory() {
        const S = saveData,
          rows = R.armoryRows(S), redux = R.allMasterclassCostReduxDetail(S);
        return `<h2>Armory</h2><div class="note">Masterclass costs: ${fmtMultiplier(redux.value)}x (${f(redux.reductionPercent)}% reduction), including daily prefix ${fmtMultiplier(redux.prefix)}x and BARGAIN ${fmtMultiplier(redux.bargain)}x.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Level</th><th>Description</th><th>Cost</th></tr></thead><tbody>${rows
          .map((r) => {
            const u = ARMORY_UPGRADES[r.index],
              max = r.currentLevel >= n(u?.maxLevel), balance = n(S.royalGData?.[1]?.[r.cost.currencySlot]);
            return `<tr><td>${displayItemName(u?.name)}</td><td>${fi(r.currentLevel)} / ${fi(u?.maxLevel)}</td><td>${esc(max ? R.armoryDescription(S, r.index) : r.currentLevel <= 0 ? `On purchase: ${R.armoryDescription(S, r.index, r.nextBonus)}` : R.armoryDescription(S, r.index))}</td><td class="${max || r.cost.value <= balance ? "cost-ok" : "cost-bad"}">${max ? `${currencyIcon(r.cost.currencySlot)}MAX (slot ${r.cost.currencySlot})` : `${currencyIcon(r.cost.currencySlot)}${f(balance)} / ${f(r.cost.value)} (slot ${r.cost.currencySlot})`}</td></tr>`;
          })
          .join(
            "",
            )}</tbody></table></div><div class="mobile-cards">${rows.map((r) => { const u = ARMORY_UPGRADES[r.index], max = r.currentLevel >= n(u?.maxLevel), balance = n(S.royalGData?.[1]?.[r.cost.currencySlot]); return `<article class="mobile-card"><b>${displayItemName(u?.name)}</b><div>Level ${f(r.currentLevel)} / ${f(u?.maxLevel)}</div><div>${esc(max ? R.armoryDescription(S, r.index) : r.currentLevel <= 0 ? `On purchase: ${R.armoryDescription(S, r.index, r.nextBonus)}` : R.armoryDescription(S, r.index))}</div><div class="${max || r.cost.value <= balance ? "cost-ok" : "cost-bad"}">Cost ${currencyIcon(r.cost.currencySlot)}${max ? `MAX (slot ${r.cost.currencySlot})` : `${f(balance)} / ${f(r.cost.value)} (slot ${r.cost.currencySlot})`}</div></article>`; }).join("")}</div>`;
      }
      function statues() {
        const S = saveData;
        return `<h2>Royal Statues</h2>${balances(S, "statues")}<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Level</th><th>Description</th><th>Material / Owned / Cost</th><th>Odds</th></tr></thead><tbody>${Array.from(
          { length: 7 },
          (_, i) => {
            const d = R.royalStatueUpgradeDetail(S, i);
            const level = R.royalG(S, 0, i);
            return `<tr><td>${esc(ROYAL_STATUES[i].name)}</td><td>${fi(level)}</td><td>${esc(level > 0 ? R.royalStatueDescription(S, i) : `On purchase: ${R.royalStatueDescription(S, i, 1)}`)}</td><td>${displayItemName(d.itemName)} / ${fi(d.owned)} / ${fi(d.cost)}</td><td>${f(R.statueUpgradeOdds(S, i) * 100)}%</td></tr>`;
          },
        ).join("")}</tbody></table></div><div class="mobile-cards">${Array.from(
          { length: 7 },
          (_, i) => {
            const d = R.royalStatueUpgradeDetail(S, i);
            const level = R.royalG(S, 0, i); return `<article class="mobile-card"><b>${esc(ROYAL_STATUES[i].name)}</b><div>Level ${fi(level)}</div><div>${esc(level > 0 ? R.royalStatueDescription(S, i) : `On purchase: ${R.royalStatueDescription(S, i, 1)}`)}</div><div>${displayItemName(d.itemName)} / ${fi(d.owned)} / ${fi(d.cost)} | Odds ${f(R.statueUpgradeOdds(S, i) * 100)}%</div></article>`;
          },
        ).join("")}</div>`;
      }
      function flair() {
        const S = saveData,
          rows = Array.from({ length: 32 }, (_, i) =>
            R.statueFlairRow(S, i),
          ).filter(
            (r) =>
              n(r.material?.category) < 7 &&
              (session.flairCategory === "all" ||
                n(r.material?.category) === n(session.flairCategory)) &&
              (session.flairShowMaxed || !r.maxed),
          );
        return `<h2>Statue Flair</h2>${balances(S, "flair")}<div class="controls"><label>Marble category<select id="flair-category"><option value="all">All</option>${visibleMarbles.map((x, i) => `<option value="${i}">${displayItemName(x.name)}</option>`).join("")}</select></label><label><input id="flair-maxed" type="checkbox" ${session.flairShowMaxed ? "checked" : ""}> Show maxed</label></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Level / effect</th><th>Material / owned / cost</th><th>Status</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(label("Statue", r.statueIdx) || `Statue ${r.statueIdx + 1}`)}</td><td>${fi(r.level)} / ${f(r.currentMultiplier)} to ${f(r.nextMultiplier)}</td><td>${displayItemName(r.material?.name)} / ${fi(r.owned)} / ${fi(r.cost)}</td><td>${r.maxed ? "Maxed" : r.affordable ? "Affordable" : "Not affordable"}</td></tr>`).join("")}</tbody></table></div><div class="mobile-cards">${rows.map((r) => `<article class="mobile-card"><b>${esc(label("Statue", r.statueIdx) || `Statue ${r.statueIdx + 1}`)}</b><div>Lv ${fi(r.level)} | ${f(r.currentMultiplier)} to ${f(r.nextMultiplier)}</div><div>${displayItemName(r.material?.name)} / ${fi(r.owned)} / ${fi(r.cost)}</div></article>`).join("")}</div>`;
      }
      function orblets() {
        const S = saveData,
          rows = R.orbletRows(S);
        return `<h2>Orblets</h2>${balances(S, "orblets")}<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Level</th><th>Description</th><th>Cost</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${displayItemName(r.name)}</td><td>${fi(r.level)} / ${fi(r.maxLevel)}</td><td>${esc(R.orbletDescription(S, r.index))}</td><td class="${r.maxed || r.affordable ? "cost-ok" : "cost-bad"}">${r.maxed ? "MAX" : `${fi(r.owned)} / ${fi(r.cost)} Orblets`}</td></tr>`).join("")}</tbody></table></div><div class="mobile-cards">${rows.map((r) => `<article class="mobile-card"><b>${displayItemName(r.name)}</b><div>Level ${fi(r.level)} / ${fi(r.maxLevel)}</div><div>${esc(R.orbletDescription(S, r.index))}</div><div class="${r.maxed || r.affordable ? "cost-ok" : "cost-bad"}">Cost ${r.maxed ? "MAX" : `${fi(r.owned)} / ${fi(r.cost)} Orblets`}</div></article>`).join("")}</div>`;
      }
      function wire() {
        wireTabs(".tab-btn", (b) => (session.tab = b.dataset.tab));
        wireTabs(
          "[data-world-tab]",
          (b) => {
            session.worldIdx = n(b.dataset.worldTab);
            if (!R.worldOutpostRows(saveData, session.worldIdx).some(x => x.mapIdx === session.selectedOutpost)) session.selectedOutpost = null;
            if (session.selectedResource !== null && R.resourceWorld(session.selectedResource) !== session.worldIdx) session.selectedResource = null;
            if ((session.mapSelectionKind === "outpost" && session.selectedOutpost === null) || (session.mapSelectionKind === "resource" && session.selectedResource === null)) session.mapSelectionKind = null;
          },
        );
        wireTabs(
          "[data-upgrade]",
          (b) => (session.upgradeView = b.dataset.upgrade),
        );
        wireTabs(
          "[data-currency-view]",
          (b) => (session.currencyView = b.dataset.currencyView),
        );
        document.querySelectorAll("[data-world]").forEach(
          (x) =>
            (x.onclick = () => {
              session.worldIdx = n(x.dataset.world);
              if (!R.worldOutpostRows(saveData, session.worldIdx).some(y => y.mapIdx === session.selectedOutpost)) session.selectedOutpost = null;
              if (session.selectedResource !== null && R.resourceWorld(session.selectedResource) !== session.worldIdx) session.selectedResource = null;
              if ((session.mapSelectionKind === "outpost" && session.selectedOutpost === null) || (session.mapSelectionKind === "resource" && session.selectedResource === null)) session.mapSelectionKind = null;
              session.tab = "outposts";
              render();
            }),
        );
        document
          .querySelector("#outpost-filter")
          ?.addEventListener("change", (e) => {
            session.outpostFilter = e.target.value;
            render();
          });
        document.querySelectorAll("[data-outpost-select]").forEach(x => {
          const select = () => { session.selectedOutpost = n(x.dataset.outpostSelect); session.mapSelectionKind = "outpost"; session.tab = "outposts"; render(); };
          x.onclick = select;
          x.onkeydown = e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); return; }
            if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
            e.preventDefault();
            const owner = x.closest(".outpost-list"), options = [...owner.querySelectorAll("[data-outpost-select]")], index = options.indexOf(x);
            const next = currencyNavigationIndex(e.key, index, options.length);
            if (next < 0) return;
            const target = n(options[next].dataset.outpostSelect);
            session.selectedOutpost = target;
            session.mapSelectionKind = "outpost";
            session.tab = "outposts";
            render();
            document.querySelector(`.outpost-list [data-outpost-select="${target}"]`)?.focus();
          };
        });
        for (const [id, key] of [["resource-state", "resourceState"], ["resource-currency", "resourceCurrency"], ["resource-sort", "resourceSort"]])
          document.querySelector(`#${id}`)?.addEventListener("change", e => { session[key] = e.target.value; render(); });
        document.querySelector("#resource-search")?.addEventListener("input", e => { session.resourceSearch = e.target.value; render(); });
        document.querySelectorAll("[data-resource]").forEach(x => {
          const select = () => { session.selectedResource = n(x.dataset.resource); session.mapSelectionKind = "resource"; render(); };
          x.onclick = select;
          x.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } };
        });
        document.querySelectorAll("[data-map-resource]").forEach(x => x.onclick = () => {
          session.selectedResource = n(x.dataset.mapResource);
          session.mapSelectionKind = "resource";
          session.resourceState = "all";
          session.resourceCurrency = "all";
          session.resourceSearch = "";
          session.tab = "resources";
          render();
        });
        document.querySelectorAll("[data-map-outpost]").forEach(x => {
          const select = () => { session.selectedOutpost = n(x.dataset.mapOutpost); session.mapSelectionKind = "outpost"; session.outpostFilter = "all"; session.tab = "outposts"; render(); };
          x.onclick = select;
          x.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } };
        });
        document.querySelector("[data-toggle-assignments]")?.addEventListener("click", e => {
          session.assignmentIconsVisible = !session.assignmentIconsVisible;
          render();
        });
        document.querySelector("[data-toggle-range-finder]")?.addEventListener("click", () => {
          session.rangeFinderMode = !session.rangeFinderMode;
          royalQuickTooltip.classList.remove("open");
          render();
        });
        document.querySelector("#currency-selector")?.addEventListener("change", e => {
          session.currencyTarget = n(e.target.value);
          const first = currencyDetails(saveData, session.currencyTarget).nodes?.[0];
          if (first) { session.selectedResource = first.resourceIdx; session.mapSelectionKind = "resource"; session.worldIdx = R.resourceWorld(first.resourceIdx); }
          render();
        });
        document.querySelector("#breakdown-outpost")?.addEventListener("change", e => {
          session.breakdownOutpost = n(e.target.value);
          render();
        });
        document.querySelectorAll("[data-currency-resource]").forEach(x => {
          const select = (focusOwner = false) => {
            session.selectedResource = n(x.dataset.currencyResource);
            session.mapSelectionKind = "resource";
            session.worldIdx = R.resourceWorld(session.selectedResource);
            const owner = x.closest(".currency-list, .currency-mobile-list"), ownerClass = owner?.classList.contains("currency-list") ? "currency-list" : "currency-mobile-list";
            render();
            if (focusOwner) document.querySelector(`.${ownerClass} [data-currency-resource="${session.selectedResource}"]`)?.focus();
          };
          x.onclick = () => select();
          x.onkeydown = e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); return; }
            if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
            e.preventDefault();
            const owner = x.closest(".currency-list, .currency-mobile-list"), options = [...owner.querySelectorAll("[data-currency-resource]")], index = options.indexOf(x);
            if (!options.length) return;
            const next = currencyNavigationIndex(e.key, index, options.length);
            const ownerClass = owner.classList.contains("currency-list") ? "currency-list" : "currency-mobile-list";
            const target = n(options[next].dataset.currencyResource);
            session.selectedResource = target;
            session.mapSelectionKind = "resource";
            session.worldIdx = R.resourceWorld(target);
            render();
            document.querySelector(`.${ownerClass} [data-currency-resource="${n(target)}"]`)?.focus();
          };
        });
        document
          .querySelector("#flair-category")
          ?.addEventListener("change", (e) => {
            session.flairCategory = e.target.value;
            render();
          });
        document
          .querySelector("#flair-maxed")
          ?.addEventListener("change", (e) => {
            session.flairShowMaxed = e.target.checked;
            render();
          });
        wireRoyalTooltips();
        wireRoyalRangeFinder();
      }
      initSaveLoader({
        target: "#save-area",
        onLoad: (S) => {
          const x = R.worldOutpostRows(S, 0).find(
            (q) => q.built || q.state === "in-progress",
          );
          session.worldIdx = x?.worldIdx ?? 0;
          session.selectedOutpost = x?.mapIdx ?? null;
          render();
        },
        auth: true,
      });
      render();
    </script>
  </body>
</html>
