<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdleOn Stats Dashboard</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --accent: #e94560; --text: #eee; --text2: #c0c0d4;
  --gold: #ffd700; --green: #4caf50; --blue: #2196f3;
  --purple: #bb86fc; --cyan: #4dd0e1; --red: #f44;
  --border: #444; --text1: var(--text); --warning: #ffb74d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
h1 { display: flex; align-items: baseline; gap: 12px; text-align: center; padding: 12px; background: var(--bg2); border-bottom: 2px solid var(--accent); font-size: 1.4em; }
h1 .page-title { flex: 1; min-width: 0; }
h1 .brand { color: var(--accent); }
.header-link { color: var(--text2); text-decoration: none; font-size: .5em; font-weight: 400; white-space: nowrap; }
.header-link:hover { color: var(--text); }
.subtitle { color: var(--text2); font-size: .82em; text-align: center; padding: 10px 16px 0; }

.main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.section { background: var(--bg2); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.section h2, .region-title { margin-bottom: 12px; color: var(--accent); font-size: 1.05em; border-bottom: 1px solid #333; padding-bottom: 6px; }
.dashboard-region { margin-bottom: 16px; }
.context-controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.context-controls label { display: flex; flex-direction: column; gap: 4px; color: var(--text2); font-size: .82em; font-weight: 600; }
.context-controls select { min-width: 190px; max-width: min(460px, calc(100vw - 64px)); padding: 7px 9px; background: var(--bg3); color: var(--text); border: 1px solid #555; border-radius: 4px; font-size: .95em; }
.context-controls select:disabled { opacity: .55; }
.context-note { color: var(--text2); font-size: .76em; margin-top: 10px; }

.cat-tabs { display: flex; gap: 2px; background: var(--bg2); border-bottom: 1px solid #333; margin-bottom: 12px; flex-wrap: wrap; }
.cat-tab { appearance: none; padding: 10px 16px; cursor: pointer; color: var(--text2); background: transparent; border: 0; border-bottom: 2px solid transparent; font: inherit; font-size: .84em; font-weight: 600; }
.cat-tab:hover, .cat-tab:focus-visible { color: var(--text); background: rgba(255,255,255,.05); outline: none; }
.cat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.cat-panel { display: none; }
.cat-panel.active { display: block; }

.desc-section { margin-bottom: 8px; }
.desc-header { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 9px 12px; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-align: left; font: inherit; }
.desc-header:hover, .desc-header:focus-visible { background: #1b2a4f; border-color: #5a5a6a; outline: none; }
.desc-header.partial { border-left: 3px solid var(--warning); }
.desc-header.unavailable { border-left: 3px solid var(--red); }
.dh-arrow { width: 14px; flex: 0 0 14px; color: var(--text2); font-size: .7em; transition: transform .15s; }
.dh-arrow.open { transform: rotate(90deg); }
.dh-copy { flex: 1 1 220px; min-width: 0; }
.dh-name { display: block; font-weight: 650; font-size: .9em; }
.dh-reason { display: none; color: var(--text2); font-size: .7em; line-height: 1.3; margin-top: 2px; }
.desc-header.partial .dh-reason, .desc-header.unavailable .dh-reason { display: block; }
.dh-val { flex: 0 0 auto; color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9em; white-space: nowrap; }
.desc-header.unavailable .dh-val { color: var(--red); }
.desc-body { display: none; padding: 4px 0 6px 24px; border-left: 1px solid #333; }
.desc-body.open { display: block; }
.tree { padding: 8px 0; min-width: 0; }

.scope-badge, .state-badge { display: inline-block; flex: 0 0 auto; padding: 2px 6px; border-radius: 3px; font-size: .62em; font-weight: 700; white-space: nowrap; }
.scope-badge.char { background: rgba(77,208,225,.14); color: var(--cyan); }
.scope-badge.acct { background: rgba(187,134,252,.14); color: var(--purple); }
.scope-badge.map { background: rgba(33,150,243,.16); color: #82c5ff; }
.state-badge.partial { background: rgba(255,183,77,.16); color: var(--warning); }
.state-badge.unavailable { background: rgba(255,68,68,.16); color: var(--red); }
.state-badge.not-applicable { background: rgba(192,192,212,.12); color: var(--text2); }

.bt-controls { margin-bottom: 8px; display: flex; gap: 6px; }
.bt-controls .btn-sm { padding: 4px 10px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: .8em; }
.bt-controls .btn-sm:hover { color: var(--cyan); border-color: var(--cyan); }
.bt-tree { font-size: .84em; min-width: 0; }
.bt-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.04); min-height: 26px; cursor: pointer; }
.bt-row:hover { background: rgba(255,255,255,.05); }
.bt-children { background: rgba(0,0,0,.1); border-left: 2px solid rgba(255,255,255,.08); }
.bt-root { font-weight: 700; font-size: 1.04em; padding-top: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
.bt-arrow { cursor: pointer; color: var(--text2); font-size: 1em; width: 14px; text-align: center; user-select: none; flex-shrink: 0; }
.bt-arrow:hover { color: var(--cyan); }
.bt-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-val { font-weight: 600; text-align: right; flex-shrink: 0; white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.bt-tag { font-size: .7em; opacity: .75; margin-left: 4px; }
.bt-tag.auto { color: var(--accent); }
.bt-tag.manual { color: var(--warning); }
.bt-tooltip { position: fixed; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: .82em; max-width: min(350px, calc(100vw - 24px)); pointer-events: none; z-index: 999; display: none; }

@media (max-width: 700px) {
  h1 { gap: 7px; font-size: 1.05em; }
  .header-link { font-size: .58em; }
  .main { padding: 10px; }
  .section { padding: 12px; }
  .context-controls { align-items: stretch; }
  .context-controls label, .context-controls select { width: 100%; max-width: none; }
  .cat-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .cat-tab { flex: 0 0 auto; padding: 9px 12px; }
  .desc-header { flex-wrap: wrap; }
  .dh-copy { flex-basis: calc(100% - 30px); }
  .scope-badge { margin-left: 22px; }
  .dh-val { margin-left: auto; }
  .desc-body { padding-left: 8px; }
  .bt-label { white-space: normal; overflow-wrap: anywhere; }
}
</style>
</head>
<body>
<h1>
  <a class="header-link" href="index.html" title="Home">Home</a>
  <span class="page-title">&#x1F4CA; <span class="brand">IdleOn</span> Stats Dashboard</span>
  <a class="header-link" href="https://github.com/Corgan/idleon-research-optimizer" target="_blank" rel="noopener" title="GitHub">GitHub</a>
</h1>
<div id="save-area"></div>

<main class="main" id="main-content">
  <section class="section" aria-labelledby="context-heading">
    <h2 id="context-heading">Calculation Context</h2>
    <div class="context-controls">
      <label>Character
        <select id="char-sel" disabled>
          <option value="-1">Load a save first</option>
        </select>
      </label>
      <label>Map
        <select id="map-sel" disabled>
          <option value="0">Town</option>
        </select>
      </label>
      <label>Map List
        <select id="map-visibility">
          <option value="accessible">Accessible</option>
          <option value="advanced">Accessible + Special</option>
          <option value="all">All Valid Maps</option>
        </select>
      </label>
      <label>Skill
        <select id="skill-sel">
          <option>Mining</option>
          <option>Choppin</option>
          <option>Fishing</option>
          <option>Catching</option>
          <option>Trapping</option>
          <option>Worship</option>
          <option>Smithing</option>
          <option>Cooking</option>
          <option value="Laboratory">Laboratory</option>
          <option>Divinity</option>
          <option>Spelunking</option>
          <option>Breeding</option>
        </select>
      </label>
        <label>Construction Mode
          <select id="construction-mode">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
    </div>
    <div class="context-note" id="context-note">Load a save to calculate all descriptors.</div>
  </section>

  <section class="dashboard-region" aria-labelledby="breakdowns-heading">
    <h2 class="region-title" id="breakdowns-heading">Breakdowns</h2>
    <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
    <div id="cat-panels"></div>
  </section>
</main>
<div class="bt-tooltip" id="bt-tooltip"></div>
<script type="module">
'use strict';

import { saveData } from './js/state.js';
import { initSaveLoader } from './js/ui/save-loader.js';
import { toRenderNode } from './js/stats/tree-builder.js';
import { createStatContext } from './js/stats/stat-context.js';
import { allDescriptors } from './js/stats/registry.js';
import { renderBreakdownTree } from './js/ui/dash-breakdowns.js';
import { fmtVal, fmtMonsterCash, fmtDmgRange } from './js/renderers/format.js';
import { ClassNames, MapDispName } from './js/stats/data/game/customlists.js';
import { MONSTERS } from './js/stats/data/game/monsters.js';
import {
  currentMapData,
  currentMapDataAvailable,
  dreamData,
  klaData,
  mapBonData,
  optionsListData,
} from './js/save/data.js';
import {
  buildCharacterMapOptions,
  classifyMap,
} from './js/stats/systems/common/map-access.js';

// ======================= CONSTANTS =======================
var CATEGORY_ORDER = ['combat', 'stat', 'multiplier', 'rate', 'capacity', 'construction', 'research', 'currency', 'progression'];
var CATEGORY_LABELS = {
  combat: 'Combat', stat: 'Stats', multiplier: 'Multipliers', rate: 'Rates',
  capacity: 'Capacity', construction: 'Construction', research: 'Research', currency: 'Currency', progression: 'Progression'
};

// Special formatters per descriptor
var FMT = {
  'drop-rate': function(v) { return v.toFixed(2) + 'x'; },
  'coin-multi': function(v) { return fmtMonsterCash(v) + 'x'; },
  'damage':    function(v) { return fmtVal(v); },
  'kill-per-kill': function(v) { return v.toFixed(1) + ' kpk'; },
  'fighting-afk': function(v) { return v.toFixed(2) + 'x'; },
  'raw-combat-kills-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'combat-survivability': function(v) { return v.toFixed(0) + '%'; },
  'reward-roll-kills-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'credited-kills-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'class-exp-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'panel-coins-per-hour': function(v) { return fmtMonsterCash(v) + '/hr'; },
  'direct-card-average-time': function(v) { return '1 in ' + fmtVal(v) + ' hr'; },
  'carry-capacity-mining': function(v) { return fmtVal(v); },
  'carry-capacity-chopping': function(v) { return fmtVal(v); },
  'carry-capacity-fishing': function(v) { return fmtVal(v); },
  'carry-capacity-catching': function(v) { return fmtVal(v); },
  'carry-capacity-food': function(v) { return fmtVal(v); },
  'carry-capacity-critters': function(v) { return fmtVal(v); },
  'carry-capacity-souls': function(v) { return fmtVal(v); },
  'carry-capacity-materials': function(v) { return fmtVal(v); },
  'skill-afk':    function(v) { return v.toFixed(2) + 'x'; },
  'voting-multi': function(v) { return v.toFixed(2) + 'x'; },
  'gfood-multi':  function(v) { return v.toFixed(2) + 'x'; },
  'monster-exp':  function(v) { return v.toFixed(2) + 'x'; },
  'skill-exp':    function(v) { return v.toFixed(2) + 'x'; },
  'skill-efficiency': function(v) { return fmtVal(v); },
  'divinity-points-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'divinity-exp-per-hour': function(v) { return fmtVal(v) + '/hr'; },
  'build-rate':   function(v) { return fmtVal(v) + '/hr'; },
  'construction-exp': function(v) { return fmtVal(v) + '/hr'; },
  'flaggy-speed': function(v) { return v.toFixed(2) + 'x'; },
  'research-exp': function(v) { return v.toFixed(2) + 'x'; },
  'research-afk-gains': function(v) { return (100 * v).toFixed(2) + '%'; },
  'printer-sample-size': function(v) { return (100 * v).toFixed(1) + '%'; },
  'card-drop-chance-multiplier': function(v) { return v.toFixed(2) + 'x'; },
  'sushi-bucks':  function(v) { return fmtVal(v) + '/hr'; },
  'minehead-currency': function(v) { return fmtVal(v) + '/hr'; },
  'spelunking-pow': function(v) { return fmtVal(v); },
  'tome-score':   function(v) { return fmtVal(v); },
  'total-str':    function(v) { return fmtVal(v); },
  'total-agi':    function(v) { return fmtVal(v); },
  'total-wis':    function(v) { return fmtVal(v); },
  'total-luk':    function(v) { return fmtVal(v); },
  'crit-chance':  function(v) { return v.toFixed(1) + '%'; },
  'crit-damage':  function(v) { return v.toFixed(2) + 'x'; },
  'max-hp':       function(v) { return fmtVal(v); },
  'max-mp':       function(v) { return fmtVal(v); },
  'accuracy':     function(v) { return fmtVal(v); },
  'hit-chance':  function(v) { return v.toFixed(0) + '%'; },
  'accuracy-required': function(v) { return fmtVal(v); },
  'overkill-tier': function(v) { return 'Tier ' + Math.round(v); },
  'multikill-base': function(v) { return '+' + fmtVal(v) + '%'; },
  'multikill-per-tier': function(v) { return '+' + fmtVal(v) + '%'; },
  'multikill-total': function(v) { return '+' + fmtVal(v) + '%'; },
  'defence':      function(v) { return fmtVal(v); },
  'movement-speed': function(v) { return fmtVal(Math.round((v - 1) * 100)) + '%'; },
  'giant-mob':    function(v) { return v > 0 ? '1 in ' + fmtVal(Math.round(1/v)) : 'N/A'; },
  'crystal-spawn': function(v) { return v > 0 ? '1 in ' + fmtVal(Math.round(1/v)) : 'N/A'; },
};

function escHtml(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function _j(value) {
  if (typeof value !== 'string') return value;
  try { return JSON.parse(value); } catch (error) { return []; }
}

function _getLOG(x) { return Math.log(Math.max(x, 1)) / 2.30259; }
function _arcaneMulti(kills) {
  if (kills < 1) return 0;
  var lg = _getLOG(kills), lg2 = Math.log(Math.max(kills, 1)) / Math.log(2);
  return (2 * Math.max(0, lg - 3.5) + Math.max(0, lg2 - 12)) * (lg / 2.5)
    + Math.min(2, kills / 1000) + Math.max(5 * (lg - 5), 0);
}

// ======================= STATE =======================
var SAVE_RAW = null;
var CHARS = [];
var CUR_CHAR = 0;
var CUR_MAP = 0;
var MAP_VISIBILITY = 'accessible';
var CUR_SKILL = 'Mining';
var CONSTRUCTION_ACTIVE = true;
var RESULTS = Object.create(null);
var ACTIVE_CTX = null;

// ======================= DESCRIPTOR GROUPING =======================
var DESCS = allDescriptors();
var BY_CAT = {};
for (var i = 0; i < DESCS.length; i++) {
  var d = DESCS[i];
  var cat = d.category || 'other';
  if (!BY_CAT[cat]) BY_CAT[cat] = [];
  BY_CAT[cat].push(d);
}
var CATEGORY_KEYS = CATEGORY_ORDER.concat(Object.keys(BY_CAT).filter(function(cat) {
  return CATEGORY_ORDER.indexOf(cat) === -1;
}));

function _categoryLabel(category) {
  if (CATEGORY_LABELS[category]) return CATEGORY_LABELS[category];
  return category.charAt(0).toUpperCase() + category.slice(1).replace(/-/g, ' ');
}

function _scopeInfo(desc) {
  if (desc.scope === 'account') return { className: 'acct', label: 'Account' };
  if (desc.scope === 'character+map+skill') return { className: 'map', label: 'Char + Map + Skill' };
  if (desc.scope === 'character+map') return { className: 'map', label: 'Char + Map' };
  return { className: 'char', label: 'Character' };
}

function _descriptorName(desc) {
  return desc.name;
}

// ======================= BUILD UI SKELETON =======================
function buildTabs() {
  var tabsEl = document.getElementById('cat-tabs');
  var panelsEl = document.getElementById('cat-panels');
  tabsEl.innerHTML = '';
  panelsEl.innerHTML = '';

  var first = true;
  for (var ci = 0; ci < CATEGORY_KEYS.length; ci++) {
    var cat = CATEGORY_KEYS[ci];
    if (!BY_CAT[cat] || BY_CAT[cat].length === 0) continue;

    var tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'cat-tab' + (first ? ' active' : '');
    tab.textContent = _categoryLabel(cat);
    tab.dataset.cat = cat;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', first ? 'true' : 'false');
    tab.addEventListener('click', switchTab);
    tabsEl.appendChild(tab);

    var panel = document.createElement('div');
    panel.className = 'cat-panel' + (first ? ' active' : '');
    panel.id = 'panel-' + cat;
    panel.setAttribute('role', 'tabpanel');

    var descs = BY_CAT[cat];
    for (var di = 0; di < descs.length; di++) {
      var desc = descs[di];
      var section = document.createElement('div');
      section.className = 'desc-section';
      section.id = 'section-' + desc.id;

      var scope = _scopeInfo(desc);

      section.innerHTML =
        '<button type="button" class="desc-header" data-desc-id="' + escHtml(desc.id) + '" aria-expanded="false">' +
          '<span class="dh-arrow" id="arrow-' + desc.id + '">&#x25B6;</span>' +
          '<span class="dh-copy"><span class="dh-name">' + escHtml(_descriptorName(desc)) + '</span>' +
            '<span class="dh-reason" id="reason-' + desc.id + '"></span></span>' +
          '<span class="scope-badge ' + scope.className + '">' + scope.label + '</span>' +
          '<span class="state-badge" id="state-' + desc.id + '" hidden></span>' +
          '<span class="dh-val" id="hval-' + desc.id + '">—</span>' +
        '</button>' +
        '<div class="desc-body" id="body-' + desc.id + '">' +
          '<div class="tree" id="tree-' + desc.id + '"></div>' +
        '</div>';
      section.querySelector('.desc-header').addEventListener('click', function(event) {
        toggleDescriptor(event.currentTarget.dataset.descId);
      });
      panel.appendChild(section);
    }
    panelsEl.appendChild(panel);
    first = false;
  }
}

function switchTab(e) {
  var cat = e.currentTarget.dataset.cat;
  var tabs = document.querySelectorAll('.cat-tab');
  var panels = document.querySelectorAll('.cat-panel');
  for (var i = 0; i < tabs.length; i++) {
    var selected = tabs[i].dataset.cat === cat;
    tabs[i].classList.toggle('active', selected);
    tabs[i].setAttribute('aria-selected', selected ? 'true' : 'false');
  }
  for (var i = 0; i < panels.length; i++) panels[i].classList.toggle('active', panels[i].id === 'panel-' + cat);
}

function _descriptorById(id) {
  return DESCS.find(function(desc) { return desc.id === id; });
}

function _renderDescriptorTree(id) {
  var result = RESULTS[id];
  var desc = _descriptorById(id);
  var container = document.getElementById('tree-' + id);
  if (!result || !desc || !container) return;
  var renderRoot = toRenderNode({
    name: result.name || desc.name,
    val: Number.isFinite(Number(result.val)) ? Number(result.val) : 0,
    children: result.children,
    fmt: result.fmt || desc.fmt || 'x',
    note: result.reason || result.note || '',
  });
  renderBreakdownTree(renderRoot, container, { tooltipId: 'bt-tooltip' });
}

function toggleDescriptor(id) {
  var body = document.getElementById('body-' + id);
  var arrow = document.getElementById('arrow-' + id);
  var header = body && body.previousElementSibling;
  if (!body || !arrow || !header) return;
  var isOpen = body.classList.toggle('open');
  arrow.classList.toggle('open', isOpen);
  header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');

  if (isOpen && RESULTS[id] && !body.dataset.rendered) {
    _renderDescriptorTree(id);
    body.dataset.rendered = '1';
  }
}

buildTabs();

// ======================= MAP SELECTOR =======================
function _mapLabel(mapOption, bonArr) {
  var idx = mapOption.mapIdx;
  var name = mapOption.name;
  var mobId = mapOption.target;
  var mob = mobId && MONSTERS[mobId] ? MONSTERS[mobId].Name.replace(/_/g, ' ') : '';
  var label = name;
  if (mob && mob !== 'Nothing') label += ' - ' + mob;
  if (bonArr) {
    var multi = _arcaneMulti(bonArr[0] || 0);
    if (multi > 0) label += ' (' + (1 + multi / 100).toFixed(2) + 'x)';
  }
  if (mapOption.current) label += ' (current)';
  else if (mapOption.locked) label += ' (not proven accessible)';
  if (mapOption.visibility === 'advanced') label += ' [' + mapOption.category + ']';
  return label;
}

function _mapBonuses() {
  var data = SAVE_RAW && (SAVE_RAW.data || SAVE_RAW);
  if (data && data.MapBon != null) return _j(data.MapBon) || [];
  return mapBonData || [];
}

function _mapAccessSnapshot() {
  return {
    saveData: saveData,
    klaData: klaData,
    currentMapData: currentMapData,
    currentMapDataAvailable: currentMapDataAvailable,
    dreamData: dreamData,
    optionsListData: optionsListData,
  };
}

function populateMapSel(preferredMap) {
  var mapSel = document.getElementById('map-sel');
  mapSel.innerHTML = '';
  var mb = _mapBonuses();
  var options = buildCharacterMapOptions(CUR_CHAR, _mapAccessSnapshot(), { level: MAP_VISIBILITY });
  var groups = new Map();

  for (var i = 0; i < options.length; i++) {
    var mapOption = options[i];
    var groupLabel = mapOption.world > 0 ? 'World ' + mapOption.world : 'Other';
    if (!groups.has(groupLabel)) {
      var group = document.createElement('optgroup');
      group.label = groupLabel;
      groups.set(groupLabel, group);
      mapSel.appendChild(group);
    }
    var option = document.createElement('option');
    option.value = mapOption.mapIdx;
    option.textContent = _mapLabel(mapOption, mb[mapOption.mapIdx]);
    option.dataset.category = mapOption.category;
    option.dataset.accessible = mapOption.accessible ? '1' : '0';
    groups.get(groupLabel).appendChild(option);
  }

  var available = new Set(options.map(function(option) { return option.mapIdx; }));
  var selected = Number(preferredMap);
  if (!available.has(selected)) {
    var current = _currentMapForCharacter(CUR_CHAR);
    selected = available.has(current) ? current : (options[0] ? options[0].mapIdx : 0);
  }
  mapSel.value = String(selected);
  return selected;
}

function _currentMapForCharacter(charIdx) {
  var current = Number(currentMapData && currentMapData[charIdx]);
  return Number.isFinite(current) ? current : 0;
}

function _clearRenderedTrees() {
  var bodies = document.querySelectorAll('.desc-body');
  for (var i = 0; i < bodies.length; i++) bodies[i].dataset.rendered = '';
}

function _failureResult(desc, error) {
  return {
    name: _descriptorName(desc),
    val: 0,
    children: null,
    fmt: desc.fmt,
    unavailable: true,
    reason: 'Calculation failed: ' + String(error && error.message ? error.message : error),
  };
}

function _resolveDescriptor(ctx, desc) {
  try {
    var result = ctx.resolve(desc.id);
    result.name = _descriptorName(desc);
    result.fmt = desc.fmt || result.fmt;
    return result;
  } catch (error) {
    return _failureResult(desc, error);
  }
}

function _displayValue(desc, result) {
  if (result.notApplicable) return 'Not applicable';
  if (result.unavailable) return 'Unavailable';
  var value = Number(result.val);
  if (!Number.isFinite(value)) return 'Unavailable';
  if (desc.id === 'damage') {
    var minNode = (result.children || []).find(function(child) { return child.name === 'Min Damage'; });
    var minDamage = minNode ? Number(minNode.val) : value;
    var damageRange = fmtDmgRange(Number.isFinite(minDamage) ? minDamage : value, value);
    return result.partial ? '~' + damageRange : damageRange;
  }
  var formatter = FMT[desc.id] || function(v) { return fmtVal(v); };
  var formatted;
  try { formatted = formatter(value); } catch (error) { formatted = fmtVal(value); }
  return result.partial ? '~' + formatted : formatted;
}

function _resultReason(result) {
  if (result.reason) return String(result.reason);
  if (result.notApplicable) return 'This stat does not apply to the selected context.';
  if (result.unavailable) return 'Required calculation inputs are unavailable.';
  if (result.partial) return 'Some source metadata is absent from the imported save.';
  return '';
}

function _renderResult(desc, result) {
  var valueText = _displayValue(desc, result);
  var reason = _resultReason(result);
  var header = document.querySelector('[data-desc-id="' + desc.id + '"]');
  var state = document.getElementById('state-' + desc.id);
  var reasonEl = document.getElementById('reason-' + desc.id);
  var valueEl = document.getElementById('hval-' + desc.id);
  var nameEl = header && header.querySelector('.dh-name');
  var status = result.notApplicable ? 'not-applicable'
    : (result.unavailable ? 'unavailable' : (result.partial ? 'partial' : ''));

  if (header) {
    if (nameEl) nameEl.textContent = _descriptorName(desc);
    header.classList.toggle('partial', status === 'partial');
    header.classList.toggle('unavailable', status === 'unavailable');
  }
  if (state) {
    state.hidden = !status;
    state.className = 'state-badge' + (status ? ' ' + status : '');
    state.textContent = status === 'partial' ? 'Partial'
      : (status === 'unavailable' ? 'Unavailable'
        : (status === 'not-applicable' ? 'Not applicable' : ''));
  }
  if (reasonEl) reasonEl.textContent = reason;
  if (valueEl) valueEl.textContent = valueText;

  var body = document.getElementById('body-' + desc.id);
  if (body && body.classList.contains('open')) {
    _renderDescriptorTree(desc.id);
    body.dataset.rendered = '1';
  }
}

// ======================= COMPUTE ALL =======================
function recalcAll() {
  if (!SAVE_RAW) return;
  RESULTS = Object.create(null);
  _clearRenderedTrees();

  var ctx = createStatContext({
    charIdx: CUR_CHAR,
    mapIdx: CUR_MAP,
    saveData: saveData,
    mapBon: _mapBonuses(),
    layer1: { skillType: CUR_SKILL, isActive: CONSTRUCTION_ACTIVE },
  });
  ACTIVE_CTX = ctx;

  for (var i = 0; i < DESCS.length; i++) {
    var desc = DESCS[i];
    var result = _resolveDescriptor(ctx, desc);
    RESULTS[desc.id] = result;
    _renderResult(desc, result);
  }

  var character = CHARS[CUR_CHAR] || ('Character ' + (CUR_CHAR + 1));
  var mapContext = classifyMap(CUR_MAP);
  var map = mapContext.name;
  document.getElementById('context-note').textContent = character + ' · ' + map + ' · ' + CUR_SKILL
    + ' · Construction ' + (CONSTRUCTION_ACTIVE ? 'Active' : 'Inactive')
    + (mapContext.warning ? ' · ' + mapContext.warning : '');
}

// ======================= SAVE LOADING =======================
function onLoad(_loadedSaveData, raw) {
  SAVE_RAW = raw || _loadedSaveData;
  var data = SAVE_RAW.data || SAVE_RAW;
  CHARS = Array.isArray(SAVE_RAW.charNames) ? SAVE_RAW.charNames : (saveData.charNames || []);
  var charCount = Math.max(CHARS.length, saveData.lv0AllData?.length || 0);
  var charSel = document.getElementById('char-sel');
  charSel.innerHTML = '';

  for (var i = 0; i < charCount; i++) {
    var classId = data['CharacterClass_' + i];
    var className = String(ClassNames[classId] || 'Unknown Class').replace(/_/g, ' ');
    var option = document.createElement('option');
    option.value = i;
    option.textContent = (CHARS[i] || ('Character ' + (i + 1))) + ' (' + className + ')';
    charSel.appendChild(option);
  }

  charSel.disabled = charCount === 0;
  CUR_CHAR = 0;
  CUR_MAP = _currentMapForCharacter(CUR_CHAR);
  MAP_VISIBILITY = document.getElementById('map-visibility').value;
  CUR_SKILL = document.getElementById('skill-sel').value;
  CONSTRUCTION_ACTIVE = document.getElementById('construction-mode').value === 'active';

  var mapSel = document.getElementById('map-sel');
  CUR_MAP = populateMapSel(CUR_MAP);
  mapSel.disabled = charCount === 0;
  recalcAll();
}

initSaveLoader({ target: '#save-area', onLoad, auth: true });

function switchChar(idx) {
  CUR_CHAR = idx;
  CUR_MAP = _currentMapForCharacter(idx);
  CUR_MAP = populateMapSel(CUR_MAP);
  recalcAll();
}

function switchMap(idx) {
  CUR_MAP = idx;
  recalcAll();
}

function switchMapVisibility(value) {
  MAP_VISIBILITY = value;
  CUR_MAP = populateMapSel(CUR_MAP);
  recalcAll();
}

function switchSkill(skillType) {
  CUR_SKILL = skillType;
  recalcAll();
}

function switchConstructionMode(value) {
  CONSTRUCTION_ACTIVE = value === 'active';
  recalcAll();
}

window.statsDebug = function() {
  var descriptorResults = Object.create(null);
  for (var i = 0; i < DESCS.length; i++) {
    var desc = DESCS[i];
    var result = RESULTS[desc.id];
    descriptorResults[desc.id] = {
      val: result ? result.val : null,
      partial: Boolean(result && result.partial),
      unavailable: Boolean(result && result.unavailable),
      reason: result ? _resultReason(result) : 'Not calculated.',
    };
  }

  var debug = {
    context: {
      charIdx: CUR_CHAR,
      character: CHARS[CUR_CHAR] || ('Character ' + (CUR_CHAR + 1)),
      mapIdx: CUR_MAP,
      map: String(MapDispName[CUR_MAP] || ('Map ' + CUR_MAP)).replace(/_/g, ' '),
      skillType: CUR_SKILL,
      constructionMode: CONSTRUCTION_ACTIVE ? 'active' : 'inactive',
      overkillTier: RESULTS['overkill-tier'] ? RESULTS['overkill-tier'].val : null,
    },
    descriptors: descriptorResults,
  };
  console.log('Stats diagnostics', debug);
  return debug;
};

window.copyStatsDebug = function() {
  var text = JSON.stringify(window.statsDebug(), null, 2);
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    return Promise.reject(new Error('Clipboard access is unavailable in this browser context.'));
  }
  return navigator.clipboard.writeText(text).then(function() {
    console.log('Stats diagnostics copied to clipboard.');
    return true;
  });
};

document.getElementById('char-sel').addEventListener('change', function() { switchChar(Number(this.value)); });
document.getElementById('map-sel').addEventListener('change', function() { switchMap(Number(this.value)); });
document.getElementById('map-visibility').addEventListener('change', function() { switchMapVisibility(this.value); });
document.getElementById('skill-sel').addEventListener('change', function() { switchSkill(this.value); });
document.getElementById('construction-mode').addEventListener('change', function() { switchConstructionMode(this.value); });
</script>
