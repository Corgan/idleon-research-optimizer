<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Are you endgame? - Idleon Builds</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --accent: #e94560;
  --text: #eee; --green: #4caf50; --red: #f44;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
h1 { text-align: center; padding: 16px; background: var(--bg2); border-bottom: 2px solid var(--accent); font-size: 1.5rem; }
main { flex: 1; display: grid; place-content: center; text-align: center; padding: 24px; gap: 12px; }
#answer { font-size: clamp(3rem, 18vw, 12rem); font-weight: 900; line-height: 1.1; overflow-wrap: anywhere; }
#answer.yes { color: var(--green); }
#answer.no { color: var(--red); }
#check-error { color: var(--accent); }
</style>
<script type="module" src="./js/ui/site-nav.js"></script>
</head>
<body>
<h1>Are you endgame?</h1>
<div id="save-area"></div>
<main aria-live="polite" aria-atomic="true">
  <div id="answer"></div>
  <div id="check-error" role="alert"></div>
</main>
<script type="module">
import { initSaveLoader } from './js/ui/save-loader.js';
import { isEndgamer } from './js/endgamers.js';

const answer = document.getElementById('answer');
const errorMessage = document.getElementById('check-error');
let checkVersion = 0;

initSaveLoader({
  target: '#save-area',
  auth: true,
  skipLoad: true,
  async onLoad(_saveData, raw) {
    const version = ++checkVersion;
    answer.textContent = '';
    answer.className = '';
    errorMessage.textContent = '';
    try {
      const matched = await isEndgamer(raw);
      if (version === checkVersion) {
        answer.textContent = matched ? 'YES' : 'NO';
        answer.className = matched ? 'yes' : 'no';
      }
    } catch (error) {
      if (version === checkVersion) errorMessage.textContent = 'Unable to check account: ' + error.message;
    }
  }
});
</script>
</body>
</html>
