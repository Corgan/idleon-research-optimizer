<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idleon Sneaking Optimizer</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --accent: #e94560; --text: #eee; --text2: #c0c0d4;
  --gold: #ffd700; --green: #4caf50; --blue: #2196f3;
  --purple: #bb86fc; --cyan: #4dd0e1; --red: #f44;
  --border: #444; --text1: #eee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
h1 { text-align: center; padding: 12px; background: var(--bg2); border-bottom: 2px solid var(--accent); font-size: 1.4em; }
h1 span { color: var(--accent); }



/* Custom tooltip */
#js-tip { display:none; position:fixed; z-index:9999; max-width:360px; padding:8px 12px; background:#1a1a2e; border:1px solid var(--gold); border-radius:6px; color:var(--text); font-size:.72em; line-height:1.5; white-space:pre-line; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,.5); }

/* Main layout */
.main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.section { background: var(--bg2); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.section h2 { margin-bottom: 12px; color: var(--accent); font-size: 1.15em; border-bottom: 1px solid #333; padding-bottom: 6px; }
.section h3 { margin: 12px 0 8px; color: var(--cyan); font-size: 1em; }

/* Cards */
.card-grid { display: grid; gap: 10px; }
.card-grid.cols-2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card-grid.cols-3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.card-grid.cols-4 { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.card-grid.cols-5 { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.card { background: var(--bg3); border-radius: 8px; padding: 10px 12px; border: 1px solid #444; }
.card .card-title { font-weight: 700; font-size: .85em; color: var(--cyan); margin-bottom: 2px; }
.card .card-val { font-weight: 700; font-size: 1.5em; color: var(--gold); }
.card .card-sub { color: var(--text2); font-size: .75em; }

/* Tables */
.data-table { width: 100%; border-collapse: collapse; font-size: .82em; }
.data-table th { text-align: left; padding: 5px 6px; color: var(--text2); border-bottom: 1px solid #333; font-weight: 600; position: sticky; top: 0; background: var(--bg2); }
.data-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.04); }
.data-table tr:hover td { background: rgba(255,255,255,.03); }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* Detection bar */
.det-bar { height: 6px; border-radius: 3px; background: #333; overflow: hidden; min-width: 50px; display: inline-block; width: 50px; vertical-align: middle; }
.det-fill { height: 100%; border-radius: 3px; }
.det-fill.safe { background: var(--green); }
.det-fill.warn { background: orange; }
.det-fill.danger { background: var(--red); }

/* Twin row */
.twin-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); align-items: start; }
.twin-row:last-child { border-bottom: none; }
.twin-name { font-weight: 700; color: var(--gold); font-size: .9em; }
.twin-name .floor-badge { color: var(--blue); font-weight: 600; font-size: .8em; }
.twin-stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82em; }
.twin-stats .lbl { color: var(--text2); }
.twin-stats .val { font-weight: 600; }
.twin-charm { font-size: .78em; color: var(--cyan); }

/* Badges */
.badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: .72em; font-weight: 700; }
.badge-green { background: rgba(76,175,80,.2); color: var(--green); }
.badge-gold { background: rgba(255,215,0,.15); color: var(--gold); }
.badge-blue { background: rgba(33,150,243,.15); color: var(--blue); }

/* Mastery table */
.mastery-tbl { width: 100%; border-collapse: collapse; font-size: .78em; }
.mastery-tbl th { padding: 4px 6px; color: var(--text2); border-bottom: 2px solid #444; font-weight: 600; text-align: right; white-space: nowrap; position: sticky; top: 0; background: var(--bg2); z-index: 2; }
.mastery-tbl th.left { text-align: left; }
.mastery-tbl td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.04); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mastery-tbl td.left { text-align: left; }
.mastery-tbl tr:hover td { background: rgba(255,255,255,.03); }
.mastery-tbl .col-floor { text-align: center; font-weight: 700; color: var(--gold); }
.mastery-tbl .col-flowers { color: var(--text2); }
.mastery-tbl .col-funeral { color: var(--purple); font-weight: 600; }
.mastery-tbl .col-det { font-weight: 600; }
.mastery-tbl .col-jade { color: var(--gold); }
.mastery-tbl .col-flhr { color: var(--purple); }
.mastery-tbl .col-door { color: var(--text); }
.mastery-tbl .col-0pct { color: var(--text2); position: relative; cursor: help; }
.mastery-tbl .col-0pct .tt { display: none; position: fixed; background: #1a1a2e; border: 1px solid #666; border-radius: 4px; padding: 4px 8px; white-space: nowrap; z-index: 100; font-size: .95em; line-height: 1.6; pointer-events: none; text-align: left; }
.mastery-tbl .col-0pct:hover .tt { display: block; }
.mastery-tbl .mg-sep { border-left: 2px solid #555; }
.mastery-tbl .mcur { background: rgba(233,69,96,.04); }
.mastery-tbl thead th.mcur { background: var(--bg2); border-bottom-color: var(--accent); }
.mg-detail { display: none; }
.mg-detail.open { display: table-row; }
.mg-detail td { padding: 0; background: var(--bg3); }
.mg-detail .data-table th { padding: 2px 4px; }
.mg-detail .data-table td { padding: 1px 4px; }

/* Primary calculator views */
.workspace-tabs { display:flex; gap:2px; margin-bottom:12px; background:var(--bg2); border-bottom:1px solid #333; overflow-x:auto; }
.workspace-tab { flex:0 0 auto; padding:10px 18px; cursor:pointer; color:var(--text2); background:transparent; border:0; border-bottom:2px solid transparent; font:inherit; font-size:.88em; font-weight:600; }
.workspace-tab:hover { color:var(--text); background:rgba(255,255,255,.05); }
.workspace-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.workspace-panel { display:none; }
.workspace-panel.active { display:block; }
.mode-selector { flex-wrap:wrap; }
.scenario-strip { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.scenario-chip { padding:3px 7px; border:1px solid #45506a; border-radius:4px; background:rgba(0,0,0,.16); color:var(--text2); font-size:.7em; }
.scenario-chip strong { color:var(--cyan); }
.scenario-chip.expected { border-color:#9b7b30; color:var(--gold); }
.scenario-chip.partial { border-color:var(--red); color:#ff9b9b; }
.decision-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:8px 0; }
.decision-card { background:var(--bg3); border:1px solid #46516f; border-radius:6px; padding:9px 11px; min-width:0; }
.decision-card h3 { margin:0 0 5px; font-size:.8em; color:var(--cyan); }
.decision-value { color:var(--gold); font-size:1.15em; font-weight:700; overflow-wrap:anywhere; }
.decision-sub { color:var(--text2); font-size:.7em; line-height:1.4; margin-top:3px; }
.move-list { display:grid; gap:3px; margin-top:6px; }
.move-row { display:flex; gap:6px; justify-content:space-between; border-top:1px solid rgba(255,255,255,.05); padding-top:3px; color:var(--text2); font-size:.68em; }
.mobile-floor-list { display:none; gap:8px; }
.mobile-floor-card { background:var(--bg3); border:1px solid #46516f; border-radius:6px; padding:9px; }
.mobile-floor-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:6px; }
.mobile-floor-head strong { color:var(--gold); }
.mobile-floor-mastery { color:var(--cyan); font-size:.74em; }
.mobile-floor-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
.mobile-stat { min-width:0; padding:4px 5px; background:rgba(0,0,0,.14); border-radius:4px; }
.mobile-stat span { display:block; color:var(--text2); font-size:.66em; }
.mobile-stat strong { display:block; margin-top:1px; color:var(--text); font-size:.82em; overflow-wrap:anywhere; }
@media (max-width:700px) {
  .desktop-mastery-wrap { display:none; }
  .mobile-floor-list { display:grid; }
  .decision-grid { grid-template-columns:1fr; }
  .move-row { flex-wrap:wrap; justify-content:flex-start; font-size:.72em; }
}

/* Shared formula breakdown tree */
.formula-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; font-size:.82em; color:var(--text2); }
.formula-controls select { background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px 7px; }
.formula-tabs { display:flex; background:rgba(0,0,0,.2); border-bottom:1px solid #333; margin-bottom:12px; }
.formula-tab { padding:8px 18px; cursor:pointer; color:var(--text2); background:transparent; border:0; border-bottom:2px solid transparent; font:inherit; font-weight:600; }
.formula-tab:hover { color:var(--text); background:rgba(255,255,255,.05); }
.formula-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.formula-panel { display:none; }
.formula-panel.active { display:block; }
.bt-controls { margin-bottom:8px; display:flex; gap:6px; }
.bt-controls .btn-sm { padding:4px 10px; background:var(--bg3); color:var(--text2); border:1px solid var(--border); border-radius:4px; cursor:pointer; font-size:.8em; }
.bt-controls .btn-sm:hover { color:var(--cyan); border-color:var(--cyan); }
.bt-tree { font-size:.85em; }
.bt-row { display:flex; align-items:center; gap:6px; padding:3px 4px; border-bottom:1px solid rgba(255,255,255,.04); min-height:26px; cursor:pointer; }
.bt-row:hover { background:rgba(255,255,255,.07); }
.bt-children { background:rgba(0,0,0,.12); border-left:2px solid rgba(255,255,255,.08); }
.bt-root { font-weight:700; font-size:1.05em; padding-top:6px; padding-bottom:6px; border-bottom:2px solid var(--border); }
.bt-arrow { cursor:pointer; color:var(--text2); width:14px; text-align:center; user-select:none; flex-shrink:0; }
.bt-arrow:hover { color:var(--cyan); }
.bt-label { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bt-val { font-weight:600; text-align:right; flex-shrink:0; white-space:nowrap; margin-left:auto; font-variant-numeric:tabular-nums; }
.bt-tooltip { position:fixed; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 12px; font-size:.82em; max-width:350px; pointer-events:none; z-index:9999; display:none; }

/* Charm pills */
.charm-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.charm-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid #444; border-radius: 14px; padding: 3px 10px 3px 8px; font-size: .78em; white-space: nowrap; }
.charm-pill.gold { border-color: var(--gold); background: rgba(255,215,0,.06); }
.charm-pill .cp-name { font-weight: 600; }
.charm-pill .cp-lv { color: var(--gold); font-size: .9em; }
.charm-pill .cp-stat { color: var(--cyan); font-size: .9em; }
.charm-pill .cp-type { color: var(--text2); font-size: .85em; }
.charm-pill .cp-best { color: var(--green); font-weight: 700; font-size: .8em; margin-left: 2px; }

/* Shared slot size */
:root { --slot-size: 52px; }
/* Inventory grid */
.inv-grid-wrap { width:100%; overflow-x:auto; padding-bottom:4px; }
.inv-grid { display:grid; width:max-content; grid-template-columns:repeat(13, var(--slot-size)); gap:3px; margin:0 auto; }
.inv-slot { background: #1a1510; border: 2px solid transparent; border-radius: 3px; width: var(--slot-size); height: var(--slot-size); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 1px; min-width: 0; position: relative; cursor: default; }
.inv-slot.gold { background: rgba(255,215,0,.08); }
.inv-slot.best { border-color: var(--green) !important; }
.inv-slot.empty { background: #1a1510; border-color: #3a3028; }
.inv-slot .is-name { font-size: .45em; font-weight: 600; color: var(--text2); text-align: center; line-height: 1.05; overflow: hidden; max-height: 2em; word-break: break-word; }
.inv-slot .is-lv { font-size: .58em; color: #7f7; font-weight: 700; position: absolute; top: 1px; left: 2px; text-shadow: 1px 1px 0 #000; }
.inv-slot .is-best { position: absolute; top: 1px; right: 2px; font-size: .45em; color: var(--green); font-weight: 700; }
.inv-slot:hover .is-tip, .inv-slot:focus .is-tip, .inv-slot.tip-open .is-tip { display:block; }
.inv-slot .is-tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid #666; border-radius: 4px; padding: 3px 6px; white-space: nowrap; z-index: 20; font-size: .68em; pointer-events: none; text-align: center; line-height: 1.4; }
.inv-section { background: #1c1810; border: none; padding: 8px !important; flex: 1.3; min-width: 0; }
.inv-section .loadout-title { border-bottom-color: #5a4a38; color: var(--gold); }

/* Side-by-side wrapper */
.sneak-top { display: flex; gap: 8px; align-items: flex-start; }
@media (max-width: 700px) { .sneak-top { flex-direction: column; } .inv-grid { grid-template-columns: repeat(13, var(--slot-size)); } }

/* Loadout section */
.loadout-section { background: #141828; border: 2px solid #3a4a7a; padding: 8px !important; flex: 0.7; min-width: 0; }
.loadout-title { text-align: center; color: var(--gold); font-size: .85em; letter-spacing: 2px; border-bottom: 1px solid #5a4a38; padding-bottom: 3px; margin-bottom: 4px; }
.loadout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.loadout-card { display: flex; flex-direction: column; background: #2a2218; border: 1px solid #5a4a38; border-radius: 3px; padding: 3px 4px; gap: 3px; }
.lo-info { display: flex; gap: 6px; align-items: center; }
.lo-name { font-weight: 700; color: var(--text); font-size: .62em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lo-lv { font-size: .52em; color: var(--cyan); font-weight: 600; }
.lo-floor { font-size: .48em; color: var(--text2); }
.lo-stats { font-size: .46em; color: var(--text2); display: flex; gap: 6px; margin-left: auto; }
.lo-stats span { white-space: nowrap; }
.lo-equip { display: flex; gap: 2px; }
.lo-slot { border: 1px solid #5a4a38; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1px; position: relative; width: var(--slot-size); height: var(--slot-size); flex-shrink: 0; }
.lo-slot.gold { border-color: var(--gold); }
.lo-slot.empty { opacity: .3; border-style: dashed; background: #1a1510; }
.lo-slot-lv { font-size: .5em; color: #fff; font-weight: 700; position: absolute; top: 0; left: 2px; text-shadow: 1px 1px 0 #000; }
.lo-slot-name { font-size: .42em; color: var(--text2); text-align: center; line-height: 1.05; word-break: break-word; overflow: hidden; max-height: 2em; margin-top: 2px; }
.lo-slot-label { font-size: .42em; color: #555; font-style: italic; }
/* Symbol level border + background colors */
.sym-lv1 { border-color: #8B6914 !important; background: rgba(139,105,20,.15) !important; }
.sym-lv2 { border-color: #9a9a9a !important; background: rgba(154,154,154,.12) !important; }
.sym-lv3 { border-color: #d4a017 !important; background: rgba(212,160,23,.12) !important; }
.sym-lv4 { border-color: #4a90d9 !important; background: rgba(74,144,217,.12) !important; }
.sym-lv5 { border-color: #b060d0 !important; background: rgba(176,96,208,.12) !important; }
.sym-lv6 { border-color: #c0c8d0 !important; background: rgba(192,200,208,.12) !important; }
.sym-lv7 { border-color: #3ddc84 !important; background: rgba(61,220,132,.12) !important; }
.sym-lv1, .sym-lv2, .sym-lv3, .sym-lv4, .sym-lv5, .sym-lv6, .sym-lv7 { border-width: 2px; }
.sym-dots { display: flex; gap: 2px; justify-content: center; position: absolute; bottom: 1px; left: 0; right: 0; line-height: 1; }
.sym-dots .sd { width: 3px; height: 3px; border-radius: 50%; display: inline-block; }
.inv-slot .sym-dots .sd { width: 2px; height: 2px; }
.inv-slot .sym-dots { bottom: 0; gap: 1px; }
@media (max-width: 600px) { .loadout-grid { grid-template-columns: 1fr; } }
@keyframes dotPulse { 0%,20% { opacity:.2; } 50% { opacity:1; } 100% { opacity:.2; } }
.loading-dots { animation: dotPulse 1.4s infinite; }
</style>
</head>

<script type="module">
'use strict';

import { saveData } from './js/state.js';
import { initSaveLoader } from './js/ui/save-loader.js';
import { NjEQ } from './js/stats/data/game/custommaps.js';
import {
  NK_COUNT, FLOOR_COUNT,
  nkName, nkBonus,
  floorDetectionBase, floorJadeBase, floorExpMult, floorActions, doorHP,
  detectionChance, actionSpeed, koDuration,
  stealthValue,
  parseTwinData, parseTwinEquip,
  isTwinUntied,
  captiveTargetForFloor, untieReq,
  sneakingActionMode,
  fmtJade,
  charmStat, charmBonusType, charmDisplayName, isGoldCharm, equipInfo,
  funeralStealthBonus, nkBonusFull,
  stealthForDetection, maxCharmDropLevel, maxDropLevel,
  parseInventoryCharms, bestInventoryBonuses,
  floorDropTable, CHARM_BONUS_TYPES,
  doorEffectiveHP,
  doorState,
  allyStealthMulti, simStealth,
} from './js/stats/systems/w6/sneaking-math.js';
import { computeCoreStealth, computeCoreStealthDetailed, computeTwinStealth, findBestActiveChar, getTwinAllyContributions, computeActionSpeed, computeNK11Extras, computeDoorDamageDetailed, computeUntieProgressDetailed, buildStealthBreakdown, weaponItemStat, soloMultiplier } from './js/stats/systems/w6/sneaking-stealth.js';
import { computeDoorClearEstimate, computeJadeRate, computeTeamDoorRates, computeSneakingTeamScenario, buildJadeBreakdown, buildDoorRateBreakdown } from './js/stats/systems/w6/sneaking-jade.js';
import { bestItemByScore, canEquipCharmPair, charmPairOrders } from './js/stats/systems/w6/sneaking-optimizer.js';
import { bubbleValByKey } from './js/stats/systems/w2/alchemy.js';
import { emporiumBonus } from './js/game-helpers.js';
import { renderBreakdownTree, resetTreeCounter } from './js/ui/dash-breakdowns.js';
import { toRenderNode } from './js/stats/tree-builder.js';
import { node } from './js/stats/node.js';

// ===== SAVE LOADING =====
initSaveLoader({
  target: '#save-area',
  onLoad: function() {
    _invalidateGridCache();
    _renderAll();
  },
  auth: true
});

// ===== JS TOOLTIP =====
(function() {
  var tip = document.getElementById('js-tip');
  function showTip(el, x, y) {
    tip.textContent = el.getAttribute('data-tip');
    tip.style.display = 'block';
    tip.setAttribute('aria-hidden', 'false');
    if (x == null || y == null) {
      var rect = el.getBoundingClientRect();
      x = rect.left;
      y = rect.bottom + 6;
    }
    if (x + tip.offsetWidth > window.innerWidth - 8) x = Math.max(8, window.innerWidth - tip.offsetWidth - 8);
    if (y + tip.offsetHeight > window.innerHeight - 8) y = Math.max(8, y - tip.offsetHeight - 12);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip() {
    tip.style.display = 'none';
    tip.setAttribute('aria-hidden', 'true');
  }
  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest('[data-tip]');
    if (!el) { hideTip(); return; }
    showTip(el, e.clientX + 12, e.clientY + 12);
  });
  document.addEventListener('mousemove', function(e) {
    if (tip.style.display !== 'block') return;
    var x = e.clientX + 12, y = e.clientY + 12;
    if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 8;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('mouseout', function(e) {
    if (e.target.closest('[data-tip]')) hideTip();
  });
  document.addEventListener('focusin', function(e) {
    var el = e.target.closest('[data-tip]');
    if (el) showTip(el);
  });
  document.addEventListener('focusout', function(e) {
    if (e.target.closest('[data-tip]')) hideTip();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideTip();
  });
})();

function _prepareAccessibleTooltips(root) {

function _renderFormulaBreakdowns(twins) {
  if (!twins || twins.length === 0) return;
  var selectedIdx = Number(window._sneakBreakdownTwin);
  var selected = null;
  for (var i = 0; i < twins.length; i++) {
    if (twins[i].idx === selectedIdx) { selected = twins[i]; break; }
  }
  if (!selected) selected = twins[0];
  window._sneakBreakdownTwin = selected.idx;

  var floors = [];
  for (var floorIdx = 0; floorIdx < _playerCount(); floorIdx++) {
    floors[floorIdx] = Number(_nd()[floorIdx] && _nd()[floorIdx][0]) || 0;
  }
  var activeCharIdx = twins.activeCharIdx != null ? twins.activeCharIdx : _loginContextIdx(0);
  var koTime = koDuration(_nkLvs(), selected.koPct);
  var selectedDoor = doorState(selected.floor, _mastery(), _masteryMax(), _mastery(), _nd());
  var jadeOptions = {
    activeCharIdx: activeCharIdx,
    floor: selected.floor,
    mastery: _mastery(),
    twinFloors: floors,
    detection: detectionChance(selected.stealth, selected.floor, _mastery()),
    actionSpeed: selected.actionSpd,
    koTime: koTime,
    dodgePct: selected.dodgePct,
    charmBonuses: selected.charmMap,
  };
  var floorTwins = twins.filter(function(twin) { return twin.floor === selected.floor; });
  var floorRates = computeTeamDoorRates(floorTwins.map(function(twin) {
    return {
      actionSpeed: twin.actionSpd,
      detection: detectionChance(twin.stealth, twin.floor, _mastery()),
      koTime: koDuration(_nkLvs(), twin.koPct),
      dodgePct: twin.dodgePct,
      taunting: (twin.charmMap[1] || 0) > 0,
    };
  }));
  var selectedTeamRate = null;
  for (var rateIdx = 0; rateIdx < floorTwins.length; rateIdx++) {
    if (floorTwins[rateIdx].idx === selected.idx) selectedTeamRate = floorRates[rateIdx];
  }

  resetTreeCounter();
  renderBreakdownTree(toRenderNode(buildStealthBreakdown(selected.idx, selected.floor, floors, saveData, activeCharIdx)), document.getElementById('sneak-stealth-tree'), { tooltipId: 'bt-tooltip' });
  renderBreakdownTree(toRenderNode(buildJadeBreakdown(selected.idx, saveData, jadeOptions)), document.getElementById('sneak-jade-tree'), { tooltipId: 'bt-tooltip' });
  renderBreakdownTree(toRenderNode(buildDoorRateBreakdown(selected.idx, saveData, {
    activeCharIdx: activeCharIdx,
    actionSpeed: selected.actionSpd,
    detection: jadeOptions.detection,
    koTime: koTime,
    dodgePct: selected.dodgePct,
    doorActive: selectedDoor.active,
    teamRate: selectedTeamRate,
  })), document.getElementById('sneak-door-tree'), { tooltipId: 'bt-tooltip' });
  var runtimeScenario = computeSneakingTeamScenario(floorTwins.map(function(twin) {
    return {
      idx: twin.idx,
      actionSpeed: twin.actionSpd,
      detection: detectionChance(twin.stealth, twin.floor, _mastery()),
      koTime: koDuration(_nkLvs(), twin.koPct),
      dodgePct: twin.dodgePct,
      taunting: (twin.charmMap[1] || 0) > 0,
      actionProgress: twin.actionProgress,
      stealth: twin.stealth,
      itemFindPct: twin.itemFindPct,
      charmBonuses: twin.charmMap,
      weaponSubtype: twin.weaponSubtype,
      doorDamage: twin.door,
      untieProgress: twin.untie,
      isSolo: soloMultiplier(14, twin.idx, _nd(), _playerCount()) > 1,
    };
  }), saveData, {
    activeCharIdx: activeCharIdx,
    floor: selected.floor,
    mastery: _mastery(),
    doorActive: selectedDoor.active,
    ninjaData: _nd(),
    twinFloors: floors,
    itemBatchHours: _itemBatchHours(),
    bubbleY9Val: Number(bubbleValByKey('Y9ACTIVE', activeCharIdx, saveData)) || 1,
    flowerMode: _flowerMode(),
    flowerBatchHours: _flowerBatchHours(),
    initialFlowers: Number(_flowers()[selected.floor]) || 0,
    playerCount: _playerCount(),
    doorMaxHP: selectedDoor.maxHP,
    doorProgress: selectedDoor.progress,
  });
  var runtimeRowIdx = floorTwins.findIndex(function(twin) { return twin.idx === selected.idx; });
  var runtimeRow = runtimeScenario.twins[runtimeRowIdx];
  var runtimeTree = node(selected.name + ' Runtime', 0, [
    node('Action Mode', 0, null, { fmt: 'raw', note: runtimeRow.mode }),
    node('Runtime Attempts per Hour', runtimeRow.attemptsPerHour, null, { fmt: 'rate' }),
    node('Successful Actions per Hour', runtimeRow.successfulActionsPerHour, null, { fmt: 'rate' }),
    node(_flowerMode() === 'offline' ? 'Net Flowers per Hour' : 'Flowers per Hour', runtimeRow.flowersPerHour, null, {
      fmt: 'rate',
      note: runtimeScenario.offlineFlowerApproximate ? 'Bounded probability-state approximation' : 'Native-order probability states',
    }),
    node('Jade per Hour', runtimeRow.jadePerHour, [
      node('Jade per Successful Action', runtimeRow.jadePerAction, null, { fmt: 'raw' }),
      node('Game Display Jade per Hour', runtimeRow.gameDisplayJadePerHour, null, { fmt: 'raw', note: 'Native panel estimate; runtime value is the parent node' }),
    ], { fmt: 'raw' }),
    node('Expected Items per Hour', runtimeRow.itemsPerHour, null, {
      fmt: 'rate',
      note: _itemBatchHours() + ' hour successful-action batch'
        + (runtimeScenario.itemBatchApproximate ? '; bounded probability-state approximation' : ''),
    }),
    node('Door Damage per Hour', runtimeRow.doorDamagePerHour, [
      node('Damage per Hit', runtimeRow.doorDamagePerHit, null, { fmt: 'raw' }),
      node('Door Hits per Hour', runtimeRow.doorHitsPerHour, null, { fmt: 'rate' }),
    ], { fmt: 'raw' }),
    node('Untie Progress per Hour', runtimeRow.untieProgressPerHour, [
      node('Progress per Hit', runtimeRow.untieProgressPerHit, null, { fmt: 'raw' }),
    ], { fmt: 'raw' }),
    node('Taunting Mark Coupling', runtimeRow.coupled ? 1 : 0, null, { fmt: 'raw', note: runtimeRow.coupled ? 'Expected team-progress model' : 'Exact independent runtime formula' }),
  ], { fmt: 'raw', note: 'Diagnostic root; child nodes use their own units under the saved floor and loadout' });
  renderBreakdownTree(toRenderNode(runtimeTree), document.getElementById('sneak-runtime-tree'), { tooltipId: 'bt-tooltip' });
}

// ==================== GRID RENDERING (cached per mode) ====================
var _gridCache = {}; // key: mode+':'+allItems → HTML string
var _recommendationCache = {};
var _gridRunToken = 0;
function _invalidateGridCache() { _gridCache = {}; _recommendationCache = {}; _gridRunToken++; }
function _yieldBrowser() { return new Promise(function(resolve) { setTimeout(resolve, 0); }); }

function _objectiveComparisonHtml(useAllItems) {
  var compareRows = [];
  var comparable = [];
  ['jade','flower','itemfind','door','untie'].forEach(function(mode) {
    var cached = _recommendationCache[mode];
    if (!cached || cached.mastery !== _mastery()
      || cached.batchHours !== _itemBatchHours() || cached.projectionFlowers !== _projectionFlowers()
      || cached.useAllItems !== useAllItems || cached.sandboxCopies !== _sandboxCopies()
      || cached.deepRefinement !== _deepRefinement() || cached.flowerMode !== _flowerMode()
      || cached.flowerBatchHours !== _flowerBatchHours()
      || cached.currentMasteryOnly !== !!window._sneakCurrentMasteryOnly) return;
    comparable.push({ mode: mode, cached: cached });
    compareRows.push('<div class="move-row"><span>' + OPT_MODES[mode].label + '</span><span>Floor ' + cached.floor + '</span><span>'
      + (cached.comparisonText || (cached.totalGain === Infinity ? 'new output vs saved' : (cached.totalGain >= 0 ? '+' : '') + cached.totalGain.toFixed(2) + '% vs saved')) + '</span></div>');
  });
  var frontier = comparable.filter(function(candidate) {
    return !comparable.some(function(other) {
      if (other === candidate) return false;
      var atLeast = true;
      var greater = false;
      ['jade','flower','itemfind','door','untie'].forEach(function(metric) {
        if (other.cached.outcomes[metric] < candidate.cached.outcomes[metric]) atLeast = false;
        if (other.cached.outcomes[metric] > candidate.cached.outcomes[metric]) greater = true;
      });
      return atLeast && greater;
    });
  });
  var frontierNames = frontier.map(function(row) { return OPT_MODES[row.mode].label; }).join(', ');
  return compareRows.length ? '<div class="decision-card"><h3>Objective Comparison</h3><div class="decision-sub">Completed searches under the current assumptions. Nondominated frontier: '
    + (frontierNames || 'none yet') + '.</div><div class="move-list">' + compareRows.join('') + '</div></div>' : '';
}

function _refreshObjectiveComparison(root, useAllItems) {
  var slot = root && root.querySelector('[data-objective-comparison]');
  if (slot) slot.innerHTML = _objectiveComparisonHtml(useAllItems);
}

function _renderGrid() {
  var gridEl = document.getElementById('grid-content');
  if (!gridEl) return;

  var curMode = window._sneakMode || 'current';
  var useAllItems = !!(window._sneakAllItems && curMode !== 'current');
  var currentMasteryOnly = !!window._sneakCurrentMasteryOnly;
  var cacheKey = curMode + ':' + (useAllItems ? '1' : '0') + ':' + (currentMasteryOnly ? 'cur' : 'range')
    + ':' + _projectionFlowers() + ':' + _itemBatchHours() + ':' + _sandboxCopies() + ':' + (_deepRefinement() ? 'deep' : 'fast')
    + ':' + _flowerMode() + ':' + _flowerBatchHours();

  var token = ++_gridRunToken;
  // Check cache first
  if (_gridCache[cacheKey]) {
    gridEl.innerHTML = _gridCache[cacheKey];
    _refreshObjectiveComparison(gridEl, useAllItems);
    _prepareAccessibleTooltips(gridEl);
    return;
  }

  // Show loading
  gridEl.innerHTML = '<div class="loading" style="padding:12px;color:var(--text2);font-size:.85em;">Preparing scenario…</div>';

  // Defer heavy work so loading message renders

      h += '<td class="col-door' + cc2 + '" data-tip="State: ' + cd.doorStateLabel + '\nRemaining door HP: ' + _fmt(cd.hp) + '\nMaximum door HP: ' + _fmt(cd.doorMaxHP) + '\nSaved damage: ' + _fmt(cd.doorProgress) + '\nAverage damage/successful hit: ' + _fmt(cd.doorAverageDamagePerHit) + '\nEstimated successful hits needed: ' + (isFinite(cd.doorRequiredHits) ? _fmt(cd.doorRequiredHits) : '—') + '\nSuccessful hits/hr: ' + _perHour(cd.totalDoorHitsHr) + '\nFluid DPS ETA (not displayed): ' + (isFinite(cd.doorFluidEta) ? _timeStr(cd.doorFluidEta) : '—') + '">' + (isFinite(cd.doorEta) ? _timeStr(cd.doorEta) : cd.doorStateLabel) + '</td>';
      h += '<td class="' + cc2 + '" data-tip="' + (cd.captiveIdx >= 0 ? 'Twin ' + (cd.captiveIdx + 1) + ' remaining progress: ' + _fmt(cd.untieRemaining) + '\nProgress/hr: ' + _fmt(cd.totalUntieHr) : 'No captive assigned to this floor') + '">' + (isFinite(cd.untieEta) ? _timeStr(cd.untieEta) : cd.captiveIdx >= 0 ? 'Need Kunai' : '—') + '</td>';
      var thresholdTipId = 'threshold-tip-' + fl + '-' + mi2;
      h += '<td class="col-0pct' + cc2 + '" tabindex="0" aria-describedby="' + thresholdTipId + '">' + _fmt(thresh[5].stealth);
      h += '<span class="tt" id="' + thresholdTipId + '" role="tooltip">';
      var ttSet = cd._set || defaultSet;
      for (var si2 = 0; si2 < thresh.length; si2++) {
        var fmNeeded = _funeralMultiForStealth(fl, thresh[si2].stealth, ttSet);
        var fmStr = fmNeeded === Infinity || fmNeeded > 1e15 ? '-' : _fmtMulti(fmNeeded);
        h += thresh[si2].label + ': ' + _fmt(thresh[si2].stealth) + ' (🌸' + fmStr + ')' + (si2 < thresh.length - 1 ? '<br>' : '');
      }
      h += '</span></td>';

      // Rebuild time — how long to farm current flowers at this mastery's flower rate
      if (mIsCur[mi2]) {
        h += '<td class="' + cc2 + '" style="color:var(--text2);">—</td>';
      } else {
        var rebuildHrs = _flowerRecoveryHours(fl, masteryLevels[mi2], cd1.flCount, cd._set || defaultSet);
        h += '<td class="' + cc2 + '" style="color:' + (rebuildHrs > 0 ? 'var(--gold)' : 'var(--text2)') + ';" title="Stepwise recovery to ' + _fmt(cd1.flCount) + ' flowers; detection and KO rate update as flowers accumulate">' + (rebuildHrs > 0 && isFinite(rebuildHrs) ? _timeStr(rebuildHrs) : '—') + '</td>';
      }
    }
    h += '</tr>';

    // Detail row (hidden) — colspan cells matching parent mastery column groups
    h += '<tr class="mg-detail" id="detail-' + rowId + '">';
    var cd2_0 = cd1;
    var hasConfigLabel = curMode !== 'current' && cd1.configLabel;
    for (var mi3 = 0; mi3 < mCount; mi3++) {
      var cd2 = mIsCur[mi3] ? cd1 : _bestCellData(fl, masteryLevels[mi3]);
      var isFirstCol = (mi3 === 0);
      h += '<td colspan="' + (isFirstCol ? '10' : '8') + '" style="vertical-align:top;padding:0;">';
      if (curMode !== 'current' && cd2.configLabel) {
        h += '<div style="font-size:.68em;color:var(--cyan);font-weight:600;padding:2px 4px;">' + cd2.configLabel + '</div>';
      }
      h += '<table class="data-table" style="margin-top:0;font-size:.82em;">';
      h += '<tr>';
      if (isFirstCol) h += '<th></th>';
      if (curMode !== 'current') h += '<th>Loadout</th>';
      h += '<th>Action</th><th class="num">Detection</th><th class="num">Interval</th><th class="num">KO time</th><th class="num">Jade/hr</th><th class="num">Flowers/hr</th><th class="num">Items/hr</th><th class="num">Damage/hit</th><th class="num">Hit chance</th><th class="num">Hits/hr</th><th class="num">Door dmg/hr</th><th class="num">Untie/hr</th></tr>';
      for (var pt = 0; pt < cd2.perTwin.length; pt++) {
        var p = cd2.perTwin[pt];
        var secPerAct = 3600 / p.spd;
        h += '<tr style="' + (p.onFloor ? 'background:rgba(77,208,225,.06);' : '') + '">';
        if (isFirstCol) h += '<td style="font-size:.9em;white-space:nowrap;padding:1px 4px;">' + p.name + '</td>';
        if (curMode !== 'current' && p.equip) {
          var eqParts = [];
          for (var ei = 1; ei < p.equip.length; ei++) {
            if (p.equip[ei] && p.equip[ei].name !== 'Blank') {
              var einfo = equipInfo(p.equip[ei].name, p.equip[ei].level);
              var fullN = einfo ? einfo.name : p.equip[ei].name;
              var abbr = fullN.replace(/^Gold /,'G.').replace(/Thundergloves/,'TG').replace(/Scroll of Power/,'SoP').replace(/Yellow Belt/,'YB').replace(/Lotus Flower/,'LF').replace(/Rosaries/,'R').replace(/Meteorite Belt/,'MB').replace(/Nunchaku/,'Nk');
              eqParts.push('<span title="' + fullN + '">' + abbr + '</span>');
            } else if (ei >= 2) {
              eqParts.push('<span title="Empty slot" style="opacity:.4;">∅</span>');
            }
          }
          h += '<td style="font-size:.7em;color:var(--text2);white-space:nowrap;">' + eqParts.join(', ') + '</td>';
        }
        h += '<td style="text-transform:capitalize;color:var(--cyan);">' + p.actionMode.replace('-', ' ') + '</td>';
        h += '<td class="num" style="color:' + _detColor(p.det) + ';font-weight:600;">' + _pct(p.det) + '</td>';
        h += '<td class="num">' + secPerAct.toFixed(1) + 's</td>';
        h += '<td class="num" style="color:var(--red);">' + (p.koProb > 0 ? (p.koSec / p.spd).toFixed(1) + 's' : '-') + '</td>';
        h += '<td class="num" style="color:var(--gold);" data-tip="Login context: ' + p.jadeContext + '\nGame display: ' + _fmt(p.jPA) + ' jade/hr\nJade per action: ' + _fmt(p.jadeCoin) + '\nSuccessful actions/hr: ' + p.jadeActionsHr.toPrecision(4) + '">' + _fmt(p.jHr) + '</td>';
        h += '<td class="num" style="color:var(--purple);">' + _perHour(p.flHr) + '</td>';
        h += '<td class="num" style="color:var(--text);">' + p.iHr.toFixed(2) + '</td>';
        h += '<td class="num">' + (p.canHitDoor ? _fmt(p.damagePerHit) : '—') + '</td>';
        h += '<td class="num">' + (p.canHitDoor ? _chance(p.hitChance) : '—') + '</td>';
        h += '<td class="num">' + (p.canHitDoor ? _perHour(p.hitsHr) : '—') + '</td>';
        h += '<td class="num">' + (p.canHitDoor ? _fmt(p.dmgHr) : '—') + '</td>';
        h += '<td class="num">' + (p.actionMode === 'untie' ? _fmt(p.untieHr) : '—') + '</td>';
        h += '</tr>';
      }
      h += '</table>';
      // Drops table — show for ALL mastery columns with per-type max levels
      if (cd2.dropTable.length > 0) {
        var mLvThis = masteryLevels[mi3];
        h += '<div style="margin-top:3px;"><strong style="color:var(--cyan);font-size:.68em;">Drops</strong>';
        h += '<table class="data-table" style="margin-top:1px;font-size:.78em;">';
        h += '<tr><th>Item</th><th>Type</th><th class="num" data-tip="Actual first-hit probability after earlier sequential Drop Weight rolls miss">Actual Roll (Drop Weight)</th><th class="num">Max Level</th></tr>';
        for (var di = 0; di < cd2.dropTable.length; di++) {
          var d = cd2.dropTable[di];
          var info2 = equipInfo(d.key, 0);
          var dn3 = info2 ? info2.name : d.key;
          var label3 = info2 ? info2.label : '?';
          var mxLv = maxDropLevel(d.key, nkLvs, mLvThis, nk11Extras);
          var lvStr = mxLv > 0 ? _fmt(Math.floor(mxLv)) : (info2 && info2.type === 0 ? '—' : '0');
          h += '<tr><td>' + dn3 + '</td><td style="color:var(--text2);">' + label3 + '</td>';
          h += '<td class="num" data-tip="Sequential conditional chance: ' + (100 * d.conditionalChance).toFixed(2) + '%">' + (d.chance * 100).toFixed(2) + '%</td>';
          h += '<td class="num" style="color:' + (mxLv > 0 ? 'var(--gold)' : 'var(--text2)') + ';">' + lvStr + '</td></tr>';
        }
        h += '</table></div>';
      }
      h += '</td>';
    }
    h += '</tr>';
  }

  h += '</tbody></table></div>';
  h += '<div class="mobile-floor-list">' + mobileCards + '</div>';

  _gridCache[cacheKey] = h;
  if (token !== _gridRunToken) return;
  gridEl.innerHTML = h;
  _prepareAccessibleTooltips(gridEl);
}
</script>
